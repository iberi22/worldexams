name: Monitor Deployment Failures

on:
  # Se conservan los events nativos de GitHub Deployments...
  deployment_status:
  # ⚠️ 2026-08-29: los jobs de deploy ya no declaran `environment:`, por lo que
  # deployment_status NUNCA se emite y este monitor estaba muerto. Se añade
  # workflow_run sobre los pipelines de deploy: cualquier failure/error del
  # production o preview workflow abre issue de incidente.
  workflow_run:
    workflows:
      - "Production CI/CD — GitCore Automated Release & Deploy"
      - "Deploy Preview"
    types:
      - completed

jobs:
  notify-failure:
    if: >-
      (github.event_name == 'deployment_status' &&
        (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create Incident Issue
        uses: actions/github-script@v7
        with:
          script: |
            let body;
            let title;

            if (context.eventName === 'deployment_status') {
              const deployment = context.payload.deployment;
              const status = context.payload.deployment_status;
              body = `
            ### 🚨 Despliegue Fallido Detectado

            **Entorno:** ${deployment.environment}
            **Estado:** ${status.state}
            **Commit:** ${deployment.sha}
            **Descripción:** ${status.description || 'Sin descripción'}

            [Ver Logs en Cloudflare](${status.target_url})

            Se requiere revisión manual inmediata.
            `;
              title = `🔥 Deployment Failed: ${deployment.environment} (${new Date().toISOString().split('T')[0]})`;
            } else {
              const run = context.payload.workflow_run;
              const conclusion = run.conclusion;
              body = `
            ### 🚨 Pipeline de Despliegue Fallido

            **Workflow:** ${run.name}
            **Conclusión:** ${conclusion}
            **Rama:** ${run.head_branch}
            **Commit:** ${run.head_sha}
            **Disparado por:** ${run.event}

            [Ver Run](${run.html_url})

            El gate de smoke/post-deploy detectó un problema o el deploy no
            completó. Revisar logs antes de volver a desplegar.
            `;
              title = `🔥 ${run.name} ${conclusion.toUpperCase()} (${new Date().toISOString().split('T')[0]})`;

              // Evitar duplicados: reutilizar issue abierta equivalente
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'deployment-failure',
                per_page: 20,
              });
              const dup = existing.data.find(
                (i) => i.title === title && i.body && i.body.includes(run.head_sha)
              );
              if (dup) {
                core.info(`Issue de incidente ya existente: #${dup.number}. No se duplica.`);
                return;
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deployment-failure', 'urgent']
            });
