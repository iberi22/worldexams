name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & type check
        run: |
          npm run lint
          npx tsc --noEmit --project apps/worldexams-api/tsconfig.json
          npx tsc --noEmit --project saberparatodos/tsconfig.json || echo "saberparatodos tsc: Astro project — checked via astro check in build step"

      - name: Unit tests
        run: npm test

      - name: Build Application
        run: npm run build:workspaces
        env:
          NODE_ENV: production
          PUBLIC_SITE_URL: https://${{ github.ref_name }}.saberparatodos.pages.dev
          PUBLIC_API_BASE_URL: https://api.saberparatodos.space/v1

      - name: Pre-deploy check
        run: node saberparatodos/scripts/pre-deploy-check.js

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: |
            saberparatodos/dist
            saberparatodos/scripts
            saberparatodos/wrangler.toml
            saberparatodos/package.json
          retention-days: 1

  deploy-preview:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: saberparatodos

      - name: 🔧 Normalize Cloudflare Wrangler Preview Config
        working-directory: ./saberparatodos
        run: node scripts/normalize-wrangler-config.mjs --target preview

      - name: ⚡ Deploy SaberParaTodos SSR Worker (Preview)
        id: deploy
        working-directory: ./saberparatodos
        run: |
          npx wrangler deploy --config dist/server/wrangler.json --name="saberparatodos-preview-${{ github.ref_name }}" | tee wrangler-preview.log
          PREVIEW_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' wrangler-preview.log | head -1 || true)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api-preview:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./apps/worldexams-api
        run: npm install

      - name: Deploy API Worker (Preview)
        working-directory: ./apps/worldexams-api
        run: npx wrangler deploy --name="worldexams-api-preview-${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve preview URL
        id: resolve
        run: |
          URL="${{ needs.deploy-preview.outputs.preview_url }}"
          if [ -z "$URL" ]; then
            echo "::error::No se capturó la URL *.workers.dev del deploy de preview"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      # 2026-08-29: antes este job solo hacía `echo "Preview deployment completed
      # successfully."` — no verificaba nada. Ahora ejercita la app de preview y
      # la API con los parámetros reales del frontend, y falla el job si algo
      # devuelve 4xx o payloads vacíos.
      - name: 🩺 Preview Smoke Test
        env:
          APP_URL: ${{ steps.resolve.outputs.url }}
        run: bash scripts/deploy-smoke.sh
