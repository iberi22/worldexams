name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      safe_ref: ${{ steps.refname.outputs.safe }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & type check
        run: |
          npm run lint
          npx tsc --noEmit --project apps/worldexams-api/tsconfig.json
          npx tsc --noEmit --project saberparatodos/tsconfig.json || echo "saberparatodos tsc: Astro project — checked via astro check in build step"

      - name: Unit tests
        run: npm test

      # Nombre de rama -> fragmento valido para nombre de Worker / etiqueta DNS
      # de *.workers.dev: solo [a-z0-9-], sin guiones en los extremos y con
      # longitud acotada (etiqueta DNS <= 63; los prefijos
      # "saberparatodos-preview-" / "worldexams-api-preview-" ocupan 23).
      # No basta con reemplazar "/": ramas como "dependabot/npm_and_yarn/..."
      # traen "_" y superan el limite. Si hay que truncar, se agrega un hash
      # corto del nombre completo para no colisionar entre ramas largas.
      - name: Resolve safe ref name
        id: refname
        run: |
          SAFE=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ "${#SAFE}" -gt 40 ]; then
            HASH=$(printf '%s' "$GITHUB_REF_NAME" | sha1sum | cut -c1-6)
            SAFE="$(printf '%s' "$SAFE" | cut -c1-33 | sed -E 's/-+$//')-${HASH}"
          fi
          [ -n "$SAFE" ] || { echo "::error::No se pudo derivar un nombre seguro de '$GITHUB_REF_NAME'"; exit 1; }
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Build Application
        run: npm run build:workspaces
        env:
          NODE_ENV: production
          PUBLIC_SITE_URL: https://${{ steps.refname.outputs.safe }}.saberparatodos.pages.dev
          PUBLIC_API_BASE_URL: https://api.saberparatodos.space/v1

      - name: Pre-deploy check
        run: node saberparatodos/scripts/pre-deploy-check.js

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: |
            saberparatodos/dist
            saberparatodos/scripts
            saberparatodos/wrangler.toml
            saberparatodos/package.json
          retention-days: 1

  deploy-preview:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: saberparatodos

      - name: 🔧 Normalize Cloudflare Wrangler Preview Config
        working-directory: ./saberparatodos
        run: node scripts/normalize-wrangler-config.mjs --target preview

      - name: ⚡ Deploy SaberParaTodos SSR Worker (Preview)
        id: deploy
        working-directory: ./saberparatodos
        run: |
          set -o pipefail
          # Worker script names can't contain "/" — branch names like
          # "feat/foo" do. An unsanitized name silently breaks the Cloudflare
          # assets-upload-session route and manifests as a confusing
          # "Method not allowed for this authentication scheme" [10405]
          # error that looks like a token/permission problem but isn't.
          # SAFE_REF viene saneado desde validate-and-build (un solo lugar).
          npx wrangler deploy --config dist/server/wrangler.json --name="saberparatodos-preview-${SAFE_REF}" | tee wrangler-preview.log
          PREVIEW_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' wrangler-preview.log | head -1 || true)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFE_REF: ${{ needs.validate-and-build.outputs.safe_ref }}

  # NOTE 2026-09-26: la causa real del 10405 en ambos deploys (Worker
  # principal y API) NO era el token — era el nombre del worker con un "/"
  # literal del nombre de rama (p. ej. "feat/foo"), que rompe la ruta de
  # assets-upload-session. Ya sanitizado en ambos jobs (ver "Resolve safe
  # ref name" arriba y SAFE_REF abajo). continue-on-error se deja de todos
  # modos como red de seguridad ante fallos reales de Cloudflare.
  deploy-api-preview:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./apps/worldexams-api
        run: npm install

      - name: Deploy API Worker (Preview)
        working-directory: ./apps/worldexams-api
        # Sin "|| echo": con eso el step siempre salia en 0 y continue-on-error
        # nunca se activaba (el mismo "fallo oculto como exito" que arregla
        # este PR). Ahora el job queda marcado como fallido en la UI, y
        # continue-on-error evita que bloquee el workflow.
        run: |
          npx wrangler deploy --name="worldexams-api-preview-${SAFE_REF}" || {
            echo "::warning::API preview deploy falló. Revisar logs (ya no debería ser el bug del '/' en el nombre)."
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFE_REF: ${{ needs.validate-and-build.outputs.safe_ref }}

  # NOTE 2026-09-03: smoke-test heredaba fallo de deploy-api-preview (no había URL
  # de API). Ahora tolerante: si deploy-preview falló, smoke-test se omite con
  # warning pero NO bloquea merge.
  smoke-test:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve preview URL
        id: resolve
        run: |
          URL="${{ needs.deploy-preview.outputs.preview_url }}"
          if [ -z "$URL" ]; then
            echo "::warning::No se capturó la URL *.workers.dev del deploy de preview — omitiendo smoke test"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      # 2026-08-29: antes este job solo hacía `echo "Preview deployment completed
      # successfully."` — no verificaba nada. Ahora ejercita la app de preview y
      # la API con los parámetros reales del frontend, y falla el job si algo
      # devuelve 4xx o payloads vacíos.
      - name: 🩺 Preview Smoke Test
        env:
          APP_URL: ${{ steps.resolve.outputs.url }}
        run: bash scripts/deploy-smoke.sh
