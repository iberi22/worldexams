name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        working-directory: ./apps/landing-worldexams
        run: npm install
        env:
          NODE_ENV: development

      - name: 🏗️ Build Application
        working-directory: ./apps/landing-worldexams
        run: npm run build
        env:
          # Static build - no env vars needed for landing page
          PUBLIC_SITE_URL: https://worldexams.github.io/worldexams

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: apps/landing-worldexams/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: 🏠 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
