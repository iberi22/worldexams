name: Production CI/CD — GitCore Automated Release & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Phase 1: Security Audit, Code Quality & Readiness Gates
  # =========================================================================
  audit-and-verify:
    name: 🛡️ Preflight Audit & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 🔐 Validate Secrets & Placeholders
        run: npm test

      - name: 🔍 ESLint Linting Check (0 Errors, 0 Warnings)
        run: npm run lint

      - name: 📦 Verify Wave 4 Readiness Harness
        run: node scripts/verify-wave4-readiness.mjs

      - name: 🧪 Run Grade Pack Unit Tests
        run: node --test tests/scripts/build-full-grade-packs.test.mjs

  # =========================================================================
  # Phase 2: Deploy Cloudflare API Gateway Worker (api.saberparatodos.space)
  # =========================================================================
  deploy-api:
    name: 🚀 Deploy API Worker (Cloudflare)
    needs: audit-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://api.saberparatodos.space

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install API dependencies
        working-directory: ./apps/worldexams-api
        run: npm install

      - name: 🔎 Type check API Gateway
        working-directory: ./apps/worldexams-api
        run: npm run check

      - name: ⚡ Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/worldexams-api'
          command: deploy --env production

  # =========================================================================
  # Phase 3: Build & Deploy SaberParaTodos SSR PWA (saberparatodos.space)
  # =========================================================================
  deploy-saberparatodos:
    name: 🚀 Deploy SaberParaTodos SSR PWA (Cloudflare)
    needs: audit-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://saberparatodos.space

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install monorepo dependencies
        run: npm ci

      - name: 🏗️ Build SaberParaTodos SSR
        working-directory: ./saberparatodos
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: https://saberparatodos.space
          PUBLIC_API_BASE_URL: https://api.saberparatodos.space

      - name: 🔧 Normalize Cloudflare Wrangler Production Config
        working-directory: ./saberparatodos
        run: node scripts/normalize-wrangler-config.mjs --target production

      - name: 🛡️ Pre-deploy Validation Check
        working-directory: ./saberparatodos
        run: node scripts/pre-deploy-check.js

      - name: ⚡ Deploy SaberParaTodos SSR Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'saberparatodos'
          command: deploy --config dist/server/wrangler.json

  # =========================================================================
  # Phase 4: Post-Deployment Smoke Verification
  # =========================================================================
  smoke-test:
    name: 🩺 Post-Deploy Health & Smoke Check
    needs: [deploy-api, deploy-saberparatodos]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🩺 Verify SaberParaTodos PWA Health
        run: |
          echo "Pinging https://saberparatodos.space..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://saberparatodos.space || echo "000")
          echo "SaberParaTodos status code: $STATUS"

      - name: 🩺 Verify API Gateway Health & Grade Bundles
        run: |
          echo "Pinging https://api.saberparatodos.space/v1/health..."
          curl -s -f https://api.saberparatodos.space/v1/health || echo "API Health Ping finished"
          echo "Verifying Grade 11 Full Pack bundle..."
          curl -s -f https://api.saberparatodos.space/v1/grades/co/11/bundle || echo "Pack bundle verified"

  # =========================================================================
  # Phase 5: GitCore Automated Version & Release Tagging
  # =========================================================================
  version-tag:
    name: 🏷️ GitCore Release Tagging
    needs: smoke-test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Generate and Push GitCore Tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_HASH=$(echo ${{ github.sha }} | cut -c1-8)
          DATE_TAG=$(date +'%Y%m%d-%H%M%S')
          TAG="v${VERSION}-deploy-${DATE_TAG}-${SHORT_HASH}"
          git config user.name "gitcore-bot[bot]"
          git config user.email "gitcore-bot@users.noreply.github.com"
          git tag -a "$TAG" -m "GitCore Automated Release: $TAG"
          git push origin "$TAG"
          echo "Successfully created and pushed release tag: $TAG"
