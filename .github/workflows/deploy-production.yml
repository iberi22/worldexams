name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./saberparatodos
        run: npm ci

      - name: Lint & type check
        working-directory: ./saberparatodos
        run: npx tsc --noEmit && npx astro check

      - name: Unit tests
        working-directory: ./saberparatodos
        run: npm run test:unit

      - name: Build Application
        working-directory: ./saberparatodos
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Pre-deploy check
        working-directory: ./saberparatodos
        run: node scripts/pre-deploy-check.js

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: saberparatodos/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://saberparatodos.space

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout edge-mesh (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: iberi22/edge-mesh
          path: edge-mesh
          token: ${{ secrets.EDGE_MESH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./saberparatodos
        run: npm ci

      - name: Build Application
        working-directory: ./saberparatodos
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: saberparatodos
          directory: saberparatodos/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./apps/worldexams-api
        run: npm install

      - name: Type check
        working-directory: ./apps/worldexams-api
        run: npm run check

      - name: Deploy API Worker
        working-directory: ./apps/worldexams-api
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./saberparatodos
        run: npm ci

      - name: Smoke test (E2E) on production
        working-directory: ./saberparatodos
        run: npx playwright test e2e-smoke-tag.spec.ts --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: https://saberparatodos.space

      - name: Verify API endpoint
        run: |
          VERSION=$(cat saberparatodos/package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')
          echo "Expected version: $VERSION"
          curl -s "https://saberparatodos.space/api/packs/current.json" | grep -q "$VERSION" && echo "OK version match" || (echo "FAIL version mismatch" && exit 1)

  version-tag:
    needs: smoke-test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create version tag
        run: |
          VERSION=$(cat saberparatodos/package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')
          SHORT_HASH=$(echo ${{ github.sha }} | cut -c1-8)
          DATE_TAG=$(date +'%Y%m%d-%H%M%S')
          TAG="saberparatodos-v${VERSION}-deploy-${DATE_TAG}-${SHORT_HASH}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG"
