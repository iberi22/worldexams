name: E2E Tests - Party Mode

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to run (or "all" for all critical specs)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - party-smoke.spec.ts
          - party-mode.spec.ts
          - e2e-matrix.spec.ts
          - exam-launch-overlay.spec.ts
          - english-pool.spec.ts

jobs:
  e2e-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        # Puedes agregar más navegadores: [chromium, firefox, webkit]
        spec:
          - party-smoke.spec.ts
          - party-mode.spec.ts
          - e2e-matrix.spec.ts
          - exam-launch-overlay.spec.ts
          - english-pool.spec.ts

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saberparatodos/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./saberparatodos
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        working-directory: ./saberparatodos
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 🔨 Build application
        working-directory: ./saberparatodos
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 🌐 Start dev server
        working-directory: ./saberparatodos
        run: |
          npm run dev &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          npx wait-on http://localhost:4321 --timeout 60000
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 🧪 Run E2E tests
        working-directory: ./saberparatodos
        run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.browser }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.spec }}
          path: saberparatodos/playwright-report/
          retention-days: 7

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.browser }}-${{ matrix.spec }}
          path: saberparatodos/test-results/
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
          pkill -f "astro dev" || true

  # Notificar resultados
  notify:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📢 Notify on Discord (optional)
        if: failure()
        run: |
          echo "Tests failed! Configure Discord webhook if needed."
          # curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} -d "content=E2E Tests failed!"
