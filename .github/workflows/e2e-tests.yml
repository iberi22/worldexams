name: E2E Tests - Party Mode

on:
  push:
    branches: [main, develop]
    paths:
      - 'saberparatodos/src/**'
      - 'saberparatodos/tests/**'
      - 'saberparatodos/package.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'saberparatodos/src/**'
      - 'saberparatodos/tests/**'
      - 'saberparatodos/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        # Puedes agregar más navegadores: [chromium, firefox, webkit]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saberparatodos/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./saberparatodos
        run: npm ci

      - name: 🎭 Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('saberparatodos/package.json') }}

      - name: 🎭 Install Playwright Browsers
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./saberparatodos
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 🔨 Build application
        working-directory: ./saberparatodos
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 🌐 Start dev server
        working-directory: ./saberparatodos
        run: |
          npm run dev &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          npx wait-on http://localhost:4321 --timeout 60000
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 🧪 Run E2E tests
        working-directory: ./saberparatodos
        run: npx playwright test party-smoke.spec.ts --project=${{ matrix.browser }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: saberparatodos/playwright-report/
          retention-days: 7

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: saberparatodos/test-results/
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
          pkill -f "astro dev" || true

  # Notificar resultados
  notify:
    needs: e2e-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📢 Notify on Discord (optional)
        if: failure()
        run: |
          echo "Tests failed! Configure Discord webhook if needed."
          # curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} -d "content=E2E Tests failed!"
