# Grouped monthly Dependabot configuration (SWAL wave pi-1, S7).
# One pull request per ecosystem per month instead of one PR per bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # 2026-10-13 deps integration: typescript >=6 is blocked by
    # @typescript-eslint's peer (typescript >=4.8.4 <6.1.0) — ERESOLVE on
    # `npm ci`. Revisit when typescript-eslint supports TS >=6.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      # Version updates: everything into a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a monthly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
