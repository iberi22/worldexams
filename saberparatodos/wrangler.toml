# Cloudflare Workers configuration for saberparatodos
name = "saberparatodos"
compatibility_date = "2025-01-01"

# Enable Node.js compatibility v2 (required for @astrojs/cloudflare v13+)
compatibility_flags = ["nodejs_compat_v2"]

# Environment variables (non-sensitive)
[vars]
PUBLIC_API_BASE_URL = "/api"  # Local API - same domain, no CORS issues
PUBLIC_SITE_URL = "https://saberparatodos.space"

# Production environment
[env.production]
vars = { PUBLIC_API_BASE_URL = "/api", PUBLIC_SITE_URL = "https://saberparatodos.space" }

# Preview/staging environment
[env.preview]
workers_dev = true
vars = { PUBLIC_API_BASE_URL = "/api", PUBLIC_SITE_URL = "https://preview.workers.dev" }
