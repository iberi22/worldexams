# Cloudflare Workers configuration for saberparatodos
name = "saberparatodos"
compatibility_date = "2025-01-01"

# Enable Node.js compatibility v2 (required for @astrojs/cloudflare v13+)
compatibility_flags = ["nodejs_compat_v2"]

# Explicit assets configuration for SSR
[assets]
directory = "./dist/client"
binding = "ASSETS"

# Environment variables (non-sensitive)
[vars]
PUBLIC_API_BASE_URL = "/api"
PUBLIC_SITE_URL = "https://saberparatodos.space"
PUBLIC_ROOMS_SUPABASE_MIRROR = "false"
PUBLIC_SUPABASE_URL = "https://your-project.supabase.co"
PUBLIC_SUPABASE_ANON_KEY = "your_supabase_anon_key_here"

# Production environment
[env.production]
vars = { PUBLIC_API_BASE_URL = "https://api.saberparatodos.space", PUBLIC_SITE_URL = "https://saberparatodos.space", PUBLIC_ROOMS_SUPABASE_MIRROR = "false", PUBLIC_SUPABASE_URL = "https://your-project.supabase.co", PUBLIC_SUPABASE_ANON_KEY = "your_supabase_anon_key_here" }

# Preview/staging environment
[env.preview]
workers_dev = true
vars = { PUBLIC_API_BASE_URL = "/api", PUBLIC_SITE_URL = "https://preview.workers.dev", PUBLIC_ROOMS_SUPABASE_MIRROR = "false" }
