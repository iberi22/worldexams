openapi: 3.0.0
info:
  title: World Exams API
  description: API for accessing standardized exam questions from multiple countries.
  version: 1.0.0
  contact:
    name: World Exams
    url: https://worldexams.org
servers:
  - url: https://worldexams-api.pages.dev
    description: Production API
  - url: http://localhost:8788
    description: Local Development
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
security:
  - ApiKeyAuth: []
paths:
  /api/v1/{country}/{exam}/{grade}/{subject}/index.json:
    get:
      summary: Get subject index
      description: Returns a list of available question bundles for a specific subject.
      parameters:
        - in: path
          name: country
          required: true
          schema:
            type: string
            example: co
        - in: path
          name: exam
          required: true
          schema:
            type: string
            example: icfes
        - in: path
          name: grade
          required: true
          schema:
            type: string
            example: 11
        - in: path
          name: subject
          required: true
          schema:
            type: string
            example: matematicas
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
  /api/v1/{country}/{exam}/{grade}/{subject}/{bundleId}.json:
    get:
      summary: Get question bundle
      description: Returns the full content of a question bundle.
      parameters:
        - in: path
          name: country
          required: true
          schema:
            type: string
        - in: path
          name: exam
          required: true
          schema:
            type: string
        - in: path
          name: grade
          required: true
          schema:
            type: string
        - in: path
          name: subject
          required: true
          schema:
            type: string
        - in: path
          name: bundleId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
