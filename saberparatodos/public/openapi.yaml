openapi: 3.0.3
info:
  title: SaberParaTodos API
  description: >
    API de preguntas de World Exams para integraciones educativas. La autenticación
    se hace con API keys generadas desde `/developers/dashboard`.
  version: 2026-03-09
  contact:
    name: SaberParaTodos
    url: https://saberparatodos.space/developers
servers:
  - url: https://YOUR_PROJECT.supabase.co
    description: Supabase production project URL
  - url: http://127.0.0.1:54321
    description: Supabase local development
components:
  securitySchemes:
    BearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API Key
  schemas:
    Question:
      type: object
      properties:
        id:
          type: string
          example: CO-MAT-11-algebra-001-v1
        statement:
          type: string
        options:
          type: array
          items:
            type: string
        answer:
          type: string
        explanation:
          type: string
    QuestionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        meta:
          type: object
          properties:
            total:
              type: integer
            tier:
              type: string
              example: free
            country:
              type: string
              example: co
            grade:
              type: integer
              example: 11
            subject:
              type: string
              example: matematicas
            rate_limit:
              type: integer
            quota_remaining:
              type: integer
security:
  - BearerApiKey: []
paths:
  /functions/v1/api-gateway:
    get:
      summary: Obtener preguntas
      description: >
        Devuelve preguntas filtradas por país, grado y asignatura. La API key se envía
        en el header `Authorization: Bearer YOUR_API_KEY`.
      parameters:
        - in: query
          name: country
          required: false
          schema:
            type: string
            default: co
        - in: query
          name: grade
          required: false
          schema:
            type: string
            default: "11"
        - in: query
          name: subject
          required: false
          schema:
            type: string
            default: matematicas
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Preguntas entregadas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionsResponse'
        '401':
          description: API key inválida
        '402':
          description: API key faltante, inactiva o cuota excedida
        '429':
          description: Rate limit excedido
