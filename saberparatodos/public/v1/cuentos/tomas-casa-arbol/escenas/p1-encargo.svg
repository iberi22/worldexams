<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A Tomás le piden construir una casa en un terreno con un gran árbol">
  <!-- Plano Fondo: Cielo y colinas -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <path d="M0 300 Q200 240 400 280 T800 250 L800 450 L0 450 Z" fill="#E2EAD8"/>
  <circle cx="700" cy="100" r="45" fill="#FF9F43" opacity="0.85"/>
  <path d="M100 120 Q120 100 150 105 Q170 90 200 100 Q220 115 200 130 Q150 140 100 120 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Plano Medio: Terreno verde, Abuelo Ceiba grande y frondoso -->
  <path d="M0 340 Q250 310 500 330 T800 320 L800 450 L0 450 Z" fill="#A2C987"/>
  <!-- Abuelo Ceiba (Árbol gigante) en el centro-derecha -->
  <path d="M480 430 Q510 380 520 280 L580 280 Q590 380 620 430 Z" fill="#8D5B4C"/>
  <circle cx="550" cy="180" r="110" fill="#588B42"/>
  <circle cx="480" cy="210" r="80" fill="#69A050"/>
  <circle cx="620" cy="210" r="80" fill="#69A050"/>
  <circle cx="550" cy="140" r="85" fill="#7BAE5A"/>
  <!-- Carita entrañable del árbol -->
  <circle cx="530" cy="260" r="7" fill="#FFFFFF"/>
  <circle cx="531" cy="261" r="3.5" fill="#3A2E2A"/>
  <circle cx="570" cy="260" r="7" fill="#FFFFFF"/>
  <circle cx="569" cy="261" r="3.5" fill="#3A2E2A"/>
  <path d="M540 272 Q550 280 560 272" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Plano Frente: Tomás con su casco de arquitecto y tabla con hojas de diseño -->
  <g transform="translate(180, 220)">
    <!-- Cuerpo de Tomás (#7BAE5A) -->
    <ellipse cx="60" cy="150" rx="32" ry="40" fill="#7BAE5A"/>
    <!-- Cabeza -->
    <circle cx="60" cy="85" r="30" fill="#FCE3C8"/>
    <!-- Casco amarillo -->
    <path d="M28 75 C28 52 92 52 92 75 Z" fill="#FFD54F"/>
    <rect x="22" y="73" width="76" height="5" rx="2.5" fill="#FFC107"/>
    <!-- Carita alegre -->
    <circle cx="48" cy="83" r="7" fill="#FFFFFF"/>
    <circle cx="49" cy="84" r="3.5" fill="#3A2E2A"/>
    <circle cx="72" cy="83" r="7" fill="#FFFFFF"/>
    <circle cx="71" cy="84" r="3.5" fill="#3A2E2A"/>
    <path d="M52 95 Q60 102 68 95" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Tabla de planos de arquitecto en las manos -->
    <rect x="80" y="110" width="55" height="40" rx="3" fill="#4FB6A3" stroke="#3A2E2A" stroke-width="2"/>
    <rect x="85" y="115" width="45" height="30" rx="2" fill="#FFF6E8"/>
    <path d="M90 125 L120 125 M90 133 L110 133" stroke="#FF9F43" stroke-width="2"/>
  </g>
</svg>