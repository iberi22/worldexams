<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tomás dibuja el plano alrededor del árbol usando formas redondas">
  <!-- Plano Fondo: Taller de arquitectura / Mesa de dibujo -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <!-- Pared con planos colgados -->
  <rect x="50" y="40" width="120" height="90" fill="#FFF6E8" stroke="#D1C7BD" stroke-width="2"/>
  <circle cx="110" cy="85" r="25" fill="none" stroke="#4FB6A3" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="90" y="65" width="40" height="40" fill="none" stroke="#FF9F43" stroke-width="2"/>
  <!-- Mesa de trabajo azul arquitecto / cian -->
  <rect x="80" y="240" width="640" height="180" rx="10" fill="#EBF3F5" stroke="#B0C4DE" stroke-width="3"/>
  <!-- Papel de plano desplegado en la mesa -->
  <rect x="140" y="255" width="520" height="150" rx="6" fill="#FFFFFF" stroke="#5B6FD6" stroke-width="2.5"/>
  <!-- Dibujo del plano: círculo central (árbol) y paredes alrededor -->
  <circle cx="400" cy="330" r="35" fill="#A2C987" stroke="#588B42" stroke-width="3"/>
  <circle cx="400" cy="330" r="15" fill="#8D5B4C"/>
  <!-- Paredes curvas rodeando el árbol (la casa abraza el árbol) -->
  <path d="M300 330 C300 260 500 260 500 330 C500 400 300 400 300 330 Z" fill="none" stroke="#3A2E2A" stroke-width="5" stroke-dasharray="8,4"/>
  <rect x="250" y="280" width="80" height="100" rx="8" fill="none" stroke="#7BAE5A" stroke-width="3"/>
  <rect x="470" y="280" width="80" height="100" rx="8" fill="none" stroke="#7BAE5A" stroke-width="3"/>
  <!-- Plano Frente: Tomás feliz mostrando el plano con compás y regla -->
  <g transform="translate(100, 120)">
    <ellipse cx="60" cy="110" rx="28" ry="35" fill="#7BAE5A"/>
    <circle cx="60" cy="55" r="26" fill="#FCE3C8"/>
    <!-- Casco amarillo -->
    <path d="M32 46 C32 26 88 26 88 46 Z" fill="#FFD54F"/>
    <rect x="26" y="44" width="68" height="4" rx="2" fill="#FFC107"/>
    <!-- Ojos radiantes -->
    <circle cx="50" cy="53" r="6" fill="#FFFFFF"/>
    <circle cx="51" cy="54" r="3" fill="#3A2E2A"/>
    <circle cx="70" cy="53" r="6" fill="#FFFFFF"/>
    <circle cx="69" cy="54" r="3" fill="#3A2E2A"/>
    <path d="M53 64 Q60 71 67 64" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Regla de madera en la mano -->
    <rect x="90" y="70" width="80" height="12" rx="2" fill="#E8B04B" stroke="#3A2E2A" stroke-width="1.5" transform="rotate(-15 90 70)"/>
  </g>
  <!-- La niña Alba mirando entusiasmada -->
  <g transform="translate(620, 140)">
    <path d="M20 100 L60 100 L68 160 L12 160 Z" fill="#4FB6A3"/>
    <circle cx="40" cy="65" r="24" fill="#FCE3C8"/>
    <!-- Coletas rojas -->
    <circle cx="12" cy="60" r="10" fill="#3A2E2A"/>
    <circle cx="68" cy="60" r="10" fill="#3A2E2A"/>
    <!-- Carita contenta -->
    <circle cx="32" cy="63" r="5" fill="#FFFFFF"/>
    <circle cx="33" cy="64" r="2.5" fill="#3A2E2A"/>
    <circle cx="48" cy="63" r="5" fill="#FFFFFF"/>
    <circle cx="47" cy="64" r="2.5" fill="#3A2E2A"/>
    <path d="M34 73 Q40 80 46 73" stroke="#3A2E2A" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>