<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vela la niña astronauta">
  <!-- Traje de astronauta (cuerpo) con azul cometa #5B6FD6 -->
  <ellipse cx="100" cy="148" rx="42" ry="46" fill="#5B6FD6"/>
  <!-- Pecho / Insignia -->
  <circle cx="100" cy="142" r="18" fill="#FFF6E8"/>
  <!-- Estrella en el pecho -->
  <path d="M100 132 L103 139 L110 140 L105 145 L106 152 L100 148 L94 152 L95 145 L90 140 L97 139 Z" fill="#FF9F43"/>
  <!-- Brazos/mangas -->
  <ellipse cx="58" cy="145" rx="12" ry="24" fill="#4A5CC4" transform="rotate(15 58 145)"/>
  <ellipse cx="142" cy="145" rx="12" ry="24" fill="#4A5CC4" transform="rotate(-15 142 145)"/>
  <!-- Manos con guantes -->
  <circle cx="48" cy="164" r="9" fill="#FFF6E8"/>
  <circle cx="152" cy="164" r="9" fill="#FFF6E8"/>
  <!-- Cabeza y cabello -->
  <circle cx="100" cy="78" r="38" fill="#FCE0D1"/>
  <!-- Cabello oscuro con dos coletas -->
  <path d="M62 70 Q60 42 100 42 Q140 42 138 70 Q120 54 100 54 Q80 54 62 70 Z" fill="#3A2E2A"/>
  <!-- Coletas -->
  <circle cx="58" cy="72" r="14" fill="#3A2E2A"/>
  <circle cx="142" cy="72" r="14" fill="#3A2E2A"/>
  <!-- Cintas de coletas en color firma -->
  <circle cx="62" cy="74" r="5" fill="#5B6FD6"/>
  <circle cx="138" cy="74" r="5" fill="#5B6FD6"/>
  <!-- Capul / Fleco -->
  <path d="M72 58 Q85 68 100 62 Q115 68 128 58 Q115 50 100 50 Q85 50 72 58 Z" fill="#3A2E2A"/>
  <!-- Ojos plantilla común -->
  <circle cx="85" cy="78" r="10" fill="#FFFFFF"/>
  <circle cx="86" cy="80" r="5" fill="#232D36"/>
  <circle cx="88" cy="78" r="2" fill="#FFFFFF"/>
  <circle cx="115" cy="78" r="10" fill="#FFFFFF"/>
  <circle cx="116" cy="80" r="5" fill="#232D36"/>
  <circle cx="118" cy="78" r="2" fill="#FFFFFF"/>
  <!-- Sonrisa -->
  <path d="M92 94 Q100 102 108 94" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
  <!-- Mejillas rosadas -->
  <circle cx="76" cy="88" r="6" fill="#E26D5A" opacity="0.45"/>
  <circle cx="124" cy="88" r="6" fill="#E26D5A" opacity="0.45"/>
  <!-- Casco transparente de astronauta (borde y brillo) -->
  <circle cx="100" cy="80" r="52" fill="none" stroke="#5B6FD6" stroke-width="3" opacity="0.7"/>
  <path d="M68 46 A48 48 0 0 1 120 40" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
