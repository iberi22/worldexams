<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="El robot Tuerca">
  <!-- Antena -->
  <line x1="100" y1="20" x2="100" y2="40" stroke="#7A889B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="18" r="8" fill="#4FB6A3"/>
  <circle cx="100" cy="18" r="4" fill="#FFFFFF"/>
  <!-- Cuerpo metálico principal -->
  <rect x="60" y="115" width="80" height="65" rx="18" fill="#8C9CAE"/>
  <!-- Panel de control en el pecho -->
  <rect x="74" y="128" width="52" height="38" rx="8" fill="#2F3A45"/>
  <!-- Luces de panel -->
  <circle cx="86" cy="142" r="5" fill="#4FB6A3"/>
  <circle cx="100" cy="142" r="5" fill="#FF9F43"/>
  <circle cx="114" cy="142" r="5" fill="#5B6FD6"/>
  <rect x="84" y="153" width="32" height="4" rx="2" fill="#8C9CAE"/>
  <!-- Brazos articulados -->
  <rect x="36" y="125" width="22" height="12" rx="6" fill="#7A889B"/>
  <circle cx="32" cy="131" r="8" fill="#4FB6A3"/>
  <rect x="142" y="125" width="22" height="12" rx="6" fill="#7A889B"/>
  <circle cx="168" cy="131" r="8" fill="#4FB6A3"/>
  <!-- Cabeza redonda del robot -->
  <rect x="52" y="40" width="96" height="70" rx="22" fill="#A2B1C1"/>
  <!-- Pantalla facial -->
  <rect x="62" y="50" width="76" height="50" rx="14" fill="#232D36"/>
  <!-- Ojos luminosos del robot (estilo grandes) -->
  <circle cx="82" cy="74" r="12" fill="#4FB6A3"/>
  <circle cx="84" cy="72" r="5" fill="#FFFFFF"/>
  <circle cx="118" cy="74" r="12" fill="#4FB6A3"/>
  <circle cx="120" cy="72" r="5" fill="#FFFFFF"/>
  <!-- Sonrisa digital -->
  <path d="M92 88 Q100 94 108 88" stroke="#4FB6A3" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Orejas / Tuercas laterales -->
  <rect x="42" y="62" width="10" height="24" rx="4" fill="#7A889B"/>
  <rect x="148" y="62" width="10" height="24" rx="4" fill="#7A889B"/>
  <!-- Ruedas/Base de desplazamiento -->
  <rect x="70" y="180" width="60" height="12" rx="6" fill="#5A6878"/>
</svg>
