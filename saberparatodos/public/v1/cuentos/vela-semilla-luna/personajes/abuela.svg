<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="La abuela sabia">
  <!-- Cuerpo / Vestido en tonos cálidos -->
  <ellipse cx="100" cy="150" rx="46" ry="42" fill="#E26D5A"/>
  <!-- Chal suave -->
  <path d="M56 130 Q100 160 144 130 Q130 115 100 118 Q70 115 56 130 Z" fill="#4FB6A3"/>
  <!-- Cabeza y rostro -->
  <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
