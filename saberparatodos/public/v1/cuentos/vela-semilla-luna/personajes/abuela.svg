  <circle cx="100" cy="40" r="16" fill="#D2D7DF"/>
  <path d="M64 76 Q62 50 100 50 Q138 50 136 76 Q120 60 100 60 Q80 60 64 76 Z" fill="#E0E4EB"/>
  <!-- Lentes redondos amables -->
  <circle cx="84" cy="78" r="12" fill="none" stroke="#FF9F43" stroke-width="3"/>
  <circle cx="116" cy="78" r="12" fill="none" stroke="#FF9F43" stroke-width="3"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#FF9F43" stroke-width="3"/>
  <!-- Ojos detrás de los lentes -->
  <circle cx="84" cy="78" r="8" fill="#FFFFFF"/>
  <circle cx="85" cy="80" r="4" fill="#232D36"/>
  <circle cx="86" cy="78" r="1.5" fill="#FFFFFF"/>
  <circle cx="116" cy="78" r="8" fill="#FFFFFF"/>
  <circle cx="117" cy="80" r="4" fill="#232D36"/>
  <circle cx="118" cy="78" r="1.5" fill="#FFFFFF"/>
  <!-- Sonrisa dulce -->
  <path d="M92 95 Q100 103 108 95" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
  <!-- Mejillas sonrosadas -->
  <circle cx="72" cy="88" r="6" fill="#E26D5A" opacity="0.4"/>
  <circle cx="128" cy="88" r="6" fill="#E26D5A" opacity="0.4"/>
</svg>
