<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Vela tiene una idea sobre una casita de cristal o invernadero">
  <!-- Plano Fondo: Noche estrellada y Luna de fondo -->
  <rect width="800" height="450" fill="#1C2333"/>
  <circle cx="150" cy="90" r="3" fill="#FFF6E8"/>
  <circle cx="680" cy="70" r="3" fill="#FFF6E8"/>

  <!-- Invernadero de cristal (Casita de cristal) en el centro -->
  <g transform="translate(260, 100)">
    <!-- Domo / Casita de cristal -->
    <path d="M 40 220 L 40 100 Q 140 20 240 100 L 240 220 Z" fill="#4FB6A3" opacity="0.25" stroke="#4FB6A3" stroke-width="6"/>
    <!-- Estructura del invernadero -->
    <path d="M 40 100 L 240 100" stroke="#4FB6A3" stroke-width="4"/>
    <path d="M 140 25 L 140 220" stroke="#4FB6A3" stroke-width="4"/>
    <!-- Plantas creciendo dentro felices -->
    <ellipse cx="140" cy="210" rx="60" ry="12" fill="#3D7D52"/>
    <path d="M 110 200 Q 100 160 120 150 Q 135 170 140 200" fill="#7BAE5A"/>
    <path d="M 140 200 Q 150 140 170 145 Q 165 175 140 200" fill="#7BAE5A"/>
    <!-- Flor roja/naranja dentro -->
    <circle cx="140" cy="140" r="12" fill="#FF9F43"/>
    <circle cx="140" cy="140" r="6" fill="#E26D5A"/>
    <!-- Sol brillante entrando en la casita -->
    <circle cx="210" cy="60" r="22" fill="#FFE3B3"/>
    <circle cx="210" cy="60" r="16" fill="#FF9F43"/>
  </g>

  <!-- Plano Medio: Suelo lunar gris con cráteres -->
  <path d="M 0 320 Q 200 290 400 320 Q 600 350 800 310 L 800 450 L 0 450 Z" fill="#7A889B"/>
  <ellipse cx="180" cy="380" rx="35" ry="12" fill="#5A6878" opacity="0.6"/>
  <ellipse cx="620" cy="370" rx="45" ry="15" fill="#5A6878" opacity="0.6"/>

  <!-- Plano Frente: Vela con bombillo/idea brillante -->
  <g transform="translate(100, 180) scale(0.85)">
    <ellipse cx="100" cy="150" rx="42" ry="46" fill="#5B6FD6"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <path d="M64 72 Q62 46 100 46 Q138 46 136 72 Q120 56 100 56 Q80 56 64 72 Z" fill="#3A2E2A"/>
    <circle cx="85" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="87" cy="78" r="4" fill="#232D36"/>
    <circle cx="115" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="117" cy="78" r="4" fill="#232D36"/>
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3"/>
    <!-- Bombillo de idea deslumbrante -->
    <circle cx="145" cy="40" r="16" fill="#FF9F43"/>
    <path d="M 145 20 L 145 10 M 160 28 L 168 20 M 165 40 L 175 40" stroke="#FF9F43" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
