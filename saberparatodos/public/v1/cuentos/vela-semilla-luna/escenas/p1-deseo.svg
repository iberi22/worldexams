<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Vela mira la Luna desde su ventana sosteniendo una semilla">
  <!-- Plano Fondo: Noche estrellada y Luna -->
  <rect width="800" height="450" fill="#1C2333"/>
  <!-- Estrellas brillantes -->
  <circle cx="120" cy="80" r="3" fill="#FFF6E8"/>
  <circle cx="280" cy="120" r="2.5" fill="#FFF6E8"/>
  <circle cx="680" cy="90" r="3.5" fill="#FFF6E8"/>
  <circle cx="520" cy="140" r="2" fill="#FFF6E8"/>
  <circle cx="380" cy="70" r="3" fill="#FFF6E8"/>
  <!-- Luna gigante en el cielo -->
  <circle cx="650" cy="160" r="80" fill="#F4E8C1"/>
  <circle cx="620" cy="140" r="16" fill="#E2D4A3" opacity="0.6"/>
  <circle cx="670" cy="180" r="22" fill="#E2D4A3" opacity="0.5"/>
  <circle cx="680" cy="130" r="12" fill="#E2D4A3" opacity="0.5"/>

  <!-- Plano Medio: Marco de la ventana y habitación -->
  <rect x="0" y="280" width="800" height="170" fill="#FDF6EC"/>
  <!-- Marco de ventana azul -->
  <rect x="180" y="40" width="440" height="260" fill="none" stroke="#5B6FD6" stroke-width="18" rx="12"/>
  <line x1="400" y1="40" x2="400" y2="300" stroke="#5B6FD6" stroke-width="10"/>

  <!-- Plano Frente: Vela sosteniendo la semilla en la mano -->
  <g transform="translate(320, 190) scale(0.85)">
    <!-- Cuerpo de Vela -->
    <ellipse cx="100" cy="150" rx="42" ry="46" fill="#5B6FD6"/>
    <circle cx="100" cy="142" r="18" fill="#FFF6E8"/>
    <!-- Cabeza -->
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <path d="M64 72 Q62 46 100 46 Q138 46 136 72 Q120 56 100 56 Q80 56 64 72 Z" fill="#3A2E2A"/>
    <circle cx="60" cy="74" r="13" fill="#3A2E2A"/>
    <circle cx="140" cy="74" r="13" fill="#3A2E2A"/>
    <!-- Ojos mirando a la mano -->
    <circle cx="85" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="87" cy="82" r="4" fill="#232D36"/>
    <circle cx="115" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="117" cy="82" r="4" fill="#232D36"/>
    <!-- Sonrisa -->
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
    <!-- Mano extendida sosteniendo semilla brillante -->
    <ellipse cx="150" cy="155" rx="12" ry="8" fill="#FCE0D1"/>
    <circle cx="150" cy="153" r="5" fill="#FF9F43"/>
  </g>
</svg>
