<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Vela, la abuela y Tuerca dibujan un domo e invernadero lunar">
  <!-- Plano Fondo: Taller acogedor -->
  <rect width="800" height="450" fill="#FDF6EC"/>

  <!-- Gran plano desplegado en la mesa centrada -->
  <rect x="180" y="80" width="440" height="280" rx="12" fill="#EBF5EE" stroke="#5B6FD6" stroke-width="4"/>
  <!-- Dibujo de la Base Lunar en el plano -->
  <!-- Domo principal -->
  <path d="M 300 280 Q 400 120 500 280 Z" fill="none" stroke="#5B6FD6" stroke-width="4" stroke-dasharray="6,4"/>
  <!-- Plantas adentro -->
  <path d="M 370 270 Q 380 230 400 230 Q 420 230 430 270" fill="none" stroke="#4FB6A3" stroke-width="4"/>
  <!-- Luna afuera en el dibujo -->
  <circle cx="260" cy="150" r="28" fill="none" stroke="#FF9F43" stroke-width="3"/>

  <!-- Plano Medio: Mesa -->
  <rect x="80" y="320" width="640" height="130" fill="#E2C7A7"/>

  <!-- Plano Frente: Los tres personajes alrededor del plano -->
  <!-- Abuela a la izquierda -->
  <g transform="translate(80, 160) scale(0.75)">
    <ellipse cx="100" cy="150" rx="46" ry="42" fill="#E26D5A"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <circle cx="100" cy="40" r="16" fill="#D2D7DF"/>
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3"/>
  </g>

  <!-- Vela en el centro con lápiz -->
  <g transform="translate(340, 190) scale(0.75)">
    <ellipse cx="100" cy="150" rx="42" ry="46" fill="#5B6FD6"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <path d="M64 72 Q62 46 100 46 Q138 46 136 72 Q120 56 100 56 Q80 56 64 72 Z" fill="#3A2E2A"/>
    <circle cx="85" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="87" cy="82" r="4" fill="#232D36"/>
    <circle cx="115" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="117" cy="82" r="4" fill="#232D36"/>
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3"/>
  </g>

  <!-- Tuerca a la derecha con regla/herramienta -->
  <g transform="translate(580, 180) scale(0.75)">
    <rect x="60" y="115" width="80" height="65" rx="18" fill="#8C9CAE"/>
    <rect x="52" y="40" width="96" height="70" rx="22" fill="#A2B1C1"/>
    <rect x="62" y="50" width="76" height="50" rx="14" fill="#232D36"/>
    <circle cx="82" cy="74" r="12" fill="#4FB6A3"/>
    <circle cx="118" cy="74" r="12" fill="#4FB6A3"/>
  </g>
</svg>
