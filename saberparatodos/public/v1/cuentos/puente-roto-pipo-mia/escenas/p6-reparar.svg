<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tejón Bruno, Pipo y Mía reparan el puente entre los tres">
  <!-- plano-fondo -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="#FDF6EC"/>
    <path d="M0 320 L150 180 L320 320 Z" fill="#7BAE5A" opacity="0.4"/>
    <path d="M500 320 L680 190 L800 320 Z" fill="#7BAE5A" opacity="0.4"/>
    <circle cx="700" cy="90" r="45" fill="#FF9F43" opacity="0.8"/>
  </g>

  <!-- plano-medio -->
  <g id="plano-medio">
    <path d="M0 300 Q200 280 350 310 L350 450 L0 450 Z" fill="#7BAE5A"/>
    <path d="M450 310 Q600 280 800 300 L800 450 L450 450 Z" fill="#7BAE5A"/>
    <path d="M320 300 C340 350 330 400 350 450 L480 450 C460 400 470 350 450 300 Z" fill="#4FB6A3"/>
    <!-- Puente siendo reparado -->
    <rect x="300" y="330" width="200" height="16" fill="#C97B3D" rx="4"/>
    <rect x="300" y="352" width="200" height="16" fill="#C97B3D" rx="4"/>
    <!-- Nueva tabla colocada limpia -->
    <rect x="300" y="374" width="200" height="16" fill="#E8B04B" rx="4"/>
    <rect x="300" y="396" width="200" height="16" fill="#C97B3D" rx="4"/>
    <!-- Caja de herramientas -->
    <rect x="230" y="330" width="45" height="30" fill="#E26D5A" rx="4"/>
    <rect x="245" y="322" width="15" height="8" fill="#3A2E2A" rx="2"/>
  </g>

  <!-- plano-frente -->
  <g id="plano-frente">
    <!-- Pipo sosteniendo la tabla -->
    <g transform="translate(270, 240) scale(0.48)">
      <ellipse cx="100" cy="130" rx="46" ry="52" fill="#6C7A89"/>
      <circle cx="100" cy="74" r="38" fill="#6C7A89"/>
      <path d="M78 102 L100 122 L122 102 Z" fill="#9B7EDE"/>
      <circle cx="81" cy="71" r="5" fill="#FFFFFF"/>
      <circle cx="119" cy="71" r="5" fill="#FFFFFF"/>
    </g>
    <!-- Tejón Bruno martillando -->
    <g transform="translate(360, 220) scale(0.52)">
      <ellipse cx="100" cy="135" rx="50" ry="55" fill="#4FB6A3"/>
      <ellipse cx="100" cy="72" rx="40" ry="34" fill="#FFFFFF"/>
      <path d="M72 45 C78 70 82 85 82 95 L62 95 Z" fill="#3A2E2A"/>
      <path d="M128 45 C122 70 118 85 118 95 L138 95 Z" fill="#3A2E2A"/>
      <path d="M55 46 Q100 36 145 46 L135 30 Z" fill="#C97B3D"/>
      <circle cx="82" cy="70" r="5" fill="#FFFFFF"/>
      <circle cx="118" cy="70" r="5" fill="#FFFFFF"/>
    </g>
    <!-- Mía alcanzando clavos -->
    <g transform="translate(470, 240) scale(0.48)">
      <ellipse cx="100" cy="130" rx="44" ry="50" fill="#7E8C9B"/>
      <circle cx="100" cy="74" r="37" fill="#7E8C9B"/>
      <circle cx="132" cy="40" r="7" fill="#9B7EDE"/>
      <circle cx="81" cy="71" r="5" fill="#FFFFFF"/>
      <circle cx="119" cy="71" r="5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
