<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lila asoma la cabeza al agua y dice que tiene miedo">
  <!-- Plano 1: Cielo y Mar (Superficie) -->
  <rect width="800" height="220" fill="#CAF0F8"/>
  <rect y="220" width="800" height="230" fill="#0077B6"/>
  <!-- Sol suave -->
  <circle cx="700" cy="70" r="45" fill="#FFB703" opacity="0.85"/>
  <!-- Nubes -->
  <ellipse cx="180" cy="70" rx="50" ry="22" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="480" cy="90" rx="65" ry="25" fill="#FFFFFF" opacity="0.9"/>

  <!-- Plano 2: Olas de superficie -->
  <path d="M 0 220 Q 100 200 200 220 T 400 220 T 600 220 T 800 220 L 800 250 L 0 250 Z" fill="#0096C7"/>

  <!-- Plano 3: Lila asomando la cabeza y ondas de voz -->
  <g transform="translate(320, 140)">
    <!-- Cabeza fuera del agua -->
    <circle cx="80" cy="65" r="38" fill="#4FB6A3"/>
    <circle cx="65" cy="58" r="9" fill="#FFFFFF"/>
    <circle cx="66" cy="59" r="4" fill="#232D36"/>
    <circle cx="95" cy="58" r="9" fill="#FFFFFF"/>
    <circle cx="94" cy="59" r="4" fill="#232D36"/>
    <!-- Boca abierta expresando lo que siente -->
    <ellipse cx="80" cy="82" rx="10" ry="8" fill="#232D36"/>
    <!-- Caparazón semisumergido -->
    <path d="M 30 110 Q 80 85 130 110 Z" fill="#2E7D32"/>
  </g>

  <!-- Ondas de sonido / voz -->
  <path d="M 430 180 Q 460 160 480 180" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 445 165 Q 480 140 505 165" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
