<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lila nada en el arrecife y ve una red con un pececito atrapado">
  <!-- Plano 1: Fondo marino azul gradiente suave -->
  <rect width="800" height="450" fill="#0077B6"/>
  <rect y="250" width="800" height="200" fill="#023E8A" opacity="0.5"/>
  <circle cx="150" cy="80" r="120" fill="#00B4D8" opacity="0.3"/>
  <!-- Rayos de luz solar -->
  <polygon points="120,0 180,0 260,450 160,450" fill="#E0F7FA" opacity="0.15"/>
  <polygon points="300,0 350,0 500,450 420,450" fill="#E0F7FA" opacity="0.10"/>

  <!-- Plano 2: Arrecife de coral y vegetación marina -->
  <path d="M0 450 Q100 380 200 450 Q350 360 500 450 Q650 370 800 450 Z" fill="#E9C46A"/>
  <path d="M50 450 Q70 320 90 450 Q110 300 130 450" stroke="#E76F51" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M680 450 Q710 330 730 450 Q750 310 770 450" stroke="#2A9D8F" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- burbujas -->
  <circle cx="220" cy="280" r="8" fill="#E0F7FA" opacity="0.6"/>
  <circle cx="230" cy="240" r="5" fill="#E0F7FA" opacity="0.6"/>
  <circle cx="215" cy="200" r="10" fill="#E0F7FA" opacity="0.5"/>

  <!-- Plano 3: Frente - Lila la tortuga (izquierda) y Red con pececito (derecha) -->
  <!-- Lila la tortuga -->
  <g transform="translate(180, 220) scale(0.85)">
    <ellipse cx="100" cy="116" rx="54" ry="44" fill="#4FB6A3"/>
    <circle cx="100" cy="58" r="34" fill="#4FB6A3"/>
    <path d="M50 110 Q10 100 20 135 Q35 150 55 125 Z" fill="#4FB6A3"/>
    <path d="M150 110 Q190 100 180 135 Q165 150 145 125 Z" fill="#4FB6A3"/>
    <circle cx="85" cy="52" r="8" fill="#FFFFFF"/>
    <circle cx="86" cy="53" r="4" fill="#232D36"/>
    <circle cx="115" cy="52" r="8" fill="#FFFFFF"/>
    <circle cx="114" cy="53" r="4" fill="#232D36"/>
  </g>

  <!-- Red abandonada (cuadrícula flotante suave) -->
  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="140" height="120" fill="#48CAE4" opacity="0.2" rx="15"/>
    <path d="M 0 30 L 140 30 M 0 60 L 140 60 M 0 90 L 140 90" stroke="#D8F3DC" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M 35 0 L 35 120 M 70 0 L 70 120 M 105 0 L 105 120" stroke="#D8F3DC" stroke-width="3" stroke-dasharray="6,4"/>
    <!-- Pececito dentro de la red -->
    <ellipse cx="70" cy="60" rx="22" ry="14" fill="#FF9F43"/>
    <polygon points="90,60 108,48 108,72" fill="#FF9F43"/>
    <circle cx="60" cy="56" r="4" fill="#FFFFFF"/>
    <circle cx="59" cy="56" r="2" fill="#232D36"/>
  </g>
</svg>
