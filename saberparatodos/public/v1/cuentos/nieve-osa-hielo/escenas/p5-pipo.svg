<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nieve y la foca Pipo cuidan la orilla limpia">
  <!-- PLANO 1: FONDO -->
  <rect width="800" height="450" fill="#EBF4F6"/>
  <circle cx="650" cy="80" r="35" fill="#FFF3D6" opacity="0.85"/>
  <path d="M 100 80 Q 85 80 85 65 Q 85 45 105 45 Q 115 20 145 20 Q 170 10 195 25 Q 220 15 235 35 Q 255 40 255 62 Q 255 80 235 80 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- PLANO 2: MEDIO (Mar azul y orilla de nieve) -->
  <path d="M 0 220 C 300 180 500 280 800 210 L 800 450 L 0 450 Z" fill="#4FB6A3"/>
  <!-- Olas suaves -->
  <path d="M 50 240 Q 150 220 250 240 T 450 240 T 650 240" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- PLANO 3: FRENTE (Placa de orilla, Nieve y Pipo guardando caracoles en una piedra) -->
  <path d="M 0 280 Q 400 260 800 320 L 800 450 L 0 450 Z" fill="#E8F1F5"/>

  <!-- Piedra plana con caracoles -->
  <ellipse cx="420" cy="380" rx="45" ry="18" fill="#78909C"/>
  <circle cx="400" cy="375" r="5" fill="#FF9F43"/>
  <circle cx="420" cy="378" r="6" fill="#FFB765"/>
  <circle cx="440" cy="374" r="5" fill="#E26D5A"/>

  <!-- Pipo la foca sonriendo -->
  <g transform="translate(460, 270) scale(0.85)">
    <ellipse cx="60" cy="70" rx="32" ry="36" fill="#90A4AE"/>
    <circle cx="60" cy="36" r="26" fill="#90A4AE"/>
    <ellipse cx="60" cy="42" rx="12" ry="8" fill="#ECEFF1"/>
    <ellipse cx="60" cy="39" rx="5" ry="3" fill="#232D36"/>
    <!-- Ojos -->
    <circle cx="48" cy="30" r="6" fill="#FFFFFF"/>
    <circle cx="49" cy="31" r="3" fill="#232D36"/>
    <circle cx="72" cy="30" r="6" fill="#FFFFFF"/>
    <circle cx="73" cy="31" r="3" fill="#232D36"/>
  </g>

  <!-- Nieve explicando con cariño -->
  <g transform="translate(220, 240)">
    <ellipse cx="50" cy="70" rx="30" ry="35" fill="#F4F8FA"/>
    <circle cx="50" cy="35" r="24" fill="#FFFFFF"/>
    <circle cx="35" cy="20" r="7" fill="#BFD9E8"/>
    <circle cx="65" cy="20" r="7" fill="#BFD9E8"/>
    <path d="M 32 52 Q 50 62 68 52 Q 60 64 50 66 Q 40 64 32 52 Z" fill="#BFD9E8"/>
    <!-- Ojos mirando a Pipo -->
    <circle cx="42" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="44" cy="32" r="2.5" fill="#232D36"/>
    <circle cx="58" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="60" cy="32" r="2.5" fill="#232D36"/>
  </g>
</svg>
