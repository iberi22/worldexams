  <circle cx="100" cy="95" r="75" fill="#4FB6A3"/>
  <!-- Capa frontal alegre -->
  <circle cx="65" cy="105" r="48" fill="#7BAE5A"/>
  <circle cx="135" cy="105" r="48" fill="#7BAE5A"/>
  <circle cx="100" cy="70" r="52" fill="#7BAE5A"/>
  <circle cx="100" cy="100" r="45" fill="#88C464"/>
  <!-- Detalle de frutitas o hojas amarillas -->
  <circle cx="75" cy="75" r="7" fill="#FF9F43"/>
  <circle cx="125" cy="80" r="7" fill="#FF9F43"/>
  <circle cx="100" cy="120" r="7" fill="#FF9F43"/>
  <circle cx="145" cy="115" r="6" fill="#F2C14E"/>
  <circle cx="55" cy="115" r="6" fill="#F2C14E"/>
</svg>
