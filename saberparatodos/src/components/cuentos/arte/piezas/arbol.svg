  <path d="M 85 130 Q 82 180 65 220 L 135 220 Q 118 180 115 130 Z" fill="#C97B3D"/>
  <!-- Ramas suaves -->
  <path d="M 85 150 Q 60 140 50 155" fill="none" stroke="#C97B3D" stroke-width="10" stroke-linecap="round"/>
  <path d="M 115 150 Q 140 140 150 155" fill="none" stroke="#C97B3D" stroke-width="10" stroke-linecap="round"/>
  <!-- Copa frondosa verde agua / bosque con círculos superpuestos -->
