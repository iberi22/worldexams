<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tito y Lila ayudan a Tana a recuperar los mangos del río">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo y vegetación lejana) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg6)" rx="12"/>
    <g data-idle="flota">
      <circle cx="700" cy="70" r="30" fill="#FFE3B3"/>
    </g>
  </g>

  <!-- Plano 2: Medio (Orilla y Tana observando alegre) -->
  <g id="plano-medio" data-plane="medio">
    <path d="M 0 300 Q 200 280 400 320 L 0 350 Z" fill="#4FB6A3"/>

    <!-- Tana sorprendida e ilusionada en la orilla -->
    <g data-hotspot="tana" data-etiqueta="Tana mirando a sus amigos" data-accion="salto" data-sonido="tucan" data-dice="¡Gracias, amigos!">
      <g data-idle="respira">
        <g transform="translate(80, 150) scale(0.85)">
          <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
          <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
          <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
          <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
          <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="85" cy="54" r="5" fill="#232D36"/>
          <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="115" cy="54" r="5" fill="#232D36"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Plano 3: Frente (Río, Tito pescando con su cola y Lila con una rama en primer plano) -->
  <g id="plano-frente" data-plane="frente">
    <path d="M 0 340 Q 200 310 400 350 Q 600 390 800 340 L 800 450 L 0 450 Z" fill="#5B7FA6"/>

    <!-- Tito el mono con su cola atrapando un mango -->
    <g data-hotspot="tito" data-etiqueta="Tito atrapa un mango con la cola" data-accion="giro" data-sonido="mono" data-dice="¡Te ayudo!">
      <g data-idle="balanceo">
        <g transform="translate(320, 140) scale(0.8)">
          <circle cx="60" cy="60" r="30" fill="#8B5A2B"/>
          <circle cx="60" cy="60" r="20" fill="#D2B48C"/>
          <!-- Cola larga atrapando mango -->
          <path d="M 80 80 Q 120 150 140 220 Q 150 250 130 260" stroke="#8B5A2B" stroke-width="12" fill="none" stroke-linecap="round"/>
          <ellipse cx="130" cy="270" rx="14" ry="20" fill="#FF9F43"/>
        </g>
      </g>
    </g>

    <!-- Lila la perezosa extendiendo rama en el agua -->
    <g data-hotspot="lila" data-etiqueta="Lila acerca un mango con una rama" data-accion="salto" data-sonido="perezosa" data-dice="Despacito…">
      <g data-idle="lento">
        <g transform="translate(520, 180) scale(0.75)">
          <ellipse cx="100" cy="125" rx="44" ry="48" fill="#A08C7D"/>
          <ellipse cx="100" cy="130" rx="28" ry="30" fill="#E6D7C3"/>
          <path d="M 60 140 L -60 210" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/>
          <ellipse cx="-60" cy="210" rx="14" ry="20" fill="#FF9F43"/>
        </g>
      </g>
    </g>
  </g>
</svg>
