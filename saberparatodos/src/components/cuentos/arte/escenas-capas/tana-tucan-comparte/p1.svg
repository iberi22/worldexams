<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tana la tucán ve un árbol lleno de mangos">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo, Sol y Nubes) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg1)" rx="12"/>
    <!-- Sol brillante (tocable) -->
    <g data-hotspot="sol" data-etiqueta="El sol de la mañana" data-accion="giro" data-sonido="brillo" data-dice="¡Buenos días!">
      <g data-idle="flota">
        <g transform="translate(680, 80)">
          <circle cx="0" cy="0" r="38" fill="#FFE3B3"/>
          <circle cx="0" cy="0" r="28" fill="#FF9F43"/>
        </g>
      </g>
    </g>
    <!-- Nubes suaves -->
    <g data-idle="flota">
      <path d="M 100 90 Q 120 70 150 80 Q 180 70 200 90 Q 210 110 190 120 Q 110 125 100 90 Z" fill="#FFFFFF" opacity="0.8"/>
      <path d="M 450 70 Q 470 50 500 60 Q 530 50 550 70 Q 560 90 540 100 Q 460 105 450 70 Z" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <!-- Plano 2: Medio (Selva y Árbol de Mangos) -->
  <g id="plano-medio" data-plane="medio">
    <path d="M 0 350 Q 250 280 500 340 Q 650 310 800 350 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>
    <path d="M 0 380 Q 300 320 600 370 Q 700 350 800 380 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

    <!-- Gran árbol de mangos: tocar = mirar de cerca y contar los mangos -->
    <g data-hotspot="arbol" data-etiqueta="El árbol de mangos. Tócalo para mirar de cerca y contar los mangos" data-accion="zoom" data-sonido="brillo" data-dice="¡Cuenta los mangos!">
      <g data-idle="mece">
        <rect x="360" y="160" width="80" height="230" rx="10" fill="#8B5A2B"/>
        <circle cx="400" cy="150" r="110" fill="#3D7D52"/>
        <circle cx="340" cy="170" r="80" fill="#2E623E"/>
        <circle cx="460" cy="170" r="80" fill="#2E623E"/>

        <!-- 5 Mangos en las ramas del árbol (mini-juego de conteo) -->
        <g id="mangos-p1" data-contar="mangos">
          <g data-contable data-etiqueta="Un mango"><ellipse cx="320" cy="160" rx="14" ry="20" fill="#FF9F43" transform="rotate(-10 320 160)"/></g>
          <g data-contable data-etiqueta="Un mango"><ellipse cx="360" cy="190" rx="14" ry="20" fill="#FF9F43" transform="rotate(15 360 190)"/></g>
          <g data-contable data-etiqueta="Un mango"><ellipse cx="400" cy="150" rx="14" ry="20" fill="#FF9F43" transform="rotate(-5 400 150)"/></g>
          <g data-contable data-etiqueta="Un mango"><ellipse cx="440" cy="185" rx="14" ry="20" fill="#FF9F43" transform="rotate(10 440 185)"/></g>
          <g data-contable data-etiqueta="Un mango"><ellipse cx="480" cy="155" rx="14" ry="20" fill="#FF9F43" transform="rotate(-15 480 155)"/></g>
        </g>
      </g>
    </g>
  </g>

  <!-- Plano 3: Frente (Tana en la rama en primer plano) -->
  <g id="plano-frente" data-plane="frente">
    <g data-hotspot="tana" data-etiqueta="Tana la tucán" data-accion="salto" data-sonido="tucan" data-dice="¡Hola! Soy Tana">
      <g data-idle="respira">
        <g transform="translate(140, 210) scale(0.85)">
          <!-- Tana la tucán -->
          <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
          <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
          <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
          <!-- pico -->
          <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
          <path d="M100 50 L162 71 Q168 73 162 76 L100 80 Z" fill="#FFB765"/>
          <!-- ojos -->
          <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="85" cy="54" r="5" fill="#232D36"/>
          <circle cx="87" cy="52" r="2" fill="#FFFFFF"/>
          <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="115" cy="54" r="5" fill="#232D36"/>
          <circle cx="117" cy="52" r="2" fill="#FFFFFF"/>
        </g>
      </g>
    </g>
    <!-- Rama del primer plano -->
    <path d="M 80 340 Q 200 320 370 340" stroke="#8B5A2B" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
</svg>
