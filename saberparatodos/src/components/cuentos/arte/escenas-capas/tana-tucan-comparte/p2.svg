<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tana la tucán guardando los cinco mangos en su nido">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo de selva y follaje lejano) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg2)" rx="12"/>
    <g data-idle="flota">
      <circle cx="120" cy="80" r="45" fill="#FFE3B3" opacity="0.7"/>
    </g>
    <path d="M 0 250 Q 200 180 400 240 Q 600 200 800 260 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.5"/>
  </g>

  <!-- Plano 2: Medio (Estructura del nido y ramas principales) -->
  <g id="plano-medio" data-plane="medio">
    <!-- Ramas soporte -->
    <path d="M 0 320 Q 300 280 800 350" stroke="#8B5A2B" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 200 380 Q 400 260 600 340" stroke="#6F4522" stroke-width="18" fill="none"/>

    <!-- Base del nido de ramas de selva -->
    <g data-hotspot="nido" data-etiqueta="El nido de Tana" data-accion="meneo" data-sonido="blip" data-dice="¡El nido!">
      <ellipse cx="400" cy="330" rx="160" ry="50" fill="#A06D3B"/>
      <ellipse cx="400" cy="325" rx="140" ry="38" fill="#6F4522"/>
    </g>
  </g>

  <!-- Plano 3: Frente (Tana en primer plano abrazando sus 5 mangos y hojas frontales) -->
  <g id="plano-frente" data-plane="frente">
    <g data-hotspot="tana" data-etiqueta="Tana abrazando sus mangos" data-accion="meneo" data-sonido="tucan" data-dice="¡Son todos míos!">
      <g data-idle="respira">
        <g transform="translate(300, 130)">
          <!-- Cuerpo de Tana -->
          <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
          <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
          <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>

          <!-- 5 mangos dentro del nido frente al pecho -->
          <ellipse cx="75" cy="150" rx="14" ry="20" fill="#FF9F43" transform="rotate(-20 75 150)"/>
          <ellipse cx="90" cy="145" rx="14" ry="20" fill="#FF9F43" transform="rotate(-5 90 145)"/>
          <ellipse cx="105" cy="152" rx="14" ry="20" fill="#FF9F43" transform="rotate(10 105 152)"/>
          <ellipse cx="120" cy="146" rx="14" ry="20" fill="#FF9F43" transform="rotate(25 120 146)"/>
          <ellipse cx="100" cy="135" rx="14" ry="20" fill="#FFB765"/>

          <!-- Pico de Tana sonriente -->
          <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
          <!-- Ojos cariñosos de Tana -->
          <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="85" cy="54" r="5" fill="#232D36"/>
          <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="115" cy="54" r="5" fill="#232D36"/>
        </g>
      </g>
    </g>

    <!-- Hojas decorativas de primer plano -->
    <g data-idle="mece">
      <path d="M 0 450 Q 120 360 220 450 Z" fill="#3D7D52"/>
    </g>
    <g data-idle="mece">
      <path d="M 580 450 Q 680 350 800 450 Z" fill="#3D7D52"/>
    </g>
  </g>
</svg>
