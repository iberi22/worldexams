<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="El mono Tito pide un mango y Tana dice que no">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo despejado y colinas lejanas) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg3)" rx="12"/>
    <g data-idle="flota">
      <circle cx="650" cy="90" r="35" fill="#FFE3B3"/>
    </g>
    <path d="M 0 320 Q 350 250 800 310 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>
  </g>

  <!-- Plano 2: Medio (Lomas verdes, Tana protegiendo sus mangos) -->
  <g id="plano-medio" data-plane="medio">
    <path d="M 0 370 Q 400 320 800 370 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

    <!-- Tana a la izquierda cubriendo sus mangos -->
    <g data-hotspot="tana" data-etiqueta="Tana cuidando sus mangos" data-accion="giro" data-sonido="tucan" data-dice="¡No! Son míos">
      <g data-idle="respira">
        <g transform="translate(180, 150) scale(0.9)">
          <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
          <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
          <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
          <!-- 5 mangos apretados -->
          <circle cx="90" cy="140" r="14" fill="#FF9F43"/>
          <circle cx="110" cy="140" r="14" fill="#FF9F43"/>
          <!-- pico volteado dando la espalda -->
          <path d="M80 50 L20 65 Q10 70 20 75 L80 85 Z" fill="#FF9F43"/>
          <!-- ojo serio/girado -->
          <circle cx="95" cy="52" r="10" fill="#FFFFFF"/>
          <circle cx="93" cy="53" r="5" fill="#232D36"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Plano 3: Frente (Tito el mono en primer plano colgando de liana) -->
  <g id="plano-frente" data-plane="frente">
    <g data-hotspot="tito" data-etiqueta="Tito el mono" data-accion="salto" data-sonido="mono" data-dice="¿Me das uno?">
      <g data-idle="balanceo">
        <path d="M 500 0 Q 550 120 620 180" stroke="#8B5A2B" stroke-width="12" fill="none"/>
        <g transform="translate(540, 160) scale(0.85)">
          <!-- Tito el mono -->
          <circle cx="60" cy="60" r="35" fill="#8B5A2B"/>
          <circle cx="60" cy="60" r="24" fill="#D2B48C"/>
          <circle cx="48" cy="52" r="5" fill="#232D36"/>
          <circle cx="72" cy="52" r="5" fill="#232D36"/>
          <!-- Boca expresiva pidiendo -->
          <path d="M 52 70 Q 60 78 68 70" fill="none" stroke="#232D36" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Orejas -->
          <circle cx="22" cy="58" r="12" fill="#8B5A2B"/>
          <circle cx="98" cy="58" r="12" fill="#8B5A2B"/>
          <!-- Mano extendida -->
          <path d="M 30 85 Q -10 100 -25 90" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round" fill="none"/>
        </g>
      </g>
    </g>
  </g>
</svg>
