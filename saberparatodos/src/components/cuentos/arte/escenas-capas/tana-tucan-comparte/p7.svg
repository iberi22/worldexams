<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tana reparte un mango a cada amigo y se quedan tres para comer juntos">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo de sol brillante) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg7)" rx="12"/>
    <g data-hotspot="sol" data-etiqueta="El sol brillante" data-accion="giro" data-sonido="brillo" data-dice="¡Qué día tan lindo!">
      <g data-idle="flota">
        <g transform="translate(400, 70)">
          <circle cx="0" cy="0" r="36" fill="#FFE3B3"/>
          <circle cx="0" cy="0" r="26" fill="#FF9F43"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Plano 2: Medio (Césped y hoja de pícnic grande) -->
  <g id="plano-medio" data-plane="medio">
    <path d="M 0 360 Q 400 310 800 360 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

    <!-- Mantel/hoja grande con los mangos: tocar = mirar de cerca y contar -->
    <g data-hotspot="picnic" data-etiqueta="El pícnic. Tócalo para mirar de cerca y contar los mangos que quedan" data-accion="zoom" data-sonido="brillo" data-dice="¿Cuántos quedan?">
      <ellipse cx="400" cy="350" rx="180" ry="40" fill="#3D7D52"/>

      <!-- Tres mangos restantes en el centro -->
      <g transform="translate(360, 335)">
        <g data-contar="mangos">
          <g data-contable data-etiqueta="Un mango"><ellipse cx="20" cy="0" rx="12" ry="18" fill="#FF9F43" transform="rotate(-15 20 0)"/></g>
          <g data-contable data-etiqueta="Un mango"><ellipse cx="40" cy="-5" rx="12" ry="18" fill="#FF9F43"/></g>
          <g data-contable data-etiqueta="Un mango"><ellipse cx="60" cy="0" rx="12" ry="18" fill="#FF9F43" transform="rotate(15 60 0)"/></g>
        </g>
      </g>
    </g>
  </g>

  <!-- Plano 3: Frente (Tana, Tito y Lila comiendo juntos felices en primer plano) -->
  <g id="plano-frente" data-plane="frente">
    <!-- Tana a la izquierda entregando alegremente -->
    <g data-hotspot="tana" data-etiqueta="Tana compartiendo" data-accion="salto" data-sonido="tucan" data-dice="¡Para compartir!">
      <g data-idle="respira">
        <g transform="translate(140, 160) scale(0.8)">
          <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
          <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
          <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
          <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
          <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="85" cy="54" r="5" fill="#232D36"/>
          <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
          <circle cx="115" cy="54" r="5" fill="#232D36"/>
        </g>
      </g>
    </g>

    <!-- Tito sonriendo a la derecha con un mango -->
    <g data-hotspot="tito" data-etiqueta="Tito con su mango" data-accion="salto" data-sonido="mono" data-dice="¡Gracias, Tana!">
      <g data-idle="balanceo">
        <g transform="translate(560, 180) scale(0.75)">
          <circle cx="60" cy="60" r="32" fill="#8B5A2B"/>
          <circle cx="60" cy="60" r="22" fill="#D2B48C"/>
          <ellipse cx="60" cy="100" rx="12" ry="18" fill="#FF9F43"/>
        </g>
      </g>
    </g>
  </g>
</svg>
