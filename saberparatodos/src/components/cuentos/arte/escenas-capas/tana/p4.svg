<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="La perezosa Lila pide un mango y Tana dice que no">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo con nubes) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg4)" rx="12"/>
    <path d="M 200 80 Q 220 60 250 70 Q 280 60 300 80 Q 310 100 290 110 Q 210 115 200 80 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 0 300 Q 300 240 800 300 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.5"/>
  </g>

  <!-- Plano 2: Medio (Tana obstinada en rama) -->
  <g id="plano-medio" data-plane="medio">
    <path d="M 0 370 Q 400 320 800 370 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

    <!-- Tana a la izquierda con cara obstinada -->
    <g transform="translate(180, 150) scale(0.9)">
      <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
      <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
      <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
      <circle cx="90" cy="140" r="14" fill="#FF9F43"/>
      <circle cx="110" cy="140" r="14" fill="#FF9F43"/>
      <!-- pico levantado al aire -->
      <path d="M100 50 L160 35 Q170 38 160 45 L100 62 Z" fill="#FF9F43"/>
      <circle cx="84" cy="52" r="10" fill="#FFFFFF"/>
      <circle cx="82" cy="50" r="5" fill="#232D36"/>
    </g>
  </g>

  <!-- Plano 3: Frente (Lila la perezosa trepando tronco vertical en primer plano) -->
  <g id="plano-frente" data-plane="frente">
    <rect x="580" y="0" width="60" height="450" fill="#8B5A2B"/>
    <g transform="translate(510, 140) scale(0.85)">
      <!-- Lila trepando despacio -->
      <ellipse cx="100" cy="125" rx="48" ry="52" fill="#A08C7D"/>
      <ellipse cx="100" cy="132" rx="30" ry="34" fill="#E6D7C3"/>
      <!-- Carita tierna -->
      <circle cx="88" cy="120" r="5" fill="#232D36"/>
      <circle cx="112" cy="120" r="5" fill="#232D36"/>
      <path d="M 94 135 Q 100 140 106 135" stroke="#232D36" stroke-width="3" fill="none"/>
      <!-- Brazos amarrados al tronco -->
      <path d="M 60 110 Q 130 90 150 110" stroke="#A08C7D" stroke-width="14" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
