<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Los tres amigos duermen la siesta bajo el árbol">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E2D5"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>

  <!-- Plano 1: Fondo (Cielo de atardecer pacífico y luna dormida) -->
  <g id="plano-fondo" data-plane="fondo">
    <rect width="800" height="450" fill="url(#bg8)" rx="12"/>
    <!-- Luna dorada durmiendo -->
    <g transform="translate(680, 80) scale(0.8)">
      <path d="M 15 -60 C 55 -60 70 -20 50 20 C 30 60 -20 70 -50 45 C -5 45 30 15 15 -60 Z" fill="#F2C14E"/>
    </g>
  </g>

  <!-- Plano 2: Medio (Gran árbol cobijando a los amigos) -->
  <g id="plano-medio" data-plane="medio">
    <path d="M 0 350 Q 400 300 800 350 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

    <!-- Tronco de gran árbol cobijando -->
    <rect x="350" y="50" width="100" height="320" rx="15" fill="#8B5A2B"/>
    <circle cx="400" cy="50" r="140" fill="#3D7D52" opacity="0.9"/>
  </g>

  <!-- Plano 3: Frente (Tana, Tito y Lila durmiendo la siesta en primer plano) -->
  <g id="plano-frente" data-plane="frente">
    <!-- Tana durmiendo (ojos cerrados en arco) -->
    <g transform="translate(200, 240) scale(0.75)">
      <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
      <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
      <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
      <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
      <!-- ojo durmiendo arco -->
      <path d="M 80 54 Q 85 62 90 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 110 54 Q 115 62 120 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Tito durmiendo -->
    <g transform="translate(360, 250) scale(0.75)">
      <circle cx="60" cy="60" r="32" fill="#8B5A2B"/>
      <circle cx="60" cy="60" r="22" fill="#D2B48C"/>
      <path d="M 48 56 Q 54 62 60 56" stroke="#232D36" stroke-width="3" fill="none"/>
      <path d="M 64 56 Q 70 62 76 56" stroke="#232D36" stroke-width="3" fill="none"/>
    </g>

    <!-- Lila durmiendo -->
    <g transform="translate(480, 255) scale(0.75)">
      <ellipse cx="60" cy="60" rx="36" ry="40" fill="#A08C7D"/>
      <path d="M 48 56 Q 54 62 60 56" stroke="#232D36" stroke-width="3" fill="none"/>
      <path d="M 64 56 Q 70 62 76 56" stroke="#232D36" stroke-width="3" fill="none"/>
    </g>
  </g>
</svg>
