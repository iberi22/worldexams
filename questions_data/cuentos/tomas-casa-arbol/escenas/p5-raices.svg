<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Construyen con madera, barro y vidrio protegiendo las raíces del suelo">
  <!-- Plano Fondo: Paisaje de obra limpia y cuidada -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <path d="M0 240 Q400 200 800 240 L800 450 L0 450 Z" fill="#E2EAD8"/>
  <!-- Plano Medio: Suelo corte transversal para mostrar las raíces del árbol intactas -->
  <rect x="0" y="320" width="800" height="130" fill="#8D6E63"/>
  <!-- Capa de tierra suave rica -->
  <rect x="0" y="300" width="800" height="25" fill="#A1887F"/>
  <path d="M0 300 Q200 295 400 300 T800 295 L800 320 L0 320 Z" fill="#795548"/>
  <!-- Tronco de Abuelo Ceiba saliendo hacia arriba -->
  <path d="M360 300 L370 50 Q400 40 430 50 L440 300 Z" fill="#8D5B4C"/>
  <!-- Raíces profundas y gruesas sanas bajo tierra libres de cimientos -->
  <path d="M380 300 Q320 340 220 370 Q150 390 80 380" stroke="#5D4037" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M420 300 Q480 340 580 370 Q650 390 720 380" stroke="#5D4037" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M395 300 Q380 360 360 420" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M405 300 Q420 360 440 420" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Pilares elevados sobre el suelo (sin tocar raíces) de madera y barro -->
  <rect x="180" y="220" width="35" height="80" rx="4" fill="#D7CCC8" stroke="#8D5B4C" stroke-width="3"/>
  <rect x="585" y="220" width="35" height="80" rx="4" fill="#D7CCC8" stroke="#8D5B4C" stroke-width="3"/>
  <!-- Piso de la casa elevado sobre soportes -->
  <rect x="120" y="200" width="560" height="25" rx="5" fill="#E8B04B" stroke="#3A2E2A" stroke-width="2"/>
  <!-- Bloques de barro/arcilla respetuosos y tablones de madera preparados -->
  <rect x="140" y="160" width="30" height="40" rx="3" fill="#C97B3D"/>
  <rect x="175" y="160" width="30" height="40" rx="3" fill="#C97B3D"/>
  <rect x="590" y="160" width="30" height="40" rx="3" fill="#C97B3D"/>
  <rect x="625" y="160" width="30" height="40" rx="3" fill="#C97B3D"/>
  <!-- Plano Frente: Tomás y Alba colocando materiales con cuidado -->
  <g transform="translate(230, 110)">
    <!-- Alba alzando un cubo de barro suave -->
    <path d="M10 50 L40 50 L46 90 L4 90 Z" fill="#4FB6A3"/>
    <circle cx="25" cy="25" r="18" fill="#FCE3C8"/>
    <circle cx="20" cy="24" r="3" fill="#3A2E2A"/>
    <circle cx="30" cy="24" r="3" fill="#3A2E2A"/>
    <path d="M21 32 Q25 36 29 32" stroke="#3A2E2A" stroke-width="2" fill="none"/>
    <!-- Vasija con barro amigable -->
    <ellipse cx="60" cy="70" rx="15" ry="12" fill="#A1887F"/>
  </g>
</svg>