<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Tomás el arquitecto">
  <!-- Cuerpo / Camisa de arquitecto (verde firma #7BAE5A) -->
  <ellipse cx="100" cy="145" rx="42" ry="50" fill="#7BAE5A"/>
  <!-- Cuello de la camisa -->
  <path d="M85 100 L100 118 L115 100 Z" fill="#FFF6E8"/>
  <path d="M82 98 L100 115 L118 98" stroke="#3A2E2A" stroke-width="2.5" fill="none"/>
  <!-- Lápiz de madera en el bolsillo -->
  <rect x="120" y="120" width="8" height="24" rx="2" fill="#FF9F43"/>
  <polygon points="120,144 124,152 128,144" fill="#E8B04B"/>
  <polygon points="123,150 124,152 125,150" fill="#3A2E2A"/>
  <!-- Cabeza -->
  <circle cx="100" cy="65" r="38" fill="#FCE3C8"/>
  <!-- Cabello castaño rizado suave -->
  <path d="M62 62 Q60 30 100 28 Q140 30 138 62 Q128 35 100 35 Q72 35 62 62 Z" fill="#5D4037"/>
  <circle cx="70" cy="38" r="10" fill="#5D4037"/>
  <circle cx="100" cy="32" r="12" fill="#5D4037"/>
  <circle cx="130" cy="38" r="10" fill="#5D4037"/>
  <!-- Ojos plantilla común -->
  <circle cx="84" cy="62" r="9" fill="#FFFFFF"/>
  <circle cx="85" cy="63" r="4.5" fill="#3A2E2A"/>
  <circle cx="87" cy="61" r="1.8" fill="#FFFFFF"/>
  <circle cx="116" cy="62" r="9" fill="#FFFFFF"/>
  <circle cx="115" cy="63" r="4.5" fill="#3A2E2A"/>
  <circle cx="117" cy="61" r="1.8" fill="#FFFFFF"/>
  <!-- Cejas calmas y amables -->
  <path d="M78 49 Q84 46 90 49" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M110 49 Q116 46 122 49" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Nariz pequeña -->
  <circle cx="100" cy="69" r="3" fill="#ECA888"/>
  <!-- Sonrisa radiante -->
  <path d="M90 76 Q100 86 110 76" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Mejillas sonrosadas -->
  <circle cx="74" cy="73" r="6" fill="#E26D5A" opacity="0.45"/>
  <circle cx="126" cy="73" r="6" fill="#E26D5A" opacity="0.45"/>
  <!-- Casco de protección amarillo pastel claro -->
  <path d="M60 52 C60 25 140 25 140 52 Z" fill="#FFD54F"/>
  <rect x="54" y="50" width="92" height="6" rx="3" fill="#FFC107"/>
  <!-- Brazos amables -->
  <ellipse cx="58" cy="140" rx="10" ry="24" fill="#7BAE5A" transform="rotate(15 58 140)"/>
  <ellipse cx="142" cy="140" rx="10" ry="24" fill="#7BAE5A" transform="rotate(-15 142 140)"/>
  <!-- Manos -->
  <circle cx="52" cy="162" r="8" fill="#FCE3C8"/>
  <circle cx="148" cy="162" r="8" fill="#FCE3C8"/>
</svg>