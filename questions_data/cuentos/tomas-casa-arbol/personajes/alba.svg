  <path d="M80 53 Q85 50 91 53" stroke="#3A2E2A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M109 53 Q115 50 120 53" stroke="#3A2E2A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
