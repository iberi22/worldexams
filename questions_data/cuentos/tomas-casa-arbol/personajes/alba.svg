  <path d="M80 44 Q100 38 120 44" stroke="#3A2E2A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Ojos plantilla común -->
  <circle cx="85" cy="66" r="9" fill="#FFFFFF"/>
  <circle cx="86" cy="67" r="4.5" fill="#3A2E2A"/>
  <circle cx="88" cy="65" r="1.8" fill="#FFFFFF"/>
  <circle cx="115" cy="66" r="9" fill="#FFFFFF"/>
  <circle cx="114" cy="67" r="4.5" fill="#3A2E2A"/>
  <circle cx="116" cy="65" r="1.8" fill="#FFFFFF"/>
