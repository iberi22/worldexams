<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bruno triste frente a hoyos secos en el desierto">
  <!-- PLANO FONDO -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <circle cx="200" cy="110" r="40" fill="#FF9F43" opacity="0.8"/>
  <path d="M 0 250 Q 300 210 500 260 Q 700 290 800 230 L 800 450 L 0 450 Z" fill="#FCEBD0"/>

  <!-- PLANO MEDIO -->
  <path d="M 0 310 Q 250 280 500 330 Q 720 360 800 320 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Hoyos secos en la arena -->
  <ellipse cx="200" cy="370" rx="45" ry="15" fill="#3A2E2A" opacity="0.6"/>
  <ellipse cx="340" cy="390" rx="35" ry="12" fill="#3A2E2A" opacity="0.6"/>
  <ellipse cx="600" cy="365" rx="50" ry="18" fill="#3A2E2A" opacity="0.6"/>

  <!-- PLANO FRENTE: Bruno sentado con cara triste/frustrado -->
  <g transform="translate(420, 270)">
    <!-- Cola -->
    <path d="M 70 80 Q 110 60 100 100 Z" fill="#E8B04B"/>
    <!-- Cuerpo -->
    <ellipse cx="50" cy="75" rx="28" ry="35" fill="#E8B04B"/>
    <ellipse cx="50" cy="78" rx="16" ry="20" fill="#FFF6E8"/>
    <!-- Orejas caídas hacia los lados -->
    <path d="M 30 25 Q -10 10 15 40 Z" fill="#E8B04B"/>
    <path d="M 70 25 Q 110 10 85 40 Z" fill="#E8B04B"/>
    <!-- Cabeza -->
    <circle cx="50" cy="35" r="24" fill="#E8B04B"/>
    <ellipse cx="50" cy="42" rx="12" ry="8" fill="#FFF6E8"/>
    <ellipse cx="50" cy="38" rx="4" ry="3" fill="#3A2E2A"/>
    <!-- Ojos tristes -->
    <circle cx="40" cy="30" r="6" fill="#FFFFFF"/>
    <circle cx="40" cy="31" r="3" fill="#3A2E2A"/>
    <circle cx="60" cy="30" r="6" fill="#FFFFFF"/>
    <circle cx="60" cy="31" r="3" fill="#3A2E2A"/>
    <!-- Boca triste -->
    <path d="M 44 48 Q 50 44 56 48" stroke="#3A2E2A" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
