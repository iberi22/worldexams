<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bruno cava rápido en el desierto buscando agua">
  <!-- PLANO FONDO: Cielo cálido de día y dunas lejanas -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <circle cx="680" cy="90" r="45" fill="#FF9F43" opacity="0.85"/>
  <path d="M 0 260 Q 220 200 450 250 Q 650 300 800 240 L 800 450 L 0 450 Z" fill="#FCEBD0"/>

  <!-- PLANO MEDIO: Dunas cercanas y tierra -->
  <path d="M 0 320 Q 300 270 550 330 Q 700 370 800 310 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Cactus lejanos -->
  <rect x="620" y="220" width="12" height="40" rx="6" fill="#7BAE5A"/>
  <rect x="120" y="230" width="10" height="35" rx="5" fill="#7BAE5A"/>

  <!-- PLANO FRENTE: Bruno cavando rápido, arena volando -->
  <!-- Arena volando por cavar rápido -->
  <circle cx="340" cy="330" r="12" fill="#D49933" opacity="0.7"/>
  <circle cx="320" cy="310" r="8" fill="#FCEBD0" opacity="0.8"/>
  <circle cx="360" cy="300" r="15" fill="#E8B04B" opacity="0.7"/>
  <circle cx="380" cy="320" r="10" fill="#D49933" opacity="0.6"/>

  <!-- Bruno cavando -->
  <g transform="translate(380, 280)">
    <!-- Cuerpo de Bruno inclinado -->
    <ellipse cx="60" cy="70" rx="35" ry="30" fill="#E8B04B"/>
    <!-- Orejas grandes -->
    <path d="M 30 20 Q 0 -30 25 35 Z" fill="#E8B04B"/>
    <path d="M 60 20 Q 80 -30 65 35 Z" fill="#E8B04B"/>
    <!-- Cabeza -->
    <circle cx="45" cy="40" r="25" fill="#E8B04B"/>
    <circle cx="35" cy="36" r="7" fill="#FFFFFF"/>
    <circle cx="35" cy="37" r="3.5" fill="#3A2E2A"/>
    <!-- Hocico -->
    <ellipse cx="45" cy="48" rx="12" ry="8" fill="#FFF6E8"/>
    <ellipse cx="45" cy="44" rx="4" ry="3" fill="#3A2E2A"/>
  </g>
</svg>
