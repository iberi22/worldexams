<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bruno comparte el pozo de agua con Nuna y el Abuelo Espino">
  <!-- PLANO FONDO: Mañanita fresca con sol naciente -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <circle cx="400" cy="180" r="70" fill="#FF9F43" opacity="0.4"/>
  <path d="M 0 250 Q 250 210 500 260 Q 700 280 800 230 L 800 450 L 0 450 Z" fill="#FCEBD0"/>

  <!-- PLANO MEDIO -->
  <path d="M 0 310 Q 300 280 550 330 Q 700 360 800 310 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Pozo central de agua -->
  <ellipse cx="400" cy="370" rx="90" ry="38" fill="#8C6239"/>
  <ellipse cx="400" cy="370" rx="78" ry="30" fill="#4FB6A3"/>
  <ellipse cx="400" cy="370" rx="60" ry="20" fill="#62D0BD"/>
  <path d="M 360 365 Q 400 380 440 365" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Bruno sonriendo al lado del pozo -->
  <g transform="translate(230, 270)">
    <ellipse cx="40" cy="60" rx="24" ry="28" fill="#E8B04B"/>
    <circle cx="40" cy="30" r="20" fill="#E8B04B"/>
    <path d="M 25 15 Q 0 -20 20 25 Z" fill="#E8B04B"/>
    <path d="M 55 15 Q 80 -20 60 25 Z" fill="#E8B04B"/>
    <circle cx="33" cy="27" r="5" fill="#FFFFFF"/>
    <circle cx="33" cy="28" r="2.5" fill="#3A2E2A"/>
    <circle cx="47" cy="27" r="5" fill="#FFFFFF"/>
    <circle cx="47" cy="28" r="2.5" fill="#3A2E2A"/>
    <path d="M 34 35 Q 40 40 46 35" stroke="#3A2E2A" stroke-width="2" fill="none"/>
  </g>

  <!-- Nuna bebiendo agua feliz -->
  <g transform="translate(480, 310)">
    <ellipse cx="40" cy="35" rx="30" ry="20" fill="#4FB6A3"/>
    <circle cx="15" cy="40" r="12" fill="#78C6B7"/>
    <circle cx="10" cy="38" r="3" fill="#FFFFFF"/>
    <circle cx="10" cy="39" r="1.5" fill="#3A2E2A"/>
  </g>

  <!-- Abuelo Espino cerca del pozo -->
  <g transform="translate(610, 210)">
    <rect x="20" y="30" width="30" height="90" rx="15" fill="#7BAE5A"/>
    <circle cx="35" cy="25" r="8" fill="#FF9F43"/>
    <circle cx="28" cy="50" r="4" fill="#FFFFFF"/>
    <circle cx="28" cy="51" r="2" fill="#3A2E2A"/>
    <circle cx="42" cy="50" r="4" fill="#FFFFFF"/>
    <circle cx="42" cy="51" r="2" fill="#3A2E2A"/>
  </g>
</svg>
