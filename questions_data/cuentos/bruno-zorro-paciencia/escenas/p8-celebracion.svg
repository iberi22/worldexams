<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Celebración y siesta alegre de Bruno, Nuna y Espino junto al oasis">
  <!-- PLANO FONDO: Sol pleno radiante -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <circle cx="400" cy="110" r="50" fill="#FF9F43"/>
  <circle cx="400" cy="110" r="62" fill="#FF9F43" opacity="0.3"/>
  <path d="M 0 250 Q 250 210 500 260 Q 700 280 800 230 L 800 450 L 0 450 Z" fill="#FCEBD0"/>

  <!-- PLANO MEDIO -->
  <path d="M 0 310 Q 300 280 550 330 Q 700 360 800 310 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Oasis florecido con varias plantas verdes -->
  <circle cx="280" cy="330" r="25" fill="#7BAE5A"/>
  <circle cx="520" cy="325" r="30" fill="#5A8E3A"/>
  <!-- Pozo abundante -->
  <ellipse cx="400" cy="360" rx="100" ry="40" fill="#4FB6A3"/>
  <ellipse cx="400" cy="360" rx="80" ry="28" fill="#62D0BD"/>

  <!-- Bruno descansando contento -->
  <g transform="translate(290, 310)">
    <ellipse cx="40" cy="30" rx="28" ry="18" fill="#E8B04B"/>
    <circle cx="20" cy="22" r="16" fill="#E8B04B"/>
    <!-- Orejas descansando -->
    <path d="M 10 12 Q -10 5 8 20 Z" fill="#E8B04B"/>
    <path d="M 30 12 Q 45 5 28 20 Z" fill="#E8B04B"/>
    <!-- Ojos cerrados sonrientes -->
    <path d="M 12 22 Q 17 26 22 22" stroke="#3A2E2A" stroke-width="2" fill="none"/>
  </g>

  <!-- Nuna descansando alegre -->
  <g transform="translate(460, 325)">
    <ellipse cx="30" cy="25" rx="24" ry="16" fill="#4FB6A3"/>
    <circle cx="50" cy="20" r="10" fill="#78C6B7"/>
  </g>

  <!-- Abuelo Espino radiante -->
  <g transform="translate(630, 210)">
    <rect x="20" y="30" width="32" height="95" rx="16" fill="#7BAE5A"/>
    <circle cx="36" cy="22" r="12" fill="#FF9F43"/>
    <circle cx="36" cy="22" r="6" fill="#FFF6E8"/>
    <!-- Sonrisa amplia -->
    <path d="M 28 65 Q 36 73 44 65" stroke="#3A2E2A" stroke-width="2.5" fill="none"/>
  </g>
</svg>
