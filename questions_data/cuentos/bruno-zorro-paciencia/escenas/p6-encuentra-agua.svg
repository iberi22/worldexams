<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bruno encuentra humedad y agua fresca bajo la tierra húmeda">
  <!-- PLANO FONDO: Noche amaneciendo con tonos púrpuras y azul suave -->
  <rect width="800" height="450" fill="#5B6FD6"/>
  <circle cx="100" cy="80" r="30" fill="#FFF6E8" opacity="0.6"/>

  <path d="M 0 260 Q 250 220 500 270 Q 700 290 800 240 L 800 450 L 0 450 Z" fill="#6C7CE0"/>

  <!-- PLANO MEDIO: Duna de arena -->
  <path d="M 0 320 Q 300 280 550 330 Q 700 360 800 310 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Pozo con agua fresca azul brillante -->
  <ellipse cx="400" cy="385" rx="70" ry="30" fill="#8C6239"/>
  <ellipse cx="400" cy="385" rx="58" ry="22" fill="#4FB6A3"/>
  <ellipse cx="400" cy="385" rx="42" ry="14" fill="#62D0BD"/>
  <!-- Destellos de agua -->
  <circle cx="380" cy="380" r="3" fill="#FFFFFF"/>
  <circle cx="410" cy="388" r="2.5" fill="#FFFFFF"/>

  <!-- Bruno emocionado cavando suavemente -->
  <g transform="translate(290, 275)">
    <ellipse cx="50" cy="70" rx="28" ry="32" fill="#E8B04B"/>
    <ellipse cx="50" cy="73" rx="16" ry="18" fill="#FFF6E8"/>
    <!-- Orejas -->
    <path d="M 28 20 Q 0 -25 22 30 Z" fill="#E8B04B"/>
    <path d="M 72 20 Q 100 -25 78 30 Z" fill="#E8B04B"/>
    <!-- Cabeza inclinada feliz -->
    <circle cx="50" cy="35" r="22" fill="#E8B04B"/>
    <circle cx="42" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="42" cy="33" r="2.5" fill="#3A2E2A"/>
    <circle cx="58" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="58" cy="33" r="2.5" fill="#3A2E2A"/>
    <!-- Sonrisa grande -->
    <path d="M 44 43 Q 50 49 56 43" stroke="#3A2E2A" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
