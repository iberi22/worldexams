<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bruno espera bajo la noche estrellada del desierto respirando con calma">
  <!-- PLANO FONDO: Noche estrellada -->
  <rect width="800" height="450" fill="#2F3A45"/>
  <!-- Luna sonriente -->
  <circle cx="680" cy="90" r="35" fill="#FFF6E8"/>
  <circle cx="670" cy="85" r="30" fill="#2F3A45"/>
  <!-- Estrellas brillantes -->
  <circle cx="120" cy="80" r="3" fill="#FFF6E8" opacity="0.9"/>
  <circle cx="250" cy="120" r="2.5" fill="#FFF6E8" opacity="0.8"/>
  <circle cx="380" cy="70" r="3.5" fill="#FFF6E8" opacity="0.95"/>
  <circle cx="500" cy="110" r="2" fill="#FFF6E8" opacity="0.8"/>
  <circle cx="600" cy="60" r="3" fill="#FFF6E8" opacity="0.9"/>

  <path d="M 0 260 Q 250 220 500 270 Q 700 290 800 240 L 800 450 L 0 450 Z" fill="#3D4B58"/>

  <!-- PLANO MEDIO: Dunas nocturnas -->
  <path d="M 0 320 Q 300 280 550 330 Q 700 360 800 310 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- PLANO FRENTE: Bruno tranquilo con ojos cerrados respirando -->
  <g transform="translate(360, 280)">
    <ellipse cx="50" cy="75" rx="30" ry="35" fill="#E8B04B"/>
    <ellipse cx="50" cy="78" rx="16" ry="20" fill="#FFF6E8"/>
    <!-- Orejas erguidas y atentas -->
    <path d="M 28 20 Q -5 -25 22 30 Z" fill="#E8B04B"/>
    <path d="M 72 20 Q 105 -25 78 30 Z" fill="#E8B04B"/>
    <!-- Cabeza -->
    <circle cx="50" cy="38" r="24" fill="#E8B04B"/>
    <ellipse cx="50" cy="45" rx="12" ry="8" fill="#FFF6E8"/>
    <ellipse cx="50" cy="41" rx="4" ry="3" fill="#3A2E2A"/>
    <!-- Ojos cerrados con paz (arcos) -->
    <path d="M 38 34 Q 44 40 50 34" stroke="#3A2E2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 50 34 Q 56 40 62 34" stroke="#3A2E2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Brisa de calma / respiración -->
    <path d="M 80 40 Q 95 35 110 40 M 85 50 Q 100 45 115 50" stroke="#FFF6E8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
