<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nuna la tortuga enseña a Bruno a cavar despacio cerca de las raíces">
  <!-- PLANO FONDO -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <circle cx="120" cy="100" r="45" fill="#FF9F43" opacity="0.8"/>
  <path d="M 0 260 Q 250 220 500 270 Q 700 290 800 240 L 800 450 L 0 450 Z" fill="#FCEBD0"/>

  <!-- PLANO MEDIO -->
  <path d="M 0 310 Q 300 280 550 330 Q 700 360 800 310 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Arbusto y raíces suaves en la tierra -->
  <path d="M 520 340 Q 510 380 480 400 M 530 345 Q 540 390 560 410" stroke="#8C6239" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="530" cy="320" r="30" fill="#7BAE5A"/>
  <circle cx="550" cy="305" r="22" fill="#5A8E3A"/>

  <!-- Nuna la tortuga guiando -->
  <g transform="translate(360, 310)">
    <ellipse cx="50" cy="50" rx="35" ry="25" fill="#4FB6A3"/>
    <ellipse cx="50" cy="46" rx="28" ry="20" fill="#78C6B7"/>
    <circle cx="20" cy="35" r="14" fill="#78C6B7"/>
    <circle cx="15" cy="32" r="4" fill="#FFFFFF"/>
    <circle cx="15" cy="32" r="2" fill="#3A2E2A"/>
    <!-- Pata cavando despacio -->
    <ellipse cx="25" cy="65" rx="8" ry="12" fill="#3D9B8A"/>
  </g>

  <!-- Bruno escuchando con atención -->
  <g transform="translate(210, 290)">
    <ellipse cx="40" cy="60" rx="25" ry="30" fill="#E8B04B"/>
    <path d="M 25 15 Q 0 -20 20 25 Z" fill="#E8B04B"/>
    <path d="M 55 15 Q 80 -20 60 25 Z" fill="#E8B04B"/>
    <circle cx="40" cy="28" r="20" fill="#E8B04B"/>
    <circle cx="32" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="32" cy="25" r="2.5" fill="#3A2E2A"/>
    <circle cx="48" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="48" cy="25" r="2.5" fill="#3A2E2A"/>
  </g>
</svg>
