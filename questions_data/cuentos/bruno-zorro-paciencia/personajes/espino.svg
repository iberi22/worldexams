<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cactus Abuelo Espino">
  <!-- Maceta / Tierra del desierto -->
  <path d="M 60 170 Q 100 185 140 170 L 130 190 Q 100 198 70 190 Z" fill="#D49933"/>
  <!-- Cuerpo principal del cactus -->
  <rect x="75" y="50" width="50" height="120" rx="25" fill="#7BAE5A"/>
  <!-- Brazos amables del cactus -->
  <path d="M 75 100 L 45 100 Q 35 100 35 80 L 35 70" fill="none" stroke="#7BAE5A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 125 110 L 155 110 Q 165 110 165 90 L 165 80" fill="none" stroke="#7BAE5A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flor amarilla/suave arriba en la cabeza -->
  <circle cx="100" cy="45" r="12" fill="#FF9F43"/>
  <circle cx="100" cy="45" r="6" fill="#FFF6E8"/>
  <!-- Ojos sabios y amables plantilla común -->
  <circle cx="88" cy="80" r="8" fill="#FFFFFF"/>
  <circle cx="89" cy="81" r="4" fill="#3A2E2A"/>
  <circle cx="90" cy="80" r="1.5" fill="#FFFFFF"/>
  <circle cx="112" cy="80" r="8" fill="#FFFFFF"/>
  <circle cx="111" cy="81" r="4" fill="#3A2E2A"/>
  <circle cx="110" cy="80" r="1.5" fill="#FFFFFF"/>
  <!-- Gran sonrisa del abuelo Espino -->
  <path d="M 90 96 Q 100 106 110 96" stroke="#3A2E2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Mejillas -->
  <circle cx="78" cy="88" r="5" fill="#E26D5A" opacity="0.4"/>
  <circle cx="122" cy="88" r="5" fill="#E26D5A" opacity="0.4"/>
  <!-- Espinas suaves (puntos/pequeñas líneas redondas) -->
  <circle cx="80" cy="62" r="2" fill="#5A8E3A"/>
  <circle cx="120" cy="62" r="2" fill="#5A8E3A"/>
  <circle cx="82" cy="130" r="2" fill="#5A8E3A"/>
  <circle cx="118" cy="130" r="2" fill="#5A8E3A"/>
  <circle cx="35" cy="65" r="2" fill="#5A8E3A"/>
  <circle cx="165" cy="75" r="2" fill="#5A8E3A"/>
</svg>
