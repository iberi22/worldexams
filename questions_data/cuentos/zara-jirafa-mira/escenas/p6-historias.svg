<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="El leon viejito Rugido contando historias a Zara y Mote">
  <!-- PLANO 1: FONDO -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <path d="M 0 0 L 800 0 L 800 220 Q 400 240 0 220 Z" fill="#FFE3B3" opacity="0.5"/>

  <!-- PLANO 2: MEDIO (Gran acacia dando sombra) -->
  <g transform="translate(300, 100)">
    <path d="M 100 220 L 90 80 L 130 80 L 120 220 Z" fill="#C97B3D"/>
    <ellipse cx="110" cy="70" rx="200" ry="40" fill="#7BAE5A"/>
    <ellipse cx="110" cy="50" rx="150" ry="30" fill="#88C464"/>
  </g>

  <!-- PLANO 3: FRENTE (Sombra debajo del arbol) -->
  <path d="M 0 320 Q 400 300 800 320 L 800 450 L 0 450 Z" fill="#E8B04B"/>
  <ellipse cx="400" cy="360" rx="280" ry="50" fill="#C97B3D" opacity="0.3"/>

  <!-- Rugido echado en el centro contando historias -->
  <g transform="translate(320, 240)">
    <!-- Melena y cuerpo -->
    <circle cx="80" cy="50" r="45" fill="#C97B3D"/>
    <ellipse cx="80" cy="90" rx="42" ry="28" fill="#FFB765"/>
    <circle cx="80" cy="50" r="28" fill="#FFB765"/>
    <ellipse cx="80" cy="58" rx="16" ry="12" fill="#FFE3B3"/>
    <!-- Ojos abuelito hablando -->
    <circle cx="68" cy="44" r="6" fill="#FFFFFF"/>
    <circle cx="69" cy="45" r="3" fill="#3A2E2A"/>
    <circle cx="92" cy="44" r="6" fill="#FFFFFF"/>
    <circle cx="93" cy="45" r="3" fill="#3A2E2A"/>
    <!-- Boquita abierta contando cuento dulce -->
    <path d="M 72 62 Q 80 72 88 62 Z" fill="#3A2E2A"/>
    <!-- Frutas caidas alrededor -->
    <circle cx="20" cy="100" r="8" fill="#FF9F43"/>
    <circle cx="140" cy="102" r="7" fill="#FF9F43"/>
  </g>

  <!-- Zara sentada/echada escuchando -->
  <g transform="translate(120, 220)">
    <ellipse cx="60" cy="120" rx="35" ry="24" fill="#F2C14E"/>
    <path d="M 70 100 Q 80 50 100 30 L 115 35 Q 95 60 85 110 Z" fill="#F2C14E"/>
    <ellipse cx="108" cy="28" rx="16" ry="12" fill="#F2C14E"/>
    <circle cx="104" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="105" cy="25" r="2.5" fill="#3A2E2A"/>
  </g>

  <!-- Mote sentado escuchando atento -->
  <g transform="translate(560, 270)">
    <ellipse cx="30" cy="50" rx="14" ry="22" fill="#E8B04B"/>
    <circle cx="30" cy="22" r="12" fill="#E8B04B"/>
    <circle cx="25" cy="20" r="4" fill="#FFFFFF"/>
    <circle cx="26" cy="20" r="2" fill="#3A2E2A"/>
  </g>
</svg>
