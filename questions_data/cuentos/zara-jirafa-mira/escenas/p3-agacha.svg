<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Zara agacha el cuello para ver el mundo bajito de Mote">
  <!-- PLANO 1: FONDO -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <path d="M 0 0 L 800 0 L 800 230 Q 400 250 0 230 Z" fill="#FFE3B3" opacity="0.5"/>

  <!-- PLANO 2: MEDIO (Terreno y acacia de fondo) -->
  <path d="M 0 250 Q 300 220 800 260 L 800 450 L 0 450 Z" fill="#E8B04B" opacity="0.5"/>

  <!-- PLANO 3: FRENTE (Zara doblando su cuello hacia el suelo) -->
  <path d="M 0 340 Q 400 320 800 340 L 800 450 L 0 450 Z" fill="#E8B04B"/>

  <!-- Zara doblando el cuello larguisimo cerca del suelo -->
  <g transform="translate(100, 150)">
    <!-- Patas traseras y cuerpo -->
    <ellipse cx="120" cy="180" rx="40" ry="30" fill="#F2C14E"/>
    <rect x="95" y="190" width="12" height="70" rx="5" fill="#F2C14E"/>
    <rect x="130" y="190" width="12" height="70" rx="5" fill="#F2C14E"/>

    <!-- Cuello curvilineo bajando hasta la derecha -->
    <path d="M 140 170 Q 250 160 380 210 Q 380 235 240 195 Q 130 190 120 180 Z" fill="#F2C14E"/>
    <!-- Manchas a lo largo del cuello doblado -->
    <rect x="170" y="170" width="16" height="12" rx="5" fill="#C97B3D"/>
    <rect x="220" y="172" width="18" height="14" rx="6" fill="#C97B3D"/>
    <rect x="280" y="185" width="18" height="14" rx="5" fill="#C97B3D"/>

    <!-- Cabeza de Zara bajita a la altura del suelo -->
    <g transform="translate(360, 190)">
      <ellipse cx="30" cy="20" rx="24" ry="18" fill="#F2C14E"/>
      <ellipse cx="42" cy="24" rx="14" ry="10" fill="#FFE3B3"/>
      <!-- Ojo atento de Zara buscando ver -->
      <circle cx="26" cy="14" r="6" fill="#FFFFFF"/>
      <circle cx="27" cy="15" r="3" fill="#3A2E2A"/>
      <circle cx="28" cy="13" r="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Mote al frente sorprendido viendo a Zara acercarse -->
  <g transform="translate(560, 270)">
    <ellipse cx="40" cy="60" rx="18" ry="30" fill="#E8B04B"/>
    <circle cx="40" cy="24" r="16" fill="#E8B04B"/>
    <circle cx="32" cy="20" r="5" fill="#FFFFFF"/>
    <circle cx="33" cy="21" r="2.5" fill="#3A2E2A"/>
    <circle cx="48" cy="20" r="5" fill="#FFFFFF"/>
    <circle cx="49" cy="21" r="2.5" fill="#3A2E2A"/>
  </g>
</svg>
