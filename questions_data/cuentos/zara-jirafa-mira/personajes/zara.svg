<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Zara la jirafa">
  <!-- Orejas detras del cuerpo/cabeza -->
  <ellipse cx="64" cy="50" rx="8" ry="18" fill="#F2C14E" transform="rotate(-30 64 50)"/>
  <ellipse cx="64" cy="50" rx="5" ry="12" fill="#E8B04B" transform="rotate(-30 64 50)"/>
  <ellipse cx="136" cy="50" rx="8" ry="18" fill="#F2C14E" transform="rotate(30 136 50)"/>
  <ellipse cx="136" cy="50" rx="5" ry="12" fill="#E8B04B" transform="rotate(30 136 50)"/>

  <!-- Cuernitos (osiconos) -->
  <rect x="86" y="22" width="6" height="20" rx="3" fill="#C97B3D"/>
  <circle cx="89" cy="20" r="6" fill="#C97B3D"/>
  <rect x="108" y="22" width="6" height="20" rx="3" fill="#C97B3D"/>
  <circle cx="111" cy="20" r="6" fill="#C97B3D"/>

  <!-- Cuello largo -->
  <path d="M78 80 L72 185 L128 185 L122 80 Z" fill="#F2C14E"/>
  <!-- Manchas del cuello -->
  <rect x="80" y="95" width="18" height="14" rx="6" fill="#C97B3D"/>
  <rect x="102" y="120" width="20" height="16" rx="6" fill="#C97B3D"/>
  <rect x="78" y="148" width="22" height="16" rx="7" fill="#C97B3D"/>
  <rect x="104" y="166" width="18" height="14" rx="5" fill="#C97B3D"/>

  <!-- Cabeza de la jirafa -->
  <ellipse cx="100" cy="62" rx="36" ry="32" fill="#F2C14E"/>
  <!-- Hocico suave redondeado -->
  <ellipse cx="100" cy="76" rx="22" ry="16" fill="#FFE3B3"/>
  <circle cx="93" cy="74" r="2.5" fill="#3A2E2A"/>
  <circle cx="107" cy="74" r="2.5" fill="#3A2E2A"/>
  <path d="M 94 80 Q 100 85 106 80" fill="none" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ojos plantilla comun (dos circulos blancos + pupila oscura + brillo) -->
  <circle cx="82" cy="54" r="10" fill="#FFFFFF"/>
  <circle cx="83" cy="55" r="4.5" fill="#3A2E2A"/>
  <circle cx="85" cy="53" r="1.8" fill="#FFFFFF"/>

  <circle cx="118" cy="54" r="10" fill="#FFFFFF"/>
  <circle cx="119" cy="55" r="4.5" fill="#3A2E2A"/>
  <circle cx="121" cy="53" r="1.8" fill="#FFFFFF"/>

  <!-- Mejillas sonrojadas -->
  <circle cx="70" cy="68" r="6" fill="#E26D5A" opacity="0.5"/>
  <circle cx="130" cy="68" r="6" fill="#E26D5A" opacity="0.5"/>
</svg>
