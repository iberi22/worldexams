<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mote el suricata">
  <!-- Cola erguida trasera -->
  <path d="M 125 145 Q 150 140 155 110" fill="none" stroke="#A67C52" stroke-width="10" stroke-linecap="round"/>

  <!-- Orejitas oscuras laterales -->
  <circle cx="68" cy="62" r="9" fill="#3A2E2A"/>
  <circle cx="132" cy="62" r="9" fill="#3A2E2A"/>

  <!-- Cuerpo de pie elegante -->
  <ellipse cx="100" cy="130" rx="32" ry="50" fill="#E8B04B"/>
  <!-- Pecho claro -->
  <ellipse cx="100" cy="132" rx="20" ry="36" fill="#FFF6E8"/>

  <!-- Rayas de la espalda suavemente visibles -->
  <path d="M 78 115 Q 86 113 90 115" stroke="#A67C52" stroke-width="3" stroke-linecap="round"/>
  <path d="M 76 130 Q 86 128 92 130" stroke="#A67C52" stroke-width="3" stroke-linecap="round"/>
  <path d="M 110 115 Q 114 113 122 115" stroke="#A67C52" stroke-width="3" stroke-linecap="round"/>
  <path d="M 108 130 Q 114 128 124 130" stroke="#A67C52" stroke-width="3" stroke-linecap="round"/>

  <!-- Cabeza del suricata -->
  <ellipse cx="100" cy="72" rx="28" ry="24" fill="#E8B04B"/>
  <!-- Cara/Hocico claro -->
  <ellipse cx="100" cy="80" rx="18" ry="12" fill="#FFF6E8"/>
  <!-- Nariz triangulito oscuro -->
  <path d="M 96 76 L 104 76 L 100 81 Z" fill="#3A2E2A"/>
  <path d="M 97 83 Q 100 86 103 83" fill="none" stroke="#3A2E2A" stroke-width="2" stroke-linecap="round"/>

  <!-- Manchas oscuras alrededor de los ojos (tipico de suricatas) -->
  <ellipse cx="82" cy="68" rx="10" ry="9" fill="#3A2E2A"/>
  <ellipse cx="118" cy="68" rx="10" ry="9" fill="#3A2E2A"/>

  <!-- Ojos plantilla comun dentro de la mancha -->
  <circle cx="82" cy="68" r="7" fill="#FFFFFF"/>
  <circle cx="83" cy="69" r="3.5" fill="#3A2E2A"/>
  <circle cx="84" cy="67" r="1.5" fill="#FFFFFF"/>

  <circle cx="118" cy="68" r="7" fill="#FFFFFF"/>
  <circle cx="119" cy="69" r="3.5" fill="#3A2E2A"/>
  <circle cx="120" cy="67" r="1.5" fill="#FFFFFF"/>

  <!-- Patitas delanteras cruzadas en el pecho -->
  <ellipse cx="82" cy="122" rx="7" ry="16" fill="#A67C52" transform="rotate(20 82 122)"/>
  <ellipse cx="118" cy="122" rx="7" ry="16" fill="#A67C52" transform="rotate(-20 118 122)"/>

  <!-- Patitas traseras apoyadas en el suelo -->
  <rect x="78" y="172" width="14" height="10" rx="5" fill="#A67C52"/>
  <rect x="108" y="172" width="14" height="10" rx="5" fill="#A67C52"/>
</svg>
