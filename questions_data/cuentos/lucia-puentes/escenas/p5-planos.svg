<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lucía la ingeniera mide la orilla del río con planos desplegados">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Orilla del río y colinas -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="url(#bg5)"/>
    <circle cx="120" cy="80" r="35" fill="#FFE3B3"/>
    <circle cx="120" cy="80" r="25" fill="#FF9F43"/>
    <path d="M 0 280 Q 250 200 500 270 Q 650 220 800 280 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>
  </g>

  <!-- Plano Medio: El río y las bases de piedra del arco comenzando a construirse -->
  <g id="plano-medio">
    <path d="M 0 350 Q 400 260 800 350 L 800 450 L 0 450 Z" fill="#4FB6A3"/>
    <!-- Terreno de trabajo orilla -->
    <path d="M 0 300 Q 300 280 400 450 L 0 450 Z" fill="#7BAE5A"/>

    <!-- Base del puente en la izquierda construida con bloques de piedra -->
    <rect x="220" y="240" width="80" height="90" rx="4" fill="#7F8C8D"/>
    <line x1="220" y1="270" x2="300" y2="270" stroke="#3A2E2A" stroke-width="2"/>
    <line x1="220" y1="300" x2="300" y2="300" stroke="#3A2E2A" stroke-width="2"/>

    <!-- Cinta de medir larga de color naranja que cruza el terreno -->
    <path d="M 120 370 Q 250 350 380 380" stroke="#FF9F43" stroke-width="6" stroke-dasharray="10 5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Plano Frente: Lucía con plano grande y casco de ingeniera -->
  <g id="plano-frente">
    <!-- Mesa de campo con plano desplegado -->
    <rect x="30" y="320" width="220" height="15" rx="3" fill="#C97B3D"/>
    <rect x="50" y="335" width="15" height="100" fill="#8B5A2B"/>
    <rect x="210" y="335" width="15" height="100" fill="#8B5A2B"/>

    <!-- Plano grande azul con líneas de estructura dibujadas -->
    <rect x="40" y="300" width="200" height="25" rx="3" fill="#5B6FD6" transform="rotate(-5 40 300)"/>
    <path d="M 60 312 Q 140 295 220 312" stroke="#FFFFFF" stroke-width="3" fill="none" transform="rotate(-5 40 300)"/>

    <!-- Lucía ingeniera adulta -->
    <g transform="translate(180, 150) scale(0.9)">
      <circle cx="100" cy="85" r="54" fill="#5A3A28"/>
      <circle cx="100" cy="92" r="42" fill="#F8CBB2"/>
      <circle cx="84" cy="88" r="8" fill="#FFFFFF"/>
      <circle cx="85" cy="89" r="4" fill="#232D36"/>
      <circle cx="116" cy="88" r="8" fill="#FFFFFF"/>
      <circle cx="117" cy="89" r="4" fill="#232D36"/>
      <path d="M 88 108 Q 100 120 112 108" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 54 74 Q 100 32 146 74 Z" fill="#E26D5A"/>
      <rect x="48" y="72" width="104" height="10" rx="5" fill="#C95441"/>
      <path d="M 62 142 Q 100 134 138 142 L 148 260 L 52 260 Z" fill="#E26D5A"/>
    </g>
  </g>
</svg>
