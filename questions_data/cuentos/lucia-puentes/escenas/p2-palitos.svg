<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lucía construye un puente de palitos que se cae alegremente">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6EC"/>
      <stop offset="100%" stop-color="#FFE3B3"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Habitación cálida con ventana -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="url(#bg2)"/>
    <!-- Ventana al jardín -->
    <rect x="520" y="60" width="200" height="160" rx="8" fill="#EBF5EE" stroke="#8B5A2B" stroke-width="6"/>
    <line x1="620" y1="60" x2="620" y2="220" stroke="#8B5A2B" stroke-width="4"/>
    <line x1="520" y1="140" x2="720" y2="140" stroke="#8B5A2B" stroke-width="4"/>
    <circle cx="660" cy="100" r="20" fill="#FF9F43"/>
  </g>

  <!-- Plano Medio: Mesa de trabajo y palitos caídos -->
  <g id="plano-medio">
    <!-- Mesa -->
    <rect x="150" y="240" width="500" height="15" rx="4" fill="#C97B3D"/>
    <rect x="200" y="255" width="20" height="140" fill="#8B5A2B"/>
    <rect x="580" y="255" width="20" height="140" fill="#8B5A2B"/>

    <!-- Dos soportes de bloques de madera -->
    <rect x="220" y="160" width="60" height="80" rx="4" fill="#5B6FD6"/>
    <rect x="520" y="160" width="60" height="80" rx="4" fill="#5B6FD6"/>

    <!-- Palitos de madera caídos en la mesa -->
    <line x1="280" y1="230" x2="350" y2="238" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"/>
    <line x1="330" y1="235" x2="410" y2="225" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"/>
    <line x1="420" y1="230" x2="500" y2="238" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"/>
    <line x1="370" y1="228" x2="450" y2="235" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"/>

    <!-- Juguete osito en medio de los palitos caídos -->
    <circle cx="400" cy="205" r="16" fill="#C97B3D"/>
    <circle cx="390" cy="192" r="6" fill="#C97B3D"/>
    <circle cx="410" cy="192" r="6" fill="#C97B3D"/>
    <circle cx="396" cy="203" r="2" fill="#232D36"/>
    <circle cx="404" cy="203" r="2" fill="#232D36"/>

    <!-- Cuaderno de notas abierto con dibujos -->
    <rect x="100" y="310" width="90" height="70" fill="#FFFFFF" stroke="#3A2E2A" stroke-width="2" rx="4" transform="rotate(-10 100 310)"/>
    <line x1="110" y1="330" x2="160" y2="320" stroke="#E26D5A" stroke-width="3" stroke-linecap="round" transform="rotate(-10 100 310)"/>
    <line x1="110" y1="345" x2="170" y2="335" stroke="#4FB6A3" stroke-width="3" stroke-linecap="round" transform="rotate(-10 100 310)"/>
  </g>

  <!-- Plano Frente: Lucía niña sonriendo ante el experimento -->
  <g id="plano-frente" transform="translate(40, 160) scale(0.9)">
    <!-- Lucía con su casco firma -->
    <circle cx="100" cy="85" r="54" fill="#5A3A28"/>
    <circle cx="100" cy="92" r="42" fill="#F8CBB2"/>
    <!-- Ojos sonrientes -->
    <circle cx="84" cy="88" r="8" fill="#FFFFFF"/>
    <circle cx="85" cy="89" r="4" fill="#232D36"/>
    <circle cx="116" cy="88" r="8" fill="#FFFFFF"/>
    <circle cx="117" cy="89" r="4" fill="#232D36"/>
    <!-- Sonrisa alegre -->
    <path d="M 88 108 Q 100 120 112 108" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Casco terracota -->
    <path d="M 54 74 Q 100 32 146 74 Z" fill="#E26D5A"/>
    <rect x="48" y="72" width="104" height="10" rx="5" fill="#C95441"/>
    <!-- Cuerpo -->
    <path d="M 62 142 Q 100 134 138 142 L 148 220 L 52 220 Z" fill="#E26D5A"/>
  </g>
</svg>
