<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lucía enseña a niños a medir y construir maquetas de puentes">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Paisaje luminoso del parque junto al puente -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="url(#bg8)"/>
    <circle cx="680" cy="70" r="35" fill="#FFE3B3"/>
    <circle cx="680" cy="70" r="25" fill="#FF9F43"/>
    <!-- Silueta del puente de fondo -->
    <path d="M 450 180 Q 600 80 750 180" stroke="#BDC3C7" stroke-width="12" fill="none"/>
  </g>

  <!-- Plano Medio: Mesa al aire libre con reglas, cuerdas y maquetas de arcos -->
  <g id="plano-medio">
    <!-- Mesa -->
    <rect x="200" y="260" width="500" height="18" rx="4" fill="#C97B3D"/>
    <rect x="250" y="278" width="20" height="130" fill="#8B5A2B"/>
    <rect x="630" y="278" width="20" height="130" fill="#8B5A2B"/>

    <!-- Maqueta de arco pequeñita terminada sobre la mesa -->
    <path d="M 380 260 Q 480 180 580 260" stroke="#FF9F43" stroke-width="12" fill="none"/>

    <!-- Reglas coloridas y cuerda de medir -->
    <rect x="230" y="250" width="120" height="10" fill="#5B6FD6" rx="2"/>
    <path d="M 280 252 Q 310 240 340 252" stroke="#E26D5A" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Plano Frente: Lucía sonriente explicando con pasión a niños -->
  <g id="plano-frente">
    <!-- Lucía a la izquierda -->
    <g transform="translate(60, 160) scale(0.9)">
      <circle cx="100" cy="85" r="54" fill="#5A3A28"/>
      <circle cx="100" cy="92" r="42" fill="#F8CBB2"/>
      <circle cx="84" cy="88" r="8" fill="#FFFFFF"/>
      <circle cx="85" cy="89" r="4" fill="#232D36"/>
      <circle cx="116" cy="88" r="8" fill="#FFFFFF"/>
      <circle cx="117" cy="89" r="4" fill="#232D36"/>
      <path d="M 88 108 Q 100 120 112 108" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 54 74 Q 100 32 146 74 Z" fill="#E26D5A"/>
      <rect x="48" y="72" width="104" height="10" rx="5" fill="#C95441"/>
      <path d="M 62 142 Q 100 134 138 142 L 148 240 L 52 240 Z" fill="#E26D5A"/>
    </g>

    <!-- Niños atentos escuchando la moraleja -->
    <g transform="translate(480, 180) scale(0.85)">
      <circle cx="100" cy="80" r="44" fill="#6B4423"/>
      <circle cx="100" cy="90" r="38" fill="#F8CBB2"/>
      <circle cx="84" cy="86" r="8" fill="#FFFFFF"/>
      <circle cx="85" cy="87" r="4" fill="#232D36"/>
      <circle cx="116" cy="86" r="8" fill="#FFFFFF"/>
      <circle cx="117" cy="87" r="4" fill="#232D36"/>
      <path d="M 88 106 Q 100 118 112 106" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 60 138 Q 100 130 140 138 L 150 240 L 50 240 Z" fill="#4FB6A3"/>
    </g>
  </g>
</svg>
