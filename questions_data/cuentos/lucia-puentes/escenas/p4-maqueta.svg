<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lucía prueba una maqueta en arco con diez piedras de peso">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE3B3"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Fondo de taller cálido -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="url(#bg4)"/>
    <!-- Estantería con herramientas y cuaderno -->
    <rect x="580" y="60" width="180" height="15" fill="#8B5A2B"/>
    <rect x="600" y="25" width="25" height="35" rx="3" fill="#4FB6A3"/>
    <rect x="640" y="15" width="20" height="45" rx="3" fill="#5B6FD6"/>
    <rect x="680" y="30" width="30" height="30" rx="3" fill="#E26D5A"/>
  </g>

  <!-- Plano Medio: Mesa con la maqueta del arco firme y 10 piedras encima -->
  <g id="plano-medio">
    <!-- Mesa de taller -->
    <rect x="120" y="280" width="560" height="20" rx="5" fill="#C97B3D"/>
    <rect x="180" y="300" width="25" height="120" fill="#8B5A2B"/>
    <rect x="590" y="300" width="25" height="120" fill="#8B5A2B"/>

    <!-- Dos soportes laterales del arco -->
    <rect x="220" y="200" width="70" height="80" rx="4" fill="#5B6FD6"/>
    <rect x="510" y="200" width="70" height="80" rx="4" fill="#5B6FD6"/>

    <!-- Estructura de cartón en arco perfecto -->
    <path d="M 230 280 Q 400 130 570 280" stroke="#FF9F43" stroke-width="16" fill="none"/>
    <path d="M 240 280 Q 400 145 560 280" stroke="#FFE3B3" stroke-width="6" fill="none"/>

    <!-- Cuerda y regla de medir sobre la mesa -->
    <rect x="150" y="268" width="100" height="10" fill="#FF9F43" rx="2"/>
    <path d="M 600 270 Q 630 260 650 280" stroke="#5B6FD6" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- 10 Piedras apiladas en equilibrio ordenado sobre la cima del arco -->
    <g id="piedras" fill="#7F8C8D" stroke="#3A2E2A" stroke-width="2">
      <!-- Fila base de 4 piedras sobre la cima -->
      <ellipse cx="350" cy="165" rx="14" ry="10"/>
      <ellipse cx="380" cy="163" rx="14" ry="10"/>
      <ellipse cx="410" cy="163" rx="14" ry="10"/>
      <ellipse cx="440" cy="165" rx="14" ry="10"/>
      <!-- Fila 2 de 3 piedras -->
      <ellipse cx="365" cy="148" rx="13" ry="9"/>
      <ellipse cx="395" cy="146" rx="13" ry="9"/>
      <ellipse cx="425" cy="148" rx="13" ry="9"/>
      <!-- Fila 3 de 2 piedras -->
      <ellipse cx="380" cy="132" rx="12" ry="8"/>
      <ellipse cx="410" cy="132" rx="12" ry="8"/>
      <!-- Piedra 10 en la cima -->
      <ellipse cx="395" cy="118" rx="11" ry="7" fill="#BDC3C7"/>
    </g>
  </g>

  <!-- Plano Frente: Nico aplaudiendo y Lucía orgullosa -->
  <g id="plano-frente">
    <!-- Lucía a la izquierda de la mesa -->
    <g transform="translate(30, 180) scale(0.85)">
      <circle cx="100" cy="85" r="54" fill="#5A3A28"/>
      <circle cx="100" cy="92" r="42" fill="#F8CBB2"/>
      <circle cx="84" cy="88" r="8" fill="#FFFFFF"/>
      <circle cx="85" cy="89" r="4" fill="#232D36"/>
      <circle cx="116" cy="88" r="8" fill="#FFFFFF"/>
      <circle cx="117" cy="89" r="4" fill="#232D36"/>
      <path d="M 88 108 Q 100 120 112 108" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 54 74 Q 100 32 146 74 Z" fill="#E26D5A"/>
      <rect x="48" y="72" width="104" height="10" rx="5" fill="#C95441"/>
      <path d="M 62 142 Q 100 134 138 142 L 148 240 L 52 240 Z" fill="#E26D5A"/>
    </g>

    <!-- Nico a la derecha sonriendo y aplaudiendo -->
    <g transform="translate(630, 180) scale(0.85)">
      <circle cx="100" cy="80" r="48" fill="#6B4423"/>
      <circle cx="100" cy="90" r="40" fill="#F8CBB2"/>
      <circle cx="84" cy="86" r="8" fill="#FFFFFF"/>
      <circle cx="85" cy="87" r="4" fill="#232D36"/>
      <circle cx="116" cy="86" r="8" fill="#FFFFFF"/>
      <circle cx="117" cy="87" r="4" fill="#232D36"/>
      <path d="M 88 106 Q 100 118 112 106" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 60 138 Q 100 130 140 138 L 150 240 L 50 240 Z" fill="#4FB6A3"/>
    </g>
  </g>
</svg>
