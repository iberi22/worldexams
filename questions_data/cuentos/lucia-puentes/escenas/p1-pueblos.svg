<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Dos pueblos separados por un gran río">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cielo y Sol -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="url(#bg1)"/>
    <circle cx="680" cy="80" r="38" fill="#FFE3B3"/>
    <circle cx="680" cy="80" r="28" fill="#FF9F43"/>
    <!-- Nubes -->
    <path d="M 120 80 Q 140 60 170 70 Q 200 60 220 80 Q 230 100 210 110 Q 130 115 120 80 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M 450 70 Q 470 50 500 60 Q 530 50 550 70 Q 560 90 540 100 Q 460 105 450 70 Z" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Plano Medio: Montañas, Casas de los dos pueblos y Orillas -->
  <g id="plano-medio">
    <!-- Montañas lejanas -->
    <path d="M 0 300 L 180 180 L 320 310 L 500 170 L 680 300 L 800 220 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.7"/>

    <!-- Orilla izquierda: Pueblo del Sol -->
    <path d="M 0 250 Q 200 240 280 450 L 0 450 Z" fill="#7BAE5A"/>
    <!-- Casas del pueblo 1 -->
    <rect x="50" y="220" width="50" height="40" fill="#E26D5A" rx="4"/>
    <polygon points="40,220 75,190 110,220" fill="#8B5A2B"/>
    <rect x="130" y="240" width="45" height="35" fill="#FF9F43" rx="4"/>
    <polygon points="120,240 152,215 185,240" fill="#8B5A2B"/>

    <!-- Orilla derecha: Pueblo de la Luna -->
    <path d="M 520 450 Q 600 240 800 250 L 800 450 Z" fill="#7BAE5A"/>
    <!-- Casas del pueblo 2 -->
    <rect x="620" y="220" width="50" height="40" fill="#5B6FD6" rx="4"/>
    <polygon points="610,220 645,190 680,220" fill="#8B5A2B"/>
    <rect x="700" y="240" width="45" height="35" fill="#4FB6A3" rx="4"/>
    <polygon points="690,240 722,215 755,240" fill="#8B5A2B"/>

    <!-- Río ancho y caudales en el centro -->
    <path d="M 280 450 Q 200 240 380 200 Q 560 200 520 450 Z" fill="#4FB6A3"/>
    <!-- Corrientes de agua en el río -->
    <path d="M 310 320 Q 360 300 410 330" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 360 390 Q 420 370 470 400" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Plano Frente: Árboles en la orilla y espacio de observación -->
  <g id="plano-frente">
    <circle cx="80" cy="330" r="35" fill="#3D7D52"/>
    <rect x="75" y="350" width="10" height="40" fill="#8B5A2B"/>
    <circle cx="730" cy="330" r="35" fill="#3D7D52"/>
    <rect x="725" y="350" width="10" height="40" fill="#8B5A2B"/>
  </g>
</svg>
