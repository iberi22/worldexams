<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lucía la ingeniera">
  <!-- Pelo castaño rizado de Lucía -->
  <circle cx="100" cy="85" r="54" fill="#5A3A28"/>
  <circle cx="56" cy="88" r="22" fill="#5A3A28"/>
  <circle cx="144" cy="88" r="22" fill="#5A3A28"/>
  <!-- Cabeza y rostro -->
  <circle cx="100" cy="92" r="42" fill="#F8CBB2"/>
  <!-- Ojos plantilla -->
  <g id="ojos-lucia">
    <circle cx="84" cy="88" r="9" fill="#FFFFFF"/>
    <circle cx="85" cy="89" r="4" fill="#232D36"/>
    <circle cx="87" cy="87" r="1.5" fill="#FFFFFF"/>
    <circle cx="116" cy="88" r="9" fill="#FFFFFF"/>
    <circle cx="117" cy="89" r="4" fill="#232D36"/>
    <circle cx="119" cy="87" r="1.5" fill="#FFFFFF"/>
  </g>
  <!-- Cejas animadas y alegres -->
  <path d="M 77 75 Q 84 72 91 76" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 109 76 Q 116 72 123 75" stroke="#3A2E2A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Sonrisa amplia -->
  <path d="M 88 108 Q 100 120 112 108" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Mejillas rosadas -->
  <circle cx="72" cy="100" r="6" fill="#E26D5A" opacity="0.45"/>
  <circle cx="128" cy="100" r="6" fill="#E26D5A" opacity="0.45"/>
  <!-- Casco de ingeniera terracota (#E26D5A) -->
  <path d="M 54 74 Q 100 32 146 74 Z" fill="#E26D5A"/>
  <rect x="48" y="72" width="104" height="10" rx="5" fill="#C95441"/>
  <!-- Linterna/insignia del casco -->
  <circle cx="100" cy="58" r="7" fill="#FFE3B3"/>
  <circle cx="100" cy="58" r="4" fill="#FF9F43"/>
  <!-- Cuerpo / ropa firma terracota (#E26D5A) -->
  <path d="M 62 142 Q 100 134 138 142 L 148 200 L 52 200 Z" fill="#E26D5A"/>
  <!-- Cuello camisola -->
  <path d="M 86 138 L 100 152 L 114 138 Z" fill="#FFFFFF"/>
  <!-- Lápiz de madera en la oreja/bolsillo -->
  <rect x="134" y="112" width="8" height="28" rx="2" fill="#FF9F43" transform="rotate(20 134 112)"/>
  <polygon points="134,140 142,140 138,148" fill="#F8CBB2" transform="rotate(20 134 112)"/>
</svg>
