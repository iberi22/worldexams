<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="La maestra de Lucía">
  <!-- Cabello peinado alto color café -->
  <circle cx="100" cy="50" r="26" fill="#4A2E1B"/>
  <circle cx="100" cy="85" r="48" fill="#4A2E1B"/>
  <!-- Cabeza -->
  <circle cx="100" cy="92" r="40" fill="#F8CBB2"/>
  <!-- Lentes redondos amables -->
  <circle cx="82" cy="88" r="14" stroke="#3A2E2A" stroke-width="2.5" fill="none"/>
  <circle cx="118" cy="88" r="14" stroke="#3A2E2A" stroke-width="2.5" fill="none"/>
  <line x1="96" y1="88" x2="104" y2="88" stroke="#3A2E2A" stroke-width="2.5"/>
  <!-- Ojos plantilla detrás de gafas -->
  <g id="ojos-maestra">
    <circle cx="82" cy="88" r="7" fill="#FFFFFF"/>
    <circle cx="83" cy="89" r="3.5" fill="#232D36"/>
    <circle cx="85" cy="87" r="1.2" fill="#FFFFFF"/>
    <circle cx="118" cy="88" r="7" fill="#FFFFFF"/>
    <circle cx="119" cy="89" r="3.5" fill="#232D36"/>
    <circle cx="121" cy="87" r="1.2" fill="#FFFFFF"/>
  </g>
  <!-- Sonrisa dulce -->
  <path d="M 88 110 Q 100 120 112 110" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Mejillas -->
  <circle cx="70" cy="102" r="5" fill="#E26D5A" opacity="0.35"/>
  <circle cx="130" cy="102" r="5" fill="#E26D5A" opacity="0.35"/>
  <!-- Vestido/Blusa azul cometa (#5B6FD6) -->
  <path d="M 58 140 Q 100 132 142 140 L 152 200 L 48 200 Z" fill="#5B6FD6"/>
  <!-- Pañuelo de cuello -->
  <path d="M 85 138 Q 100 155 115 138 Z" fill="#FFE3B3"/>
</svg>
