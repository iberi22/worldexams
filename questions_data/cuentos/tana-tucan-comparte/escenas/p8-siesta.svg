<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Los tres amigos duermen la siesta bajo el árbol">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E2D5"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg8)"/>

  <!-- Colina pacífica de tarde -->
  <path d="M 0 350 Q 400 300 800 350 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Tronco de gran árbol cobijando -->
  <rect x="350" y="50" width="100" height="320" rx="15" fill="#8B5A2B"/>
  <circle cx="400" cy="50" r="140" fill="#3D7D52" opacity="0.9"/>

  <!-- Tana durmiendo (ojos cerrados arco) -->
  <g transform="translate(200, 240) scale(0.75)">
    <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
    <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
    <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
    <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
    <!-- ojo durmiendo arco -->
    <path d="M 80 54 Q 85 62 90 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 110 54 Q 115 62 120 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tito durmiendo -->
  <g transform="translate(360, 250) scale(0.75)">
    <ellipse cx="100" cy="130" rx="45" ry="50" fill="#8B5A2B"/>
    <circle cx="100" cy="70" r="42" fill="#8B5A2B"/>
    <ellipse cx="100" cy="76" rx="30" ry="24" fill="#D2B48C"/>
    <!-- ojos cerrados -->
    <path d="M 80 60 Q 85 66 90 60" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
    <path d="M 110 60 Q 115 66 120 60" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Lila durmiendo plácidamente -->
  <g transform="translate(500, 245) scale(0.75)">
    <ellipse cx="100" cy="125" rx="48" ry="52" fill="#A08C7D"/>
    <circle cx="100" cy="70" r="40" fill="#A08C7D"/>
    <ellipse cx="100" cy="72" rx="32" ry="26" fill="#E6D7C3"/>
    <ellipse cx="82" cy="68" rx="12" ry="10" fill="#6E5A4C"/>
    <ellipse cx="118" cy="68" rx="12" ry="10" fill="#6E5A4C"/>
    <!-- ojos cerrados -->
    <path d="M 78 68 Q 83 74 88 68" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
    <path d="M 112 68 Q 117 74 122 68" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
