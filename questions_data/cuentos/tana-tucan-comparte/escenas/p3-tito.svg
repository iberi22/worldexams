<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="El mono Tito pide un mango y Tana dice que no">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <path d="M 0 370 Q 400 320 800 370 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Tana a la izquierda cubriendo sus mangos -->
  <g transform="translate(180, 150) scale(0.9)">
    <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
    <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
    <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
    <!-- 5 mangos apretados -->
    <circle cx="90" cy="140" r="14" fill="#FF9F43"/>
    <circle cx="110" cy="140" r="14" fill="#FF9F43"/>
    <!-- pico volteado dando la espalda -->
    <path d="M80 50 L20 65 Q10 70 20 75 L80 85 Z" fill="#FF9F43"/>
    <!-- ojo serio/girado -->
    <circle cx="95" cy="52" r="10" fill="#FFFFFF"/>
    <circle cx="93" cy="53" r="5" fill="#232D36"/>
  </g>

  <!-- Tito el mono colgado de una rama a la derecha -->
  <path d="M 500 0 Q 550 120 620 180" stroke="#8B5A2B" stroke-width="12" fill="none"/>
  <g transform="translate(540, 160) scale(0.85)">
    <!-- Tito -->
    <ellipse cx="100" cy="130" rx="45" ry="50" fill="#8B5A2B"/>
    <ellipse cx="100" cy="136" rx="28" ry="32" fill="#D2B48C"/>
    <circle cx="100" cy="70" r="42" fill="#8B5A2B"/>
    <circle cx="58" cy="70" r="14" fill="#8B5A2B"/>
    <circle cx="58" cy="70" r="8" fill="#D2B48C"/>
    <circle cx="142" cy="70" r="14" fill="#8B5A2B"/>
    <circle cx="142" cy="70" r="8" fill="#D2B48C"/>
    <ellipse cx="100" cy="76" rx="30" ry="24" fill="#D2B48C"/>
    <!-- ojos suplicantes -->
    <circle cx="85" cy="58" r="10" fill="#FFFFFF"/>
    <circle cx="86" cy="60" r="5" fill="#232D36"/>
    <circle cx="115" cy="58" r="10" fill="#FFFFFF"/>
    <circle cx="116" cy="60" r="5" fill="#232D36"/>
    <!-- mano extendida pidiendo -->
    <path d="M 60 130 Q 10 120 0 130" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
</svg>
