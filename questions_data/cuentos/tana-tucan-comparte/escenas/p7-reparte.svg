<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tana reparte un mango a cada amigo y se quedan tres">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg7)"/>
  <path d="M 0 360 Q 400 310 800 360 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Mantel/hoja grande en el centro para comer juntos -->
  <ellipse cx="400" cy="350" rx="180" ry="40" fill="#3D7D52"/>

  <!-- Tres mangos restantes en el centro -->
  <g transform="translate(360, 335)">
    <ellipse cx="20" cy="0" rx="12" ry="18" fill="#FF9F43" transform="rotate(-15 20 0)"/>
    <ellipse cx="40" cy="-5" rx="12" ry="18" fill="#FF9F43"/>
    <ellipse cx="60" cy="0" rx="12" ry="18" fill="#FF9F43" transform="rotate(15 60 0)"/>
  </g>

  <!-- Tana a la izquierda entregando alegremente -->
  <g transform="translate(140, 160) scale(0.8)">
    <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
    <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
    <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
    <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
    <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="85" cy="54" r="5" fill="#232D36"/>
    <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="115" cy="54" r="5" fill="#232D36"/>
    <circle cx="70" cy="70" r="6" fill="#E26D5A" opacity="0.55"/>
  </g>

  <!-- Tito el mono con su mango sonriente -->
  <g transform="translate(350, 170) scale(0.75)">
    <ellipse cx="100" cy="130" rx="45" ry="50" fill="#8B5A2B"/>
    <circle cx="100" cy="70" r="42" fill="#8B5A2B"/>
    <ellipse cx="100" cy="76" rx="30" ry="24" fill="#D2B48C"/>
    <circle cx="85" cy="58" r="10" fill="#FFFFFF"/>
    <circle cx="86" cy="60" r="5" fill="#232D36"/>
    <circle cx="115" cy="58" r="10" fill="#FFFFFF"/>
    <circle cx="116" cy="60" r="5" fill="#232D36"/>
    <!-- sosteniendo un mango feliz -->
    <ellipse cx="100" cy="120" rx="14" ry="20" fill="#FF9F43"/>
  </g>

  <!-- Lila la perezosa con su mango -->
  <g transform="translate(540, 170) scale(0.75)">
    <ellipse cx="100" cy="125" rx="48" ry="52" fill="#A08C7D"/>
    <circle cx="100" cy="70" r="40" fill="#A08C7D"/>
    <ellipse cx="100" cy="72" rx="32" ry="26" fill="#E6D7C3"/>
    <ellipse cx="82" cy="68" rx="12" ry="10" fill="#6E5A4C"/>
    <ellipse cx="118" cy="68" rx="12" ry="10" fill="#6E5A4C"/>
    <circle cx="83" cy="67" r="8" fill="#FFFFFF"/>
    <circle cx="84" cy="68" r="4" fill="#232D36"/>
    <circle cx="117" cy="67" r="8" fill="#FFFFFF"/>
    <circle cx="118" cy="68" r="4" fill="#232D36"/>
    <ellipse cx="100" cy="120" rx="14" ry="20" fill="#FF9F43"/>
  </g>
</svg>
