<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Dos mangos ruedan de alas de Tana hacia el río">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg5)"/>

  <!-- Río en movimiento abajo -->
  <path d="M 0 340 Q 200 310 400 350 Q 600 390 800 340 L 800 450 L 0 450 Z" fill="#5B7FA6"/>
  <!-- Olas del río -->
  <path d="M 50 370 Q 100 360 150 370" stroke="#EBF5EE" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 350 390 Q 400 380 450 390" stroke="#EBF5EE" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 600 360 Q 650 350 700 360" stroke="#EBF5EE" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Barranco/pasto donde está Tana -->
  <path d="M 0 320 Q 300 280 500 330 L 0 350 Z" fill="#4FB6A3"/>

  <!-- Tana asustada/llorando -->
  <g transform="translate(120, 130)">
    <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
    <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
    <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
    <!-- alas temblando abiertas -->
    <path d="M 40 100 Q 10 70 30 130 Z" fill="#232D36"/>
    <path d="M 160 100 Q 190 70 170 130 Z" fill="#232D36"/>
    <!-- pico abriéndose con lamento -->
    <path d="M100 50 L162 60 L100 70 Z" fill="#FF9F43"/>
    <path d="M100 70 L155 80 L100 88 Z" fill="#FF9F43"/>
    <!-- ojos preocupados con lágrimas -->
    <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="85" cy="50" r="5" fill="#232D36"/>
    <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="115" cy="50" r="5" fill="#232D36"/>
    <!-- lágrima -->
    <path d="M 74 62 Q 70 72 74 76 Q 78 72 74 62 Z" fill="#5B7FA6"/>
  </g>

  <!-- Mangos cayendo y rebotando al río -->
  <!-- Mango 1 en el aire cayendo -->
  <g transform="translate(360, 220) rotate(30)">
    <ellipse cx="0" cy="0" rx="16" ry="24" fill="#FF9F43"/>
    <!-- líneas de movimiento -->
    <path d="M -25 -10 Q -35 -5 -40 0" stroke="#FF9F43" stroke-width="3" stroke-dasharray="3 3" fill="none"/>
  </g>
  <!-- Mango 2 cayendo al agua con salpicadura -->
  <g transform="translate(520, 330) rotate(-20)">
    <ellipse cx="0" cy="0" rx="16" ry="24" fill="#FF9F43"/>
    <!-- salpicadura de agua -->
    <path d="M -20 10 Q -30 -10 -15 -5 Q 0 -20 15 -5 Q 30 -10 20 10 Z" fill="#EBF5EE" opacity="0.8"/>
  </g>
</svg>
