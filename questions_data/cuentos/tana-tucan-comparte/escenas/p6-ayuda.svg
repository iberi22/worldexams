<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tito y Lila ayudan a Tana a recuperar los mangos del río">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg6)"/>

  <!-- Río abajo -->
  <path d="M 0 340 Q 200 310 400 350 Q 600 390 800 340 L 800 450 L 0 450 Z" fill="#5B7FA6"/>

  <!-- Orilla y árboles -->
  <path d="M 0 300 Q 200 280 400 320 L 0 350 Z" fill="#4FB6A3"/>

  <!-- Tana sorprendida e ilusionada en la orilla -->
  <g transform="translate(80, 150) scale(0.85)">
    <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
    <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
    <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
    <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
    <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="85" cy="54" r="5" fill="#232D36"/>
    <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="115" cy="54" r="5" fill="#232D36"/>
  </g>

  <!-- Tito el mono con su cola atrapando un mango -->
  <g transform="translate(320, 140) scale(0.8)">
    <ellipse cx="100" cy="130" rx="45" ry="50" fill="#8B5A2B"/>
    <circle cx="100" cy="70" r="42" fill="#8B5A2B"/>
    <ellipse cx="100" cy="76" rx="30" ry="24" fill="#D2B48C"/>
    <!-- cola extendida hasta el agua con un mango -->
    <path d="M 120 140 Q 180 200 220 180" fill="none" stroke="#8B5A2B" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="230" cy="175" rx="14" ry="20" fill="#FF9F43" transform="rotate(20 230 175)"/>
    <!-- ojos decididos -->
    <circle cx="85" cy="58" r="10" fill="#FFFFFF"/>
    <circle cx="86" cy="60" r="5" fill="#232D36"/>
    <circle cx="115" cy="58" r="10" fill="#FFFFFF"/>
    <circle cx="116" cy="60" r="5" fill="#232D36"/>
  </g>

  <!-- Lila la perezosa pescando el otro mango con su brazo largo -->
  <g transform="translate(560, 180) scale(0.8)">
    <ellipse cx="100" cy="125" rx="48" ry="52" fill="#A08C7D"/>
    <circle cx="100" cy="70" r="40" fill="#A08C7D"/>
    <ellipse cx="100" cy="72" rx="32" ry="26" fill="#E6D7C3"/>
    <ellipse cx="82" cy="68" rx="12" ry="10" fill="#6E5A4C"/>
    <ellipse cx="118" cy="68" rx="12" ry="10" fill="#6E5A4C"/>
    <!-- brazo largo hacia el agua -->
    <path d="M 50 110 Q -30 160 0 190" stroke="#8C7767" stroke-width="12" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="200" rx="14" ry="20" fill="#FF9F43" transform="rotate(-15 0 200)"/>
    <circle cx="83" cy="67" r="8" fill="#FFFFFF"/>
    <circle cx="84" cy="68" r="4" fill="#232D36"/>
    <circle cx="117" cy="67" r="8" fill="#FFFFFF"/>
    <circle cx="118" cy="68" r="4" fill="#232D36"/>
  </g>
</svg>
