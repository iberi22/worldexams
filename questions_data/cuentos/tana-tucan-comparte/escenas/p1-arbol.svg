<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tana la tucán ve un árbol lleno de mangos">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cielo y Sol -->
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Sol brillante -->
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="38" fill="#FFE3B3"/>
    <circle cx="0" cy="0" r="28" fill="#FF9F43"/>
  </g>
  <!-- Nubes suaves -->
  <path d="M 100 90 Q 120 70 150 80 Q 180 70 200 90 Q 210 110 190 120 Q 110 125 100 90 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M 450 70 Q 470 50 500 60 Q 530 50 550 70 Q 560 90 540 100 Q 460 105 450 70 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- Plano Medio: Selva y Árbol de Mangos -->
  <!-- Colinas lejanas -->
  <path d="M 0 350 Q 250 280 500 340 Q 650 310 800 350 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>
  <path d="M 0 380 Q 300 320 600 370 Q 700 350 800 380 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Gran árbol de mangos -->
  <rect x="360" y="160" width="80" height="230" rx="10" fill="#8B5A2B"/>
  <circle cx="400" cy="150" r="110" fill="#3D7D52"/>
  <circle cx="340" cy="170" r="80" fill="#2E623E"/>
  <circle cx="460" cy="170" r="80" fill="#2E623E"/>

  <!-- 5 Mangos amarillos/naranjas numerados en rama -->
  <g id="mangos">
    <!-- Mango 1 -->
    <ellipse cx="320" cy="160" rx="14" ry="20" fill="#FF9F43" transform="rotate(-10 320 160)"/>
    <path d="M 320 140 Q 320 135 318 130" stroke="#3D7D52" stroke-width="3" fill="none"/>
    <!-- Mango 2 -->
    <ellipse cx="360" cy="190" rx="14" ry="20" fill="#FF9F43" transform="rotate(15 360 190)"/>
    <path d="M 360 170 Q 360 165 358 160" stroke="#3D7D52" stroke-width="3" fill="none"/>
    <!-- Mango 3 -->
    <ellipse cx="400" cy="150" rx="14" ry="20" fill="#FF9F43" transform="rotate(-5 400 150)"/>
    <path d="M 400 130 Q 400 125 398 120" stroke="#3D7D52" stroke-width="3" fill="none"/>
    <!-- Mango 4 -->
    <ellipse cx="440" cy="185" rx="14" ry="20" fill="#FF9F43" transform="rotate(10 440 185)"/>
    <path d="M 440 165 Q 440 160 438 155" stroke="#3D7D52" stroke-width="3" fill="none"/>
    <!-- Mango 5 -->
    <ellipse cx="480" cy="155" rx="14" ry="20" fill="#FF9F43" transform="rotate(-15 480 155)"/>
    <path d="M 480 135 Q 480 130 478 125" stroke="#3D7D52" stroke-width="3" fill="none"/>
  </g>

  <!-- Plano Frente: Tana en una rama observando sorprendida y alegre -->
  <g transform="translate(140, 210) scale(0.85)">
    <!-- Tana la tucán -->
    <ellipse cx="100" cy="126" rx="52" ry="60" fill="#2F3A45"/>
    <circle cx="100" cy="62" r="40" fill="#2F3A45"/>
    <ellipse cx="100" cy="140" rx="29" ry="35" fill="#FFF6E8"/>
    <!-- pico -->
    <path d="M100 50 L162 71 Q172 74 162 79 L100 92 Z" fill="#FF9F43"/>
    <path d="M100 50 L162 71 Q168 73 162 76 L100 80 Z" fill="#FFB765"/>
    <!-- ojos -->
    <circle cx="84" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="85" cy="54" r="5" fill="#232D36"/>
    <circle cx="87" cy="52" r="2" fill="#FFFFFF"/>
    <circle cx="114" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="115" cy="54" r="5" fill="#232D36"/>
    <circle cx="117" cy="52" r="2" fill="#FFFFFF"/>
  </g>
  <!-- Rama sobre la que se apoya Tana -->
  <path d="M 80 340 Q 200 320 370 340" stroke="#8B5A2B" stroke-width="16" stroke-linecap="round" fill="none"/>
</svg>
