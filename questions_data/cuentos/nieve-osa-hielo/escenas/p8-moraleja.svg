<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nieve y sus amigos patinan felices bajo las luces de la aurora">
  <!-- PLANO 1: FONDO (Noche mágica con aurora de colores) -->
  <rect width="800" height="450" fill="#1A252F"/>
  <path d="M 0 60 Q 200 120 400 40 T 800 80 L 800 220 Q 600 160 400 200 T 0 140 Z" fill="#4FB6A3" opacity="0.5"/>
  <path d="M 0 100 Q 250 30 500 110 T 800 70 L 800 240 Q 550 180 300 220 T 0 180 Z" fill="#FF9F43" opacity="0.35"/>
  <path d="M 50 20 Q 300 80 550 20 T 800 60 L 800 160 Q 500 100 300 140 T 50 80 Z" fill="#5B6FD6" opacity="0.4"/>

  <!-- Estrellas -->
  <circle cx="80" cy="40" r="3" fill="#FFFFFF"/>
  <circle cx="220" cy="80" r="2.5" fill="#FFFFFF"/>
  <circle cx="420" cy="30" r="3" fill="#FFFFFF"/>
  <circle cx="640" cy="60" r="3" fill="#FFFFFF"/>
  <circle cx="720" cy="110" r="2.5" fill="#FFFFFF"/>

  <!-- PLANO 2: MEDIO (Tundra helada iluminada) -->
  <path d="M 0 240 C 250 210 550 270 800 230 L 800 450 L 0 450 Z" fill="#D2E5EE"/>
  <rect y="260" width="800" height="190" fill="#E8F1F5"/>

  <!-- PLANO 3: FRENTE (Nieve, Pipo y Glauco patinando juntos) -->
  <!-- Glauco volando feliz -->
  <g transform="translate(520, 150) scale(0.7)">
    <ellipse cx="60" cy="60" rx="28" ry="32" fill="#607D8B"/>
    <circle cx="60" cy="28" r="22" fill="#607D8B"/>
    <!-- Alas abiertas volando -->
    <ellipse cx="20" cy="60" rx="22" ry="10" fill="#455A64" transform="rotate(-20 20 60)"/>
    <ellipse cx="100" cy="60" rx="22" ry="10" fill="#455A64" transform="rotate(20 100 60)"/>
    <polygon points="60,30 55,38 65,38" fill="#FF9F43"/>
  </g>

  <!-- Pipo deslizándose feliz -->
  <g transform="translate(420, 260) scale(0.85)">
    <ellipse cx="60" cy="60" rx="36" ry="24" fill="#90A4AE"/>
    <circle cx="90" cy="45" r="20" fill="#90A4AE"/>
    <ellipse cx="96" cy="48" rx="8" ry="5" fill="#ECEFF1"/>
    <ellipse cx="96" cy="46" rx="3.5" ry="2" fill="#232D36"/>
  </g>

  <!-- Nieve patinando en el centro con alas/patas abiertas de alegría -->
  <g transform="translate(240, 210)">
    <ellipse cx="60" cy="80" rx="32" ry="36" fill="#F4F8FA"/>
    <circle cx="60" cy="42" r="26" fill="#FFFFFF"/>
    <circle cx="42" cy="26" r="8" fill="#BFD9E8"/>
    <circle cx="78" cy="26" r="8" fill="#BFD9E8"/>
    <path d="M 38 62 Q 60 72 82 62 Q 74 76 60 78 Q 46 76 38 62 Z" fill="#BFD9E8"/>

    <!-- Ojos alegres cerrados en arco -->
    <path d="M 48 40 Q 54 34 60 40" stroke="#232D36" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 60 40 Q 66 34 72 40" stroke="#232D36" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <ellipse cx="60" cy="48" rx="9" ry="6" fill="#E8F1F5"/>
    <ellipse cx="60" cy="45" rx="4" ry="2.5" fill="#232D36"/>

    <!-- Patines -->
    <line x1="36" y1="120" x2="60" y2="120" stroke="#232D36" stroke-width="2.5"/>
    <line x1="60" y1="120" x2="84" y2="120" stroke="#232D36" stroke-width="2.5"/>
  </g>
</svg>
