<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nieve hace la promesa de cuidar la tundra">
  <!-- PLANO 1: FONDO -->
  <rect width="800" height="450" fill="#E2F1F5"/>
  <!-- Destellos de luz tenue -->
  <circle cx="200" cy="120" r="80" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="600" cy="100" r="100" fill="#FFF3D6" opacity="0.3"/>

  <!-- PLANO 2: MEDIO (Horizonte de tundra) -->
  <path d="M 0 250 Q 200 230 400 250 T 800 240 L 800 450 L 0 450 Z" fill="#D2E5EE"/>
  <rect y="270" width="800" height="180" fill="#FFFFFF"/>

  <!-- PLANO 3: FRENTE (Nieve levantando su patita en señal de promesa) -->
  <g transform="translate(320, 180)">
    <!-- Cuerpo -->
    <ellipse cx="80" cy="120" rx="45" ry="52" fill="#F4F8FA"/>
    <!-- Pata izquierda levantada con firmeza -->
    <path d="M 40 100 Q 20 60 30 50 Q 42 45 52 70 Z" fill="#E8F1F5"/>
    <circle cx="32" cy="50" r="8" fill="#BFD9E8"/>

    <!-- Cabeza -->
    <circle cx="80" cy="65" r="38" fill="#FFFFFF"/>
    <!-- Orejas -->
    <circle cx="56" cy="40" r="11" fill="#BFD9E8"/>
    <circle cx="104" cy="40" r="11" fill="#BFD9E8"/>
    <!-- Bufanda firma -->
    <path d="M 48 90 Q 80 104 112 90 Q 100 110 80 112 Q 60 110 48 90 Z" fill="#BFD9E8"/>

    <!-- Ojos brillantes de orgullo -->
    <circle cx="68" cy="60" r="8" fill="#FFFFFF"/>
    <circle cx="69" cy="61" r="4" fill="#232D36"/>
    <circle cx="71" cy="59" r="1.5" fill="#FFFFFF"/>

    <circle cx="92" cy="60" r="8" fill="#FFFFFF"/>
    <circle cx="93" cy="61" r="4" fill="#232D36"/>
    <circle cx="95" cy="59" r="1.5" fill="#FFFFFF"/>

    <!-- Hocico y sonrisa firme -->
    <ellipse cx="80" cy="72" rx="12" ry="8" fill="#E8F1F5"/>
    <ellipse cx="80" cy="68" rx="5" ry="3.5" fill="#232D36"/>
    <path d="M 75 74 Q 80 78 85 74" stroke="#232D36" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Patita derecha en suelo -->
    <rect x="100" y="150" width="18" height="24" rx="9" fill="#E8F1F5"/>
  </g>
</svg>
