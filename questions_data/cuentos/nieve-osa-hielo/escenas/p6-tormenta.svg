<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nieve, Pipo y Glauco se refugian juntos durante la tormenta">
  <!-- PLANO 1: FONDO (Interior cálido de cueva en tormenta) -->
  <rect width="800" height="450" fill="#263238"/>
  <!-- Entrada a la cueva con viento y copos de nieve afueras -->
  <path d="M 500 0 L 800 0 L 800 450 L 550 450 C 500 300 520 150 500 0 Z" fill="#37474F"/>
  <path d="M 540 0 L 800 0 L 800 450 L 590 450 C 550 300 570 150 540 0 Z" fill="#78909C"/>

  <!-- Viento y nieve afuera -->
  <line x1="600" y1="80" x2="780" y2="120" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 15" opacity="0.8"/>
  <line x1="580" y1="180" x2="760" y2="210" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="15 20" opacity="0.8"/>
  <line x1="620" y1="300" x2="790" y2="330" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 12" opacity="0.8"/>
  <circle cx="650" cy="140" r="4" fill="#FFFFFF"/>
  <circle cx="720" cy="240" r="5" fill="#FFFFFF"/>
  <circle cx="680" cy="360" r="4" fill="#FFFFFF"/>

  <!-- PLANO 2: MEDIO (Esquina acolchada de la cueva) -->
  <path d="M 0 180 Q 200 160 450 280 L 450 450 L 0 450 Z" fill="#455A64"/>
  <path d="M 0 260 Q 200 240 450 320 L 450 450 L 0 450 Z" fill="#37474F"/>

  <!-- PLANO 3: FRENTE (Los tres amigos abrazados dando calor) -->
  <g transform="translate(120, 220)">
    <!-- Nieve en el centro -->
    <ellipse cx="100" cy="110" rx="42" ry="48" fill="#F4F8FA"/>
    <circle cx="100" cy="65" r="32" fill="#FFFFFF"/>
    <circle cx="80" cy="45" r="9" fill="#BFD9E8"/>
    <circle cx="120" cy="45" r="9" fill="#BFD9E8"/>
    <path d="M 76 88 Q 100 100 124 88 Q 112 104 100 106 Q 88 104 76 88 Z" fill="#BFD9E8"/>
    <!-- Ojos durmiendo/tranquilos -->
    <path d="M 88 62 Q 94 68 100 62" stroke="#232D36" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 100 62 Q 106 68 112 62" stroke="#232D36" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Pipo acurrucado a la izquierda -->
    <g transform="translate(-10, 40)">
      <ellipse cx="60" cy="70" rx="30" ry="32" fill="#90A4AE"/>
      <circle cx="60" cy="38" r="22" fill="#90A4AE"/>
      <path d="M 52 38 Q 58 44 64 38" stroke="#232D36" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Glauco resguardado a la derecha -->
    <g transform="translate(110, 30)">
      <ellipse cx="40" cy="70" rx="26" ry="30" fill="#607D8B"/>
      <circle cx="40" cy="40" r="20" fill="#607D8B"/>
      <polygon points="40,42 36,48 44,48" fill="#FF9F43"/>
    </g>
  </g>
</svg>
