<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="El búho Glauco le enseña a Nieve sobre la tundra y la energía">
  <!-- PLANO 1: FONDO -->
  <rect width="800" height="450" fill="#EBF4F6"/>
  <circle cx="120" cy="80" r="35" fill="#FFF3D6" opacity="0.8"/>
  <path d="M 500 90 Q 485 90 485 75 Q 485 55 505 55 Q 515 30 545 30 Q 570 20 595 35 Q 620 25 635 45 Q 655 50 655 72 Q 655 90 635 90 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- PLANO 2: MEDIO (Cerros de hielo) -->
  <polygon points="60,280 220,150 380,280" fill="#D2E5EE"/>
  <polygon points="320,280 500,160 680,280" fill="#C5DCE7"/>
  <rect y="260" width="800" height="190" fill="#E8F1F5"/>

  <!-- PLANO 3: FRENTE (Glauco sobre roca y Nieve escuchando) -->
  <!-- Roca helada -->
  <path d="M 480 320 Q 560 210 660 310 L 700 450 L 440 450 Z" fill="#90A4AE"/>
  <path d="M 500 310 Q 560 220 640 300" stroke="#FFFFFF" stroke-width="6" fill="none"/>

  <!-- Glauco en la roca -->
  <g transform="translate(540, 160) scale(0.75)">
    <circle cx="60" cy="40" r="28" fill="#607D8B"/>
    <ellipse cx="60" cy="80" rx="30" ry="36" fill="#607D8B"/>
    <ellipse cx="60" cy="82" rx="18" ry="24" fill="#ECEFF1"/>
    <!-- Ojos de Glauco -->
    <circle cx="48" cy="38" r="8" fill="#FFFFFF"/>
    <circle cx="49" cy="39" r="4" fill="#232D36"/>
    <circle cx="72" cy="38" r="8" fill="#FFFFFF"/>
    <circle cx="73" cy="39" r="4" fill="#232D36"/>
    <polygon points="60,40 55,50 65,50" fill="#FF9F43"/>
  </g>

  <!-- Nieve escuchando con atención -->
  <g transform="translate(180, 240)">
    <ellipse cx="60" cy="80" rx="34" ry="38" fill="#F4F8FA"/>
    <circle cx="60" cy="40" r="28" fill="#FFFFFF"/>
    <circle cx="42" cy="22" r="8" fill="#BFD9E8"/>
    <circle cx="78" cy="22" r="8" fill="#BFD9E8"/>
    <path d="M 38 60 Q 60 70 82 60 Q 74 74 60 76 Q 46 74 38 60 Z" fill="#BFD9E8"/>
    <!-- Ojos mirando hacia Glauco (arriba a la derecha) -->
    <circle cx="50" cy="36" r="6" fill="#FFFFFF"/>
    <circle cx="52" cy="34" r="3" fill="#232D36"/>
    <circle cx="70" cy="36" r="6" fill="#FFFFFF"/>
    <circle cx="72" cy="34" r="3" fill="#232D36"/>
    <ellipse cx="60" cy="46" rx="9" ry="6" fill="#E8F1F5"/>
    <ellipse cx="60" cy="43" rx="4" ry="3" fill="#232D36"/>
  </g>
</svg>
