<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pipo y Mía saltando sobre el puente de troncos">
  <!-- plano-fondo -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="#FDF6EC"/>
    <!-- Montañas al fondo -->
    <path d="M0 320 L150 180 L320 320 Z" fill="#7BAE5A" opacity="0.4"/>
    <path d="M220 320 L420 150 L600 320 Z" fill="#4FB6A3" opacity="0.3"/>
    <path d="M500 320 L680 190 L800 320 Z" fill="#7BAE5A" opacity="0.4"/>
    <!-- Sol brillante -->
    <circle cx="700" cy="90" r="45" fill="#FF9F43" opacity="0.8"/>
    <!-- Nubes -->
    <path d="M100 90 Q120 70 150 80 Q180 70 200 90 Q210 110 180 120 L120 120 Q90 110 100 90 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M400 70 Q415 55 440 65 Q465 55 480 70 Q490 85 465 95 L415 95 Q395 85 400 70 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- plano-medio -->
  <g id="plano-medio">
    <!-- Pasto y orillas -->
    <path d="M0 300 Q200 280 350 310 L350 450 L0 450 Z" fill="#7BAE5A"/>
    <path d="M450 310 Q600 280 800 300 L800 450 L450 450 Z" fill="#7BAE5A"/>
    <!-- Arroyo -->
    <path d="M320 300 C340 350 330 400 350 450 L480 450 C460 400 470 350 450 300 Z" fill="#4FB6A3"/>
    <!-- Troncos de soporte del puente -->
    <rect x="330" y="320" width="20" height="100" fill="#3A2E2A" rx="5"/>
    <rect x="450" y="320" width="20" height="100" fill="#3A2E2A" rx="5"/>
    <!-- Tablas del puente -->
    <rect x="300" y="330" width="200" height="16" fill="#C97B3D" rx="4"/>
    <rect x="300" y="352" width="200" height="16" fill="#C97B3D" rx="4"/>
    <!-- Tabla rota -->
    <path d="M300 374 L385 374 L375 390 L300 390 Z" fill="#C97B3D"/>
    <path d="M415 374 L500 374 L500 390 L425 390 Z" fill="#C97B3D"/>
    <rect x="300" y="396" width="200" height="16" fill="#C97B3D" rx="4"/>
  </g>

  <!-- plano-frente -->
  <g id="plano-frente">
    <!-- Pipo saltando (izq) -->
    <g transform="translate(320, 240) scale(0.45)">
      <ellipse cx="100" cy="130" rx="46" ry="52" fill="#6C7A89"/>
      <circle cx="100" cy="74" r="38" fill="#6C7A89"/>
      <path d="M78 102 L100 122 L122 102 Z" fill="#9B7EDE"/>
      <ellipse cx="80" cy="72" rx="16" ry="12" fill="#3A2E2A"/>
      <ellipse cx="120" cy="72" rx="16" ry="12" fill="#3A2E2A"/>
      <circle cx="81" cy="71" r="5" fill="#FFFFFF"/>
      <circle cx="119" cy="71" r="5" fill="#FFFFFF"/>
    </g>
    <!-- Mía saltando (der) -->
    <g transform="translate(410, 230) scale(0.45)">
      <ellipse cx="100" cy="130" rx="44" ry="50" fill="#7E8C9B"/>
      <circle cx="100" cy="74" r="37" fill="#7E8C9B"/>
      <circle cx="132" cy="40" r="7" fill="#9B7EDE"/>
      <ellipse cx="80" cy="72" rx="15" ry="11" fill="#3A2E2A"/>
      <ellipse cx="120" cy="72" rx="15" ry="11" fill="#3A2E2A"/>
      <circle cx="81" cy="71" r="5" fill="#FFFFFF"/>
      <circle cx="119" cy="71" r="5" fill="#FFFFFF"/>
    </g>
    <!-- Árbol en frente -->
    <path d="M40 220 Q70 140 100 220" fill="none" stroke="#3A2E2A" stroke-width="16"/>
    <circle cx="70" cy="140" r="50" fill="#7BAE5A"/>
  </g>
</svg>
