<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Mía convence a Pipo de que deben avisar para evitar que alguien se caiga">
  <!-- plano-fondo -->
  <g id="plano-fondo">
    <rect width="800" height="450" fill="#FDF6EC"/>
    <circle cx="200" cy="100" r="40" fill="#FF9F43" opacity="0.3"/>
    <path d="M400 300 L500 160 L600 300 Z" fill="#7BAE5A" opacity="0.4"/>
  </g>

  <!-- plano-medio -->
  <g id="plano-medio">
    <path d="M0 310 Q400 280 800 310 L800 450 L0 450 Z" fill="#7BAE5A"/>
    <!-- Ilustración mental sutil de peligro evitables: puente con aviso -->
    <g opacity="0.85" transform="translate(340, 100) scale(0.6)">
      <rect x="0" y="0" width="200" height="120" rx="15" fill="#FFFFFF" stroke="#4FB6A3" stroke-width="4"/>
      <path d="M30 80 L170 80" stroke="#C97B3D" stroke-width="12" stroke-linecap="round"/>
      <circle cx="100" cy="50" r="16" fill="#E26D5A"/>
      <text x="100" y="56" font-family="sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF" text-anchor="middle">!</text>
    </g>
  </g>

  <!-- plano-frente -->
  <g id="plano-frente">
    <!-- Mía decidida (izq) -->
    <g transform="translate(200, 210) scale(0.65)">
      <ellipse cx="100" cy="130" rx="44" ry="50" fill="#7E8C9B"/>
      <circle cx="100" cy="74" r="37" fill="#7E8C9B"/>
      <circle cx="132" cy="40" r="7" fill="#9B7EDE"/>
      <ellipse cx="80" cy="72" rx="15" ry="11" fill="#3A2E2A"/>
      <ellipse cx="120" cy="72" rx="15" ry="11" fill="#3A2E2A"/>
      <circle cx="81" cy="71" r="7" fill="#FFFFFF"/>
      <circle cx="119" cy="71" r="7" fill="#FFFFFF"/>
      <circle cx="81" cy="71" r="3" fill="#232D36"/>
      <circle cx="119" cy="71" r="3" fill="#232D36"/>
    </g>
    <!-- Pipo comprendiendo (der) -->
    <g transform="translate(500, 220) scale(0.6)">
      <ellipse cx="100" cy="130" rx="46" ry="52" fill="#6C7A89"/>
      <circle cx="100" cy="74" r="38" fill="#6C7A89"/>
      <path d="M78 102 L100 122 L122 102 Z" fill="#9B7EDE"/>
      <ellipse cx="80" cy="72" rx="16" ry="12" fill="#3A2E2A"/>
      <ellipse cx="120" cy="72" rx="16" ry="12" fill="#3A2E2A"/>
      <circle cx="81" cy="71" r="6" fill="#FFFFFF"/>
      <circle cx="119" cy="71" r="6" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
