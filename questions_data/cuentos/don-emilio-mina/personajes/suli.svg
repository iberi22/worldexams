<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ingeniera Suli">
  <!-- Cuerpo / Chaleco de Seguridad -->
  <rect x="65" y="115" width="70" height="70" rx="15" fill="#4FB6A3"/>
  <!-- Chaleco con cintas reflectivas -->
  <rect x="70" y="115" width="60" height="65" rx="10" fill="#FF9F43"/>
  <rect x="70" y="132" width="60" height="8" fill="#E0FBFC"/>
  <rect x="70" y="152" width="60" height="8" fill="#E0FBFC"/>
  <rect x="94" y="115" width="12" height="65" fill="#4FB6A3"/>

  <!-- Brazos y Manos (sosteniendo tabla digital) -->
  <rect x="42" y="125" width="26" height="13" rx="6" fill="#4FB6A3" transform="rotate(15 42 125)"/>
  <rect x="132" y="125" width="26" height="13" rx="6" fill="#4FB6A3" transform="rotate(-15 132 125)"/>
  <circle cx="42" cy="136" r="7" fill="#E7C169"/>
  <circle cx="158" cy="136" r="7" fill="#E7C169"/>

  <!-- Tabla digital de inspección -->
  <rect x="136" y="130" width="26" height="34" rx="4" fill="#293241"/>
  <rect x="139" y="133" width="20" height="26" rx="2" fill="#E0FBFC"/>
  <line x1="142" y1="138" x2="154" y2="138" stroke="#4FB6A3" stroke-width="2" stroke-linecap="round"/>
  <line x1="142" y1="144" x2="152" y2="144" stroke="#4FB6A3" stroke-width="2" stroke-linecap="round"/>
  <line x1="142" y1="150" x2="149" y2="150" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>

  <!-- Botas -->
  <rect x="70" y="178" width="25" height="16" rx="6" fill="#293241"/>
  <rect x="105" y="178" width="25" height="16" rx="6" fill="#293241"/>

  <!-- Cabeza -->
  <circle cx="100" cy="78" r="33" fill="#E7C169"/>
  <!-- Orejas -->
  <circle cx="65" cy="78" r="6" fill="#E7C169"/>
  <circle cx="135" cy="78" r="6" fill="#E7C169"/>

  <!-- Cabello castaño recogido -->
  <path d="M 64 78 Q 62 48 100 48 Q 138 48 136 78 Q 128 50 100 52 Q 72 50 64 78 Z" fill="#4A2810"/>
  <circle cx="100" cy="38" r="12" fill="#4A2810"/>

  <!-- Lentes de seguridad amables -->
  <rect x="72" y="66" width="24" height="16" rx="5" fill="none" stroke="#293241" stroke-width="2.5"/>
  <rect x="104" y="66" width="24" height="16" rx="5" fill="none" stroke="#293241" stroke-width="2.5"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#293241" stroke-width="2.5"/>

  <!-- Ojos detrás de lentes -->
  <circle cx="84" cy="74" r="5" fill="#FFFFFF"/>
  <circle cx="85" cy="75" r="2.5" fill="#232D36"/>
  <circle cx="116" cy="74" r="5" fill="#FFFFFF"/>
  <circle cx="117" cy="75" r="2.5" fill="#232D36"/>

  <!-- Mejillas y Sonrisa -->
  <circle cx="74" cy="85" r="5" fill="#E26D5A" opacity="0.45"/>
  <circle cx="126" cy="85" r="5" fill="#E26D5A" opacity="0.45"/>
  <path d="M 88 88 Q 100 97 112 88" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Casco blanco de ingeniera -->
  <path d="M 62 58 Q 100 24 138 58 Z" fill="#FFFFFF"/>
  <rect x="56" y="55" width="88" height="7" rx="3.5" fill="#E0E0E0"/>
  <rect x="94" y="32" width="12" height="14" rx="2" fill="#4FB6A3"/>
</svg>