<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Perrita Carbonilla">
  <!-- Cola alegre -->
  <path d="M 140 140 Q 175 120 168 95 Q 158 90 148 115 Z" fill="#3A2E2A"/>

  <!-- Cuerpo de la perrita -->
  <ellipse cx="100" cy="138" rx="46" ry="38" fill="#3A2E2A"/>

  <!-- Chaleco de rescate / seguridad -->
  <path d="M 68 120 Q 100 110 132 120 L 132 152 Q 100 162 68 152 Z" fill="#FF9F43"/>
  <line x1="72" y1="136" x2="128" y2="136" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Cruz/placa verde de auxilio en chaleco -->
  <circle cx="100" cy="136" r="8" fill="#4FB6A3"/>
  <rect x="98" y="131" width="4" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="95" y="134" width="10" height="4" rx="1" fill="#FFFFFF"/>

  <!-- Patas simétricas -->
  <rect x="68" y="165" width="14" height="22" rx="7" fill="#3A2E2A"/>
  <rect x="86" y="165" width="14" height="22" rx="7" fill="#3A2E2A"/>
  <rect x="100" y="165" width="14" height="22" rx="7" fill="#3A2E2A"/>
  <rect x="118" y="165" width="14" height="22" rx="7" fill="#3A2E2A"/>
  <!-- Huellitas claras -->
  <ellipse cx="75" cy="184" rx="5" ry="3" fill="#C97B3D"/>
  <ellipse cx="93" cy="184" rx="5" ry="3" fill="#C97B3D"/>
  <ellipse cx="107" cy="184" rx="5" ry="3" fill="#C97B3D"/>
  <ellipse cx="125" cy="184" rx="5" ry="3" fill="#C97B3D"/>

  <!-- Cabeza de la perrita -->
  <circle cx="100" cy="78" r="34" fill="#3A2E2A"/>

  <!-- Orejas caídas y suaves -->
  <path d="M 68 62 Q 45 75 52 102 Q 68 100 75 75 Z" fill="#29201C"/>
  <path d="M 132 62 Q 155 75 148 102 Q 132 100 125 75 Z" fill="#29201C"/>

  <!-- Hocico beige suave -->
  <ellipse cx="100" cy="88" rx="18" ry="14" fill="#F4A261"/>
  <!-- Nariz de perro -->
  <ellipse cx="100" cy="81" rx="7" ry="5" fill="#111111"/>
  <circle cx="98.5" cy="80" r="1.5" fill="#FFFFFF"/>

  <!-- Sonrisa canina / lengua feliz -->
  <path d="M 92 88 Q 100 95 108 88" stroke="#3A2E2A" stroke-width="2.5" fill="none"/>
  <path d="M 97 92 Q 100 102 103 92 Z" fill="#E26D5A"/>

  <!-- Ojos brillantes -->
  <circle cx="83" cy="70" r="7" fill="#FFFFFF"/>
  <circle cx="84" cy="71" r="3.5" fill="#232D36"/>
  <circle cx="85.5" cy="69.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="117" cy="70" r="7" fill="#FFFFFF"/>
  <circle cx="118" cy="71" r="3.5" fill="#232D36"/>
  <circle cx="119.5" cy="69.5" r="1.5" fill="#FFFFFF"/>

  <!-- Mejillas de alegría -->
  <circle cx="72" cy="80" r="5" fill="#E26D5A" opacity="0.4"/>
  <circle cx="128" cy="80" r="5" fill="#E26D5A" opacity="0.4"/>
</svg>