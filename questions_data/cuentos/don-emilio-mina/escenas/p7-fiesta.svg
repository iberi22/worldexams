<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Fiesta de la siembra del árbol número mil en la colina">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E8"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cielo de fiesta y sol brillante -->
  <rect width="800" height="450" fill="url(#sky7)"/>
  <circle cx="400" cy="70" r="40" fill="#FF9F43"/>

  <!-- Banderines de colores en hilo -->
  <path d="M 50 60 Q 400 120 750 60" stroke="#3A2E2A" stroke-width="2" fill="none"/>
  <polygon points="100,66 120,68 110,95" fill="#E26D5A"/>
  <polygon points="200,80 220,83 210,110" fill="#F2C14E"/>
  <polygon points="300,89 320,91 310,118" fill="#4FB6A3"/>
  <polygon points="480,91 500,89 490,118" fill="#5B6FD6"/>
  <polygon points="580,83 600,80 590,110" fill="#FF9F43"/>
  <polygon points="680,68 700,66 690,95" fill="#E26D5A"/>

  <!-- Globos de colores volando -->
  <circle cx="150" cy="140" r="14" fill="#E26D5A"/>
  <line x1="150" y1="154" x2="150" y2="180" stroke="#3A2E2A" stroke-width="1.5"/>
  <circle cx="650" cy="130" r="14" fill="#5B6FD6"/>
  <line x1="650" y1="144" x2="650" y2="170" stroke="#3A2E2A" stroke-width="1.5"/>

  <!-- Plano Medio: Cerro verde con el Gran Árbol Número Mil -->
  <path d="M 0 300 Q 400 230 800 290 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Árbol número 1000 robusto y florido -->
  <g transform="translate(350, 150)">
    <rect x="35" y="100" width="30" height="110" rx="8" fill="#8B5A2B"/>
    <circle cx="50" cy="70" r="65" fill="#3D7D52"/>
    <circle cx="15" cy="85" r="45" fill="#7BAE5A"/>
    <circle cx="85" cy="85" r="45" fill="#7BAE5A"/>
    <!-- Flores amarillas de celebración en el árbol -->
    <circle cx="20" cy="60" r="6" fill="#F2C14E"/>
    <circle cx="70" cy="50" r="6" fill="#F2C14E"/>
    <circle cx="50" cy="90" r="6" fill="#F2C14E"/>
  </g>

  <!-- Cartel decorativo del árbol mil -->
  <rect x="320" y="320" width="160" height="40" rx="8" fill="#FFE3B3" stroke="#8B5A2B" stroke-width="3"/>
  <!-- Emblema de 1000 (estrella/hoja) -->
  <polygon points="400,330 405,340 415,340 407,346 410,356 400,350 390,356 393,346 385,340 395,340" fill="#FF9F43"/>

  <!-- Plano Frente: Don Emilio, Suli y Carbonilla festejando felices -->
  <g transform="translate(160, 240) scale(0.8)">
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#3D5A80"/>
    <circle cx="100" cy="78" r="34" fill="#F4A261"/>
    <circle cx="84" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="3.5" fill="#232D36"/>
    <circle cx="114" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="3.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 100 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 60 58 Q 100 24 140 58 Z" fill="#F2C14E"/>
  </g>

  <g transform="translate(520, 240) scale(0.8)">
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#4FB6A3"/>
    <rect x="70" y="115" width="60" height="65" rx="10" fill="#FF9F43"/>
    <circle cx="100" cy="78" r="33" fill="#E7C169"/>
    <circle cx="84" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="2.5" fill="#232D36"/>
    <circle cx="116" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="117" cy="75" r="2.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 97 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 62 58 Q 100 24 138 58 Z" fill="#FFFFFF"/>
  </g>
</svg>