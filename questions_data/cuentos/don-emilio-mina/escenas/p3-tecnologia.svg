<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Mina moderna 2026 con casco con luz, drones y sensores">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cerro verde y entrada limpia a la mina -->
  <rect width="800" height="450" fill="url(#sky3)"/>
  <path d="M 0 300 Q 300 150 800 240 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Entrada limpia de arco de piedra a la mina -->
  <path d="M 220 450 L 220 280 Q 350 210 480 280 L 480 450 Z" fill="#293241"/>
  <path d="M 200 450 L 200 270 Q 350 190 500 270 L 500 450 Z" stroke="#8B5A2B" stroke-width="16" fill="none"/>
  <!-- Luces y sensores LED verdes de seguridad en el arco -->
  <circle cx="230" cy="270" r="8" fill="#4FB6A3"/>
  <circle cx="230" cy="270" r="4" fill="#FFFFFF"/>
  <circle cx="470" cy="270" r="8" fill="#4FB6A3"/>
  <circle cx="470" cy="270" r="4" fill="#FFFFFF"/>

  <!-- Dron volante inspeccionando el túnel -->
  <g transform="translate(340, 140)">
    <!-- Cuerpo del dron -->
    <ellipse cx="40" cy="20" rx="22" ry="12" fill="#3D5A80"/>
    <circle cx="40" cy="20" r="6" fill="#E0FBFC"/>
    <!-- Hélices -->
    <line x1="10" y1="10" x2="25" y2="15" stroke="#293241" stroke-width="3"/>
    <line x1="55" y1="15" x2="70" y2="10" stroke="#293241" stroke-width="3"/>
    <ellipse cx="10" cy="10" rx="12" ry="3" fill="#FFE3B3" opacity="0.7"/>
    <ellipse cx="70" cy="10" rx="12" ry="3" fill="#FFE3B3" opacity="0.7"/>
    <!-- Haz de sensor azul claro del dron -->
    <path d="M 40 26 L 15 90 L 65 90 Z" fill="#E0FBFC" opacity="0.35"/>
  </g>

  <!-- Plano Medio / Frente: Don Emilio y Suli trabajando juntos -->
  <!-- Don Emilio con casco y lámpara -->
  <g transform="translate(100, 220) scale(0.9)">
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#3D5A80"/>
    <circle cx="100" cy="78" r="34" fill="#F4A261"/>
    <circle cx="84" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="3.5" fill="#232D36"/>
    <circle cx="114" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="3.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 98 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 60 58 Q 100 24 140 58 Z" fill="#F2C14E"/>
    <rect x="92" y="32" width="16" height="14" rx="3" fill="#293241"/>
    <circle cx="100" cy="39" r="6" fill="#FFFFFF"/>
    <path d="M 100 39 L 140 10 L 220 20 Z" fill="#FFE3B3" opacity="0.3"/>
  </g>

  <!-- Ingeniera Suli con tablet -->
  <g transform="translate(560, 220) scale(0.9)">
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#4FB6A3"/>
    <rect x="70" y="115" width="60" height="65" rx="10" fill="#FF9F43"/>
    <circle cx="100" cy="78" r="33" fill="#E7C169"/>
    <circle cx="84" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="2.5" fill="#232D36"/>
    <circle cx="116" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="117" cy="75" r="2.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 97 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 62 58 Q 100 24 138 58 Z" fill="#FFFFFF"/>
    <!-- Tablet en mano -->
    <rect x="20" y="120" width="30" height="40" rx="4" fill="#293241"/>
    <rect x="23" y="123" width="24" height="34" rx="2" fill="#E0FBFC"/>
  </g>
</svg>