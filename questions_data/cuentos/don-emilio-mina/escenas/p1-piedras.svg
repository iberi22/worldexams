<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Emilio de niño junta piedras brillantes en el cerro">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cielo, Sol y Montañas lejanas -->
  <rect width="800" height="450" fill="url(#sky1)"/>
  <circle cx="700" cy="80" r="35" fill="#FF9F43"/>
  <circle cx="700" cy="80" r="45" fill="#FFE3B3" opacity="0.4"/>
  <path d="M 0 280 Q 200 210 400 250 Q 600 200 800 270 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>

  <!-- Plano Medio: Cerro verde con rocas y flora -->
  <path d="M 0 320 Q 250 260 550 310 Q 700 290 800 330 L 800 450 L 0 450 Z" fill="#4FB6A3"/>
  <circle cx="620" cy="280" r="50" fill="#3D7D52"/>
  <rect x="612" y="320" width="16" height="40" fill="#8B5A2B"/>

  <!-- Piedras brillantes esparcidas en la colina -->
  <polygon points="320,350 332,340 344,352 330,362" fill="#E0FBFC" stroke="#C97B3D" stroke-width="2"/>
  <polygon points="360,370 375,358 388,372 370,382" fill="#FFE3B3" stroke="#C97B3D" stroke-width="2"/>
  <polygon points="280,380 292,370 305,382 290,392" fill="#BFD9E8" stroke="#C97B3D" stroke-width="2"/>
  <!-- Destellos de luz -->
  <path d="M 332 332 L 332 324 M 332 332 L 340 332 M 332 332 L 324 332" stroke="#FF9F43" stroke-width="2"/>
  <path d="M 375 350 L 375 342 M 375 350 L 383 350" stroke="#FF9F43" stroke-width="2"/>

  <!-- Plano Frente: Emilio de niño con su lupa y bolsa -->
  <g transform="translate(180, 230) scale(0.85)">
    <!-- Cuerpo niño -->
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#3D5A80"/>
    <rect x="75" y="110" width="50" height="25" fill="#C97B3D"/>
    <!-- Cabeza niño sin casco -->
    <circle cx="100" cy="78" r="34" fill="#F4A261"/>
    <!-- Cabello castaño despeinado -->
    <path d="M 64 78 Q 62 42 100 40 Q 138 42 136 78 Z" fill="#3A2E2A"/>
    <!-- Ojos curiosos grandes -->
    <circle cx="84" cy="74" r="8" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="4" fill="#232D36"/>
    <circle cx="114" cy="74" r="8" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="4" fill="#232D36"/>
    <!-- Sonrisa maravillada -->
    <path d="M 88 88 Q 100 100 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <!-- Lupa en la mano -->
    <circle cx="145" cy="120" r="14" fill="#E0FBFC" opacity="0.7" stroke="#293241" stroke-width="3"/>
    <line x1="135" y1="130" x2="120" y2="145" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>