<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Regla de oro: por cada hueco, un árbol nuevo">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cielo despejado y colina -->
  <rect width="800" height="450" fill="url(#sky4)"/>
  <circle cx="120" cy="80" r="35" fill="#FF9F43"/>
  <path d="M 0 280 Q 300 200 800 260 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>

  <!-- Plano Medio: Prado verde con hileras de arbolitos jóvenes sembrados -->
  <path d="M 0 320 Q 350 250 800 300 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Arbolitos ya sembrados con tutores -->
  <!-- Arbolito 1 -->
  <g transform="translate(150, 260)">
    <line x1="20" y1="40" x2="20" y2="70" stroke="#8B5A2B" stroke-width="4"/>
    <circle cx="20" cy="30" r="18" fill="#3D7D52"/>
    <ellipse cx="20" cy="70" rx="15" ry="5" fill="#8B5A2B"/>
  </g>
  <!-- Arbolito 2 -->
  <g transform="translate(260, 240)">
    <line x1="20" y1="40" x2="20" y2="70" stroke="#8B5A2B" stroke-width="4"/>
    <circle cx="20" cy="30" r="20" fill="#3D7D52"/>
    <ellipse cx="20" cy="70" rx="15" ry="5" fill="#8B5A2B"/>
  </g>
  <!-- Arbolito 3 -->
  <g transform="translate(370, 250)">
    <line x1="20" y1="40" x2="20" y2="70" stroke="#8B5A2B" stroke-width="4"/>
    <circle cx="20" cy="30" r="18" fill="#3D7D52"/>
    <ellipse cx="20" cy="70" rx="15" ry="5" fill="#8B5A2B"/>
  </g>

  <!-- Arbolito nuevo que están sembrando ahora -->
  <g transform="translate(520, 270)">
    <line x1="25" y1="35" x2="25" y2="75" stroke="#8B5A2B" stroke-width="5"/>
    <circle cx="25" cy="22" r="24" fill="#7BAE5A"/>
    <circle cx="15" cy="28" r="16" fill="#3D7D52"/>
    <circle cx="35" cy="28" r="16" fill="#3D7D52"/>
    <!-- Hueco fresco en la tierra -->
    <ellipse cx="25" cy="75" rx="22" ry="7" fill="#5C3A21"/>
    <!-- Regadera con gotas -->
    <path d="M -20 40 L -5 40 L 0 55 L -25 55 Z" fill="#3D5A80"/>
    <circle cx="-10" cy="58" r="2" fill="#E0FBFC"/>
    <circle cx="-5" cy="63" r="2" fill="#E0FBFC"/>
    <circle cx="0" cy="68" r="2" fill="#E0FBFC"/>
  </g>

  <!-- Plano Frente: Don Emilio agachado sembrando y Carbonilla observando -->
  <g transform="translate(590, 240) scale(0.85)">
    <!-- Emilio agachado sembrando -->
    <rect x="65" y="115" width="70" height="60" rx="15" fill="#3D5A80"/>
    <circle cx="100" cy="78" r="34" fill="#F4A261"/>
    <circle cx="84" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="3.5" fill="#232D36"/>
    <circle cx="114" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="3.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 98 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 60 58 Q 100 24 140 58 Z" fill="#F2C14E"/>
  </g>
</svg>