<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="El trabajo bueno cuida a la gente y a la tierra">
  <defs>
    <linearGradient id="sunset8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="60%" stop-color="#FFE3B3"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Atardecer dorado y sereno -->
  <rect width="800" height="450" fill="url(#sunset8)"/>
  <circle cx="400" cy="180" r="50" fill="#FFE3B3" opacity="0.9"/>
  <circle cx="400" cy="180" r="38" fill="#FFFFFF"/>

  <!-- Siluetas suaves de colinas en segundo plano -->
  <path d="M 0 280 Q 250 200 500 240 Q 650 210 800 270 L 800 450 L 0 450 Z" fill="#B2D8C3" opacity="0.6"/>

  <!-- Plano Medio: Cerro verde lleno de árboles y la entrada limpia a la mina -->
  <path d="M 0 310 Q 350 250 800 290 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Bosque próspero en el cerro -->
  <circle cx="120" cy="270" r="35" fill="#3D7D52"/>
  <circle cx="200" cy="260" r="40" fill="#3D7D52"/>
  <circle cx="600" cy="265" r="38" fill="#3D7D52"/>
  <circle cx="680" cy="275" r="32" fill="#3D7D52"/>

  <!-- Arco de la mina sereno al fondo -->
  <path d="M 350 350 L 350 270 Q 400 230 450 270 L 450 350 Z" fill="#293241"/>
  <path d="M 340 350 L 340 265 Q 400 220 460 265 L 460 350 Z" stroke="#8B5A2B" stroke-width="8" fill="none"/>

  <!-- Plano Frente: Emilio, Suli y Carbonilla contemplando el paisaje con orgullo -->
  <g transform="translate(260, 240) scale(0.85)">
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#3D5A80"/>
    <circle cx="100" cy="78" r="34" fill="#F4A261"/>
    <circle cx="84" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="3.5" fill="#232D36"/>
    <circle cx="114" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="3.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 98 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 60 58 Q 100 24 140 58 Z" fill="#F2C14E"/>
  </g>

  <g transform="translate(360, 250) scale(0.8)">
    <!-- Carbonilla -->
    <ellipse cx="100" cy="138" rx="46" ry="38" fill="#3A2E2A"/>
    <path d="M 68 120 Q 100 110 132 120 L 132 152 Q 100 162 68 152 Z" fill="#FF9F43"/>
    <circle cx="100" cy="78" r="34" fill="#3A2E2A"/>
    <path d="M 68 62 Q 45 75 52 102 Q 68 100 75 75 Z" fill="#29201C"/>
    <path d="M 132 62 Q 155 75 148 102 Q 132 100 125 75 Z" fill="#29201C"/>
    <ellipse cx="100" cy="88" rx="18" ry="14" fill="#F4A261"/>
    <ellipse cx="100" cy="81" rx="7" ry="5" fill="#111111"/>
    <circle cx="83" cy="70" r="7" fill="#FFFFFF"/>
    <circle cx="84" cy="71" r="3.5" fill="#232D36"/>
    <circle cx="117" cy="70" r="7" fill="#FFFFFF"/>
    <circle cx="118" cy="71" r="3.5" fill="#232D36"/>
  </g>

  <g transform="translate(460, 240) scale(0.85)">
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#4FB6A3"/>
    <rect x="70" y="115" width="60" height="65" rx="10" fill="#FF9F43"/>
    <circle cx="100" cy="78" r="33" fill="#E7C169"/>
    <circle cx="84" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="2.5" fill="#232D36"/>
    <circle cx="116" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="117" cy="75" r="2.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 97 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 62 58 Q 100 24 138 58 Z" fill="#FFFFFF"/>
  </g>
</svg>