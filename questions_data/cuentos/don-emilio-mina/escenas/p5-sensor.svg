<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="El sensor avisa y todos salen de manera ordenada">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF5EE"/>
      <stop offset="100%" stop-color="#FDF6EC"/>
    </linearGradient>
  </defs>
  <!-- Plano Fondo: Cielo y entrada del túnel con el sensor avisador -->
  <rect width="800" height="450" fill="url(#sky5)"/>
  <path d="M 0 300 Q 300 200 800 260 L 800 450 L 0 450 Z" fill="#4FB6A3"/>

  <!-- Túnel seguro -->
  <path d="M 120 450 L 120 280 Q 250 210 380 280 L 380 450 Z" fill="#293241"/>
  <path d="M 100 450 L 100 270 Q 250 190 400 270 L 400 450 Z" stroke="#8B5A2B" stroke-width="16" fill="none"/>

  <!-- Sensor en el arco del túnel emitiendo bip suave (ondas amarillas) -->
  <g transform="translate(250, 210)">
    <rect x="-15" y="-15" width="30" height="30" rx="6" fill="#293241" stroke="#F2C14E" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#F2C14E"/>
    <!-- Ondas de sonido amables del simulacro/aviso -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#F2C14E" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#F2C14E" stroke-width="2" opacity="0.5"/>
    <!-- Nota musical / icono de aviso -->
    <path d="M -3 -4 L 5 -8 L 5 4" stroke="#293241" stroke-width="2" fill="none"/>
  </g>

  <!-- Plano Medio / Frente: Emilio y Suli caminando tranquilos hacia afuera en fila ordenada -->
  <g transform="translate(420, 240) scale(0.85)">
    <!-- Emilio caminando tranquilo -->
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#3D5A80"/>
    <circle cx="100" cy="78" r="34" fill="#F4A261"/>
    <circle cx="84" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="3.5" fill="#232D36"/>
    <circle cx="114" cy="74" r="7" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="3.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 95 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 60 58 Q 100 24 140 58 Z" fill="#F2C14E"/>
  </g>

  <g transform="translate(560, 240) scale(0.85)">
    <!-- Suli caminando serena y ordenada -->
    <rect x="65" y="115" width="70" height="70" rx="15" fill="#4FB6A3"/>
    <rect x="70" y="115" width="60" height="65" rx="10" fill="#FF9F43"/>
    <circle cx="100" cy="78" r="33" fill="#E7C169"/>
    <circle cx="84" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="2.5" fill="#232D36"/>
    <circle cx="116" cy="74" r="5" fill="#FFFFFF"/>
    <circle cx="117" cy="75" r="2.5" fill="#232D36"/>
    <path d="M 88 88 Q 100 95 112 88" stroke="#3A2E2A" stroke-width="3" fill="none"/>
    <path d="M 62 58 Q 100 24 138 58 Z" fill="#FFFFFF"/>
  </g>
</svg>