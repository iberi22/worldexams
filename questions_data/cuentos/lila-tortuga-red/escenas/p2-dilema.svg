<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lila piensa con duda sobre entrar a ayudar o alejarse">
  <!-- Plano 1: Fondo azul marino -->
  <rect width="800" height="450" fill="#0077B6"/>
  <rect y="260" width="800" height="190" fill="#023E8A" opacity="0.6"/>

  <!-- Plano 2: Arrecife inferior y burbujas de pensamiento -->
  <path d="M0 450 Q200 390 400 450 Q600 380 800 450 Z" fill="#E9C46A"/>
  <!-- Nube / Signos de pensamiento en el centro arriba -->
  <ellipse cx="400" cy="110" rx="90" ry="45" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="340" cy="160" r="14" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="310" cy="190" r="8" fill="#FFFFFF" opacity="0.85"/>
  <!-- Símbolos dentro del pensamiento (peligro vs escape) -->
  <path d="M 360 110 L 390 110 M 375 95 L 375 125" stroke="#E26D5A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 410 110 Q 430 95 440 110 T 450 120" stroke="#4FB6A3" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Plano 3: Lila mirando la red dudosa -->
  <g transform="translate(200, 210) scale(0.9)">
    <ellipse cx="100" cy="116" rx="54" ry="44" fill="#4FB6A3"/>
    <circle cx="100" cy="58" r="34" fill="#4FB6A3"/>
    <path d="M50 110 Q10 100 20 135 Q35 150 55 125 Z" fill="#4FB6A3"/>
    <path d="M150 110 Q190 100 180 135 Q165 150 145 125 Z" fill="#4FB6A3"/>
    <circle cx="85" cy="52" r="8" fill="#FFFFFF"/>
    <circle cx="86" cy="55" r="4" fill="#232D36"/>
    <circle cx="115" cy="52" r="8" fill="#FFFFFF"/>
    <circle cx="114" cy="55" r="4" fill="#232D36"/>
  </g>

  <!-- Red a la derecha en la sombra -->
  <g transform="translate(560, 200) scale(0.8)" opacity="0.8">
    <rect x="0" y="0" width="130" height="110" fill="#48CAE4" opacity="0.2" rx="12"/>
    <path d="M 0 35 L 130 35 M 0 70 L 130 70 M 35 0 L 35 110 M 70 0 L 70 110" stroke="#D8F3DC" stroke-width="3" stroke-dasharray="5,4"/>
    <ellipse cx="65" cy="55" rx="18" ry="12" fill="#FF9F43"/>
  </g>
</svg>
