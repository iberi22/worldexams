<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Vela prepara tres vasos transparentes con tierra y semillas">
  <!-- Plano Fondo: Cocina luminosa -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <!-- Ventana soleada -->
  <rect x="520" y="50" width="220" height="180" rx="10" fill="#EBF5EE" stroke="#4FB6A3" stroke-width="8"/>
  <circle cx="680" cy="90" r="30" fill="#FF9F43"/>

  <!-- Plano Medio: Mesón de la cocina -->
  <rect x="0" y="250" width="800" height="200" fill="#E2C7A7"/>
  <rect x="0" y="235" width="800" height="15" fill="#C8AC8B"/>

  <!-- Tres vasos de experimento alineados -->
  <!-- Vaso 1: Agua + Sol (con brote pequeño) -->
  <g transform="translate(240, 210)">
    <rect x="0" y="0" width="60" height="90" rx="8" fill="none" stroke="#5B6FD6" stroke-width="3"/>
    <rect x="5" y="45" width="50" height="40" rx="4" fill="#8B5A2B"/>
    <path d="M 30 45 L 30 30 Q 38 25 40 30" stroke="#4FB6A3" stroke-width="3" fill="none"/>
    <!-- Icono Sol + Agua -->
    <circle cx="30" cy="-12" r="8" fill="#FF9F43"/>
    <path d="M 12 -12 Q 12 -5 18 -12" stroke="#5B6FD6" stroke-width="2" fill="none"/>
  </g>

  <!-- Vaso 2: Sin agua -->
  <g transform="translate(370, 210)">
    <rect x="0" y="0" width="60" height="90" rx="8" fill="none" stroke="#5B6FD6" stroke-width="3"/>
    <rect x="5" y="45" width="50" height="40" rx="4" fill="#A28265"/>
    <circle cx="30" cy="55" r="4" fill="#FF9F43"/>
    <!-- Icono Sin Agua (gota tachada) -->
    <path d="M 30 -12 Q 30 -5 36 -12" stroke="#E26D5A" stroke-width="2" fill="none"/>
    <line x1="22" y1="-18" x2="38" y2="-6" stroke="#E26D5A" stroke-width="2"/>
  </g>

  <!-- Vaso 3: Caja oscura -->
  <g transform="translate(500, 195)">
    <rect x="-10" y="-10" width="80" height="110" rx="6" fill="#3A2E2A"/>
    <rect x="-5" y="-5" width="70" height="100" rx="4" fill="#5A4840"/>
    <!-- Icono Caja/Sombra -->
    <circle cx="30" cy="-22" r="8" fill="#232D36"/>
  </g>

  <!-- Plano Frente: Vela sonriente preparando el experimento -->
  <g transform="translate(80, 160) scale(0.85)">
    <ellipse cx="100" cy="150" rx="42" ry="46" fill="#5B6FD6"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <path d="M64 72 Q62 46 100 46 Q138 46 136 72 Q120 56 100 56 Q80 56 64 72 Z" fill="#3A2E2A"/>
    <circle cx="85" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="87" cy="82" r="4" fill="#232D36"/>
    <circle cx="115" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="117" cy="82" r="4" fill="#232D36"/>
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3"/>
  </g>
</svg>
