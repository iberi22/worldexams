<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Vela y Tuerca revisan los tres vasos en la mesa">
  <!-- Plano Fondo: Habitación con calendario / registro -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <rect x="120" y="50" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#5B6FD6" stroke-width="3"/>
  <rect x="120" y="50" width="160" height="30" fill="#5B6FD6"/>
  <!-- Marcas de 7 soles en el calendario -->
  <circle cx="145" cy="100" r="8" fill="#FF9F43"/>
  <circle cx="170" cy="100" r="8" fill="#FF9F43"/>
  <circle cx="195" cy="100" r="8" fill="#FF9F43"/>
  <circle cx="220" cy="100" r="8" fill="#FF9F43"/>
  <circle cx="245" cy="100" r="8" fill="#FF9F43"/>
  <circle cx="145" cy="130" r="8" fill="#FF9F43"/>
  <circle cx="170" cy="130" r="8" fill="#FF9F43"/>

  <!-- Plano Medio: Mesón con los 3 vasos tras 7 días -->
  <rect x="0" y="270" width="800" height="180" fill="#E2C7A7"/>

  <!-- Vaso 1: Brote frondoso y verde -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="60" height="90" rx="8" fill="none" stroke="#5B6FD6" stroke-width="3"/>
    <rect x="5" y="45" width="50" height="40" rx="4" fill="#8B5A2B"/>
    <!-- Tallo alto y 2 hojas verdes -->
    <path d="M 30 45 L 30 15 Q 42 5 45 15 Q 35 25 30 30" fill="#4FB6A3" stroke="#2E623E" stroke-width="2"/>
    <path d="M 30 30 Q 18 20 15 28 Q 25 35 30 35" fill="#4FB6A3" stroke="#2E623E" stroke-width="2"/>
  </g>

  <!-- Vaso 2: Tierra seca sin brote -->
  <g transform="translate(420, 200)">
    <rect x="0" y="0" width="60" height="90" rx="8" fill="none" stroke="#5B6FD6" stroke-width="3"/>
    <rect x="5" y="45" width="50" height="40" rx="4" fill="#A28265"/>
    <circle cx="30" cy="60" r="5" fill="#C8AC8B"/>
  </g>

  <!-- Vaso 3: Fuera de la caja, semilla pálida sin crecer -->
  <g transform="translate(540, 200)">
    <rect x="0" y="0" width="60" height="90" rx="8" fill="none" stroke="#5B6FD6" stroke-width="3"/>
    <rect x="5" y="45" width="50" height="40" rx="4" fill="#8B5A2B"/>
    <circle cx="30" cy="55" r="4" fill="#E8B04B"/>
  </g>

  <!-- Plano Frente: Vela con lupa y Tuerca tomando notas -->
  <!-- Vela con lupa -->
  <g transform="translate(80, 180) scale(0.85)">
    <ellipse cx="100" cy="150" rx="42" ry="46" fill="#5B6FD6"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <path d="M64 72 Q62 46 100 46 Q138 46 136 72 Q120 56 100 56 Q80 56 64 72 Z" fill="#3A2E2A"/>
    <!-- Lupa frente al ojo -->
    <circle cx="120" cy="80" r="16" fill="none" stroke="#FF9F43" stroke-width="4"/>
    <line x1="132" y1="92" x2="148" y2="108" stroke="#FF9F43" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Tuerca con libreta digital -->
  <g transform="translate(630, 170) scale(0.75)">
    <rect x="60" y="115" width="80" height="65" rx="18" fill="#8C9CAE"/>
    <rect x="52" y="40" width="96" height="70" rx="22" fill="#A2B1C1"/>
    <rect x="62" y="50" width="76" height="50" rx="14" fill="#232D36"/>
    <circle cx="82" cy="74" r="12" fill="#4FB6A3"/>
    <circle cx="118" cy="74" r="12" fill="#4FB6A3"/>
  </g>
</svg>
