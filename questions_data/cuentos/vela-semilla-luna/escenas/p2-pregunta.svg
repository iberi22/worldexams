<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="La abuela y Vela conversan con un cuaderno de dibujo">
  <!-- Plano Fondo: Pared cálida y estantes -->
  <rect width="800" height="450" fill="#FDF6EC"/>
  <rect x="80" y="80" width="240" height="12" rx="6" fill="#D8C2A8"/>
  <rect x="520" y="100" width="200" height="12" rx="6" fill="#D8C2A8"/>
  <circle cx="140" cy="55" r="18" fill="#FF9F43"/>
  <rect x="580" y="60" width="30" height="40" rx="4" fill="#4FB6A3"/>

  <!-- Plano Medio: Mesa de madera suave -->
  <rect x="100" y="260" width="600" height="150" rx="16" fill="#E2C7A7"/>
  <rect x="140" y="400" width="30" height="50" fill="#C8AC8B"/>
  <rect x="630" y="400" width="30" height="50" fill="#C8AC8B"/>

  <!-- Plano Frente: Abuela, Vela y cuaderno de investigación -->
  <!-- Abuela a la izquierda -->
  <g transform="translate(140, 160) scale(0.85)">
    <ellipse cx="100" cy="150" rx="46" ry="42" fill="#E26D5A"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <circle cx="100" cy="40" r="16" fill="#D2D7DF"/>
    <path d="M64 76 Q62 50 100 50 Q138 50 136 76 Q120 60 100 60 Q80 60 64 76 Z" fill="#E0E4EB"/>
    <circle cx="84" cy="78" r="10" fill="none" stroke="#FF9F43" stroke-width="3"/>
    <circle cx="116" cy="78" r="10" fill="none" stroke="#FF9F43" stroke-width="3"/>
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3"/>
  </g>

  <!-- Cuaderno abierto en el centro de la mesa -->
  <rect x="340" y="280" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#5B6FD6" stroke-width="3"/>
  <line x1="400" y1="280" x2="400" y2="360" stroke="#5B6FD6" stroke-width="2"/>
  <circle cx="370" cy="310" r="10" fill="#FF9F43" opacity="0.6"/>
  <line x1="420" y1="300" x2="450" y2="300" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>
  <line x1="420" y1="320" x2="445" y2="320" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round"/>

  <!-- Vela a la derecha mirando el cuaderno -->
  <g transform="translate(480, 180) scale(0.8)">
    <ellipse cx="100" cy="150" rx="42" ry="46" fill="#5B6FD6"/>
    <circle cx="100" cy="80" r="36" fill="#FCE0D1"/>
    <path d="M64 72 Q62 46 100 46 Q138 46 136 72 Q120 56 100 56 Q80 56 64 72 Z" fill="#3A2E2A"/>
    <circle cx="85" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="83" cy="82" r="4" fill="#232D36"/>
    <circle cx="115" cy="80" r="9" fill="#FFFFFF"/>
    <circle cx="113" cy="82" r="4" fill="#232D36"/>
    <path d="M92 95 Q100 102 108 95" fill="none" stroke="#3A2E2A" stroke-width="3"/>
  </g>
</svg>
