[package]
name = "hive-relay"
version = "0.1.0"
edition = "2021"
authors = ["World Exams Team"]
license = "AGPL-3.0"
description = "WebSocket signaling relay server for P2P connections"
readme = "README.md"

[lib]
name = "hive_relay"
path = "src/lib.rs"

[[bin]]
name = "hive-relay"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Web Framework (for health/metrics endpoints)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# WebSocket
tungstenite = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "6.0"
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
