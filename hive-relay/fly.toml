# Fly.io configuration for Hive Relay
# Deploy with: fly deploy

app = "worldexams-relay"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_HOST = "0.0.0.0"
  RELAY_PORT = "8080"
  RUST_LOG = "info"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 10000
    soft_limit = 5000

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
