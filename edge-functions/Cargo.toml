[package]
name = "worldexams-edge-functions"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Edge Functions for WorldExams/SaberParaTodos platform (extracted from Edge Hive)"
repository = "https://github.com/world-exams/worldexams"

[dependencies]
# Core
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# HTTP client for external APIs
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }

# Optional: If using with Edge Hive
# edge-hive-db = { git = "https://github.com/USER/termux-private-edge-server", optional = true }
# edge-hive-auth = { git = "https://github.com/USER/termux-private-edge-server", optional = true }

[features]
default = []
edge-hive-integration = []  # Enable when using with Edge Hive
