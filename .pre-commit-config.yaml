# ============================================
# WorldExams Pre-Commit Hook Configuration
# ============================================
# Smart pre-commit validation for WorldExams monorepo
# Install: pre-commit install
# Update: pre-commit autoupdate
# Skip: git commit --no-verify
# ============================================

version: 3.3.0

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

exclude: >
  ^(?:
    node_modules/
    | \.astro/
    | dist/
    | \.wrangler/
    | questions_data/
    | reports/
    | playwright-report/
    | test-results/
    | coverage/
    | \.git/
    | jobs/CO/
    | \.worldexams/generation/history/
    | scripts-temp/
    | temp/
    | ARCHIVED/
    | \.ignored/
  )

repos:
  # ── Secrets detection (CRITICAL) ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.3
    hooks:
      - id: gitleaks
        name: Detect secrets in code
        description: Scans for exposed secrets, API keys, tokens, passwords

  # ── Python security ──
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: Python security scanner
        description: Detect common security issues in Python code
        args: [--skip=B101,B413,B301,PYB012,CRT_POS,SWIFT_POS]
        files: \.py$

  # ── Python formatting ──
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: Format Python
        description: Format Python files with black
        args: [--line-length=120]
        files: \.py$
        pass_filenames: true

  # ── Python import sorting ──
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports
        description: Sort import statements with isort
        args: [--profile=black, --line-length=120]
        files: \.py$
        pass_filenames: true

  # ── YAML / JSON validation ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: Validate YAML files
        files: \.ya?ml$
      - id: check-json
        name: Validate JSON files
        files: \.json$
      - id: check-merge-conflict
        name: Detect merge conflicts
      - id: check-case-conflict
        name: Detect case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: end-of-file-fixer
        name: Fix EOF
      - id: trailing-whitespace
        name: Fix trailing whitespace
        args: [--markdown-fixtures=ignore]
      - id: mixed-line-ending
        name: Normalize line endings

  # ── TypeScript / Astro type check ──
  - repo: local
    hooks:
      - id: astro-check
        name: Astro type check
        entry: bash -c "cd saberparatodos && npx astro check 2>&1 | tail -10"
        language: system
        files: \.(astro|ts|tsx|svelte)$
        pass_filenames: false
        require_serial: true

      - id: tsc-compile
        name: TypeScript compile check
        entry: bash -c "cd saberparatodos && npx tsc --noEmit 2>&1 | grep -E 'error|warning' | head -20 || echo 'No errors'"
        language: system
        files: \.ts$
        pass_filenames: false
        require_serial: true

  # ── Markdown linting ──
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: [--config=.markdownlintrc.json]
        files: \.md$
        pass_filenames: true

  # ── npm audit fast check ──
  - repo: local
    hooks:
      - id: npm-audit-fast
        name: npm audit fast check
        entry: bash -c "cd saberparatodos && npm audit --audit-level=high 2>&1 | grep -E 'vulnerabilities|high|critical' | head -5 || echo 'OK'"
        language: system
        files: package\.json$
        pass_filenames: false

  # ── Block direct main commits ──
  - repo: local
    hooks:
      - id: no-main-commit
        name: Block direct main commits
        entry: bash -c "git branch --show-current | grep -E '^(main|master)$' && exit 1 || exit 0"
        language: system
        stages: [commit-msg]
