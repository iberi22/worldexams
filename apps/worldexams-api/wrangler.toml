name = "worldexams-api"
main = "src/index.ts"
compatibility_date = "2026-03-10"
workers_dev = false

# ⚠️  SECURITY NOTE:
# SUPABASE_ANON_KEY is intentionally public (read-only access, gated by RLS).
# NEVER add SUPABASE_SERVICE_ROLE_KEY here — use `wrangler secret put` instead.
[vars]
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_ANON_KEY = "your_supabase_anon_key_here"

[assets]
directory = "public"
binding = "ASSETS"
# Assets are served before the worker by default, which bypassed the worker's
# /v1/packs guards (internal indexes 404, pack rate limit, CORS). Route packs and
# grade bundles through the worker first; it reads the files via env.ASSETS.
run_worker_first = ["/v1/packs/*", "/v1/grades/*"]

# MESH_STATE: KV E F Í M E R O para rendezvous mesh (TTL ~70s por sala).
# Solo hashes de sala + IDs efímeros de peer. NUNCA datos de usuario.
# Sin binding (dev local) el Worker usa memoria por isolate (best-effort).
[[kv_namespaces]]
binding = "MESH_STATE"
id = "22105f2832e743fa9e202d265bf028a9"
preview_id = "c609d8e05df34ce9b5b41424f8012fce"

# Ranked module (WAVE-16.09): server-authoritative ranked exams + monthly leaderboard.
[[d1_databases]]
binding = "RANKED_DB"
database_name = "worldexams-ranked"
database_id = "6ae1b0c0-0f6d-45b2-854d-cb076b14ea40"
migrations_dir = "migrations"

[[routes]]
pattern = "api.saberparatodos.space/*"
zone_name = "saberparatodos.space"
